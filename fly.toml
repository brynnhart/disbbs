# fly.toml app configuration file generated for dis-bbs-punkyroo on 2025-08-26T09:58:08-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dis-bbs-punkyroo'
primary_region = 'yyz'

[build]

[env]
  DB_PATH = '/data/dis.sqlite3'
  NODE_ENV = 'production'

[[mounts]]
  source = 'dis_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true

  # Keep the WS machine always on (no surprise stops)
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    # Count live sockets, not HTTP requests
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  # Prefer a cheap, fast health endpoint with relaxed timing
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"


[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
