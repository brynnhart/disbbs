<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<title>Dead Internet Society</title>
<style>
  @font-face{
    font-family:'Web IBM VGA';
    src:url('fonts/Web437_IBM_VGA_8x16.woff2') format('woff2'),
        url('fonts/Web437_IBM_VGA_8x16.woff') format('woff');
    font-weight:normal;font-style:normal;font-display:swap;
  }
  :root{
    /* Phosphor redesign token layer */
    --void:#0a0612;
    --panel:#100920;
    --panel-edge:#2a1a3e;
    --phos-bright:#e6d5ff;
    --phos:#c9a8ff;
    --phos-dim:#7a5ba8;
    --phos-faint:#4a3568;
    --venom:#3ddbc4;
    --venom-dim:#1d8f80;
    --spite:#ff5a7a;
    --gold:#e8c15a;

    /* Tunable atmosphere-layer intensities — tweak these in devtools,
       never the effect rules themselves. */
    --scanline-alpha:0.12;
    --scanline-period:3px;   /* 1px dark line per period */
    --glow-radius:5px;
    --glow-alpha:0.35;
    --vignette-alpha:0.35;

    --glow-phos:0 0 var(--glow-radius) rgba(230,213,255,var(--glow-alpha));
    --glow-venom:0 0 var(--glow-radius) rgba(61,219,196,var(--glow-alpha));
    --glow-spite:0 0 var(--glow-radius) rgba(255,90,122,var(--glow-alpha));

    /* Legacy color vars aliased to the phosphor tokens per the server
       color-class remap table — every existing var(--cyan) etc. retunes
       automatically. */
    --bg:var(--void);--fg:var(--phos-bright);
    --red:var(--spite);--green:var(--venom);--yellow:var(--gold);
    --blue:var(--venom-dim);--magenta:var(--phos-bright);
    --cyan:var(--phos);--white:var(--phos-bright);
    --accent:var(--phos);
    --scroll-thumb:rgba(201,168,255,.5);--scroll-track:var(--void);
    --inputbar-h: clamp(44px, 5vh, 72px);
  }
  html,body{height:100%;background:var(--bg);overflow:hidden}
  body{margin:0;color:var(--fg);font:16px/1.35 'Web IBM VGA','VT323',ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2px}
  .app{height:100vh;display:flex;flex-direction:column;background:var(--bg)}
  @supports (height:100dvh){.app{height:100dvh}}
  #terminal{flex:1 1 auto;padding:12px 14px 18px;box-sizing:border-box;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable both-edges;scrollbar-width:thin;scrollbar-color:var(--scroll-thumb) var(--scroll-track);border-bottom:1px solid #0e0e0e}
  #terminal::-webkit-scrollbar{width:8px}
  #terminal::-webkit-scrollbar-track{background:var(--scroll-track)}
  #terminal::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:8px}
  #terminal::-webkit-scrollbar-thumb:hover{background:rgba(201,168,255,.7)}
  ::selection{background:var(--phos-dim);color:var(--phos-bright)}
  .line{white-space:pre-wrap;word-wrap:break-word}
  .line a{color:var(--venom);text-decoration:underline;text-decoration-thickness:1px;text-decoration-color:var(--venom);transition:color .12s ease,text-decoration-color .12s ease;cursor:pointer}
  .line a:hover{color:var(--phos-bright);text-decoration-color:var(--phos-bright)}
  .dim{color:var(--phos-dim);opacity:1;text-shadow:none}
  .red{color:var(--red)} .green{color:var(--green)} .yellow{color:var(--yellow)}
  .blue{color:var(--blue)} .magenta{color:var(--magenta)} .cyan{color:var(--cyan)} .white{color:var(--white)}
  .u{text-decoration:underline}
  img.emoji{display:inline-block;height:1.35em;width:auto;vertical-align:middle;image-rendering:pixelated}
  /* Character rule: ─────◆───── (or ──[ TITLE ]───── for hrTitled). Text
     reset matches the box-frame helper (letter-spacing/line-height break
     unbroken ─ runs the same way they break ═/║). The centered variant is
     a flex row with two independently-clipping run spans either side of
     the ornament — plain overflow:hidden on the whole (generously long)
     string would clip only from the right edge, leaving the ornament
     wherever that ratio happens to fall instead of at true center. */
  .line.rule{white-space:nowrap;overflow:hidden;letter-spacing:0;line-height:1;font-variant-ligatures:none;margin:8px 0;color:var(--phos-dim)}
  .line.rule.rule-centered{display:flex;align-items:baseline}
  .rule-run{flex:1 1 0;overflow:hidden;white-space:nowrap}
  .rule-ornament{flex:0 0 auto;color:var(--venom)}
  .hr-titled-text{color:var(--phos-bright);text-shadow:var(--crt-glow)}
  .banner{text-align:left;margin-bottom:10px}
  .menu-cmd{color:var(--phos-bright)}
  .menu-desc{color:var(--phos-dim);text-transform:uppercase}
  #inputbar{flex:0 0 var(--inputbar-h);display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);box-sizing:border-box}
  .prompt{color:var(--accent)}
  .prompt.limit{color:var(--accent)}
  .prompt.limit.limit-over{color:var(--red)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  #cmdForm{display:flex;flex:1 1 auto;gap:8px;min-width:0;align-items:center}
  .input-shell{position:relative;flex:1 1 auto;min-width:0}
  .input-shell > *{width:100%;box-sizing:border-box;display:block}
  .input-shell > *[hidden]{display:none !important}
  #cmdInput,#cmdTextarea{background:transparent;color:var(--fg);border:none;outline:0;padding:10px 12px;border-radius:0;caret-color:var(--phos);font:inherit}
  #cmdInput{min-height:0}
  #cmdTextarea{min-height:120px;resize:vertical;line-height:1.4;display:block;border-top:1px solid var(--panel-edge)}
  #cmdInput::placeholder,#cmdTextarea::placeholder{color:var(--phos-faint)}
  .input-toggle{appearance:none;border:1px solid var(--panel-edge);background:transparent;color:var(--phos-dim);padding:8px 10px;border-radius:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;line-height:1;transition:border-color .12s ease,color .12s ease,box-shadow .12s ease}
  .input-toggle:hover{border-color:var(--phos);color:var(--phos);box-shadow:var(--glow-phos)}
  .input-toggle:focus-visible{outline:2px solid var(--phos);outline-offset:2px}
  .input-toggle.active{color:var(--phos-bright);border-color:var(--phos);background:transparent}
  .input-toggle-icon{font-size:16px;line-height:1}
  #inputbar.expanded{align-items:flex-start;flex:0 0 auto;padding:10px 12px 12px}
  #inputbar.expanded .prompt{padding-top:8px}
  #inputbar.expanded #cmdForm{align-items:flex-start}
  #inputbar.expanded #cmdForm .btn{align-self:flex-start;margin-top:2px}
  .btn{appearance:none;border:1px solid var(--panel-edge);background:transparent;color:var(--phos-dim);padding:9px 12px;border-radius:0;cursor:pointer;transition:border-color .12s ease,color .12s ease,box-shadow .12s ease}
  .btn:hover{border-color:var(--phos);color:var(--phos);box-shadow:var(--glow-phos)}
  .btn:disabled{cursor:not-allowed;opacity:.55}
  #status-strip{flex:0 0 auto;padding:3px 12px;background:var(--panel);color:var(--phos-dim);font-size:12px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid var(--panel-edge)}
  @media (max-width:480px){ #statusUptimeWrap{display:none} }
  @media (max-width:340px){ #statusChromeWrap{display:none} }
  .svg-splash-wrap{display:flex;justify-content:center;margin:8px 0 12px}
  .svg-splash{max-width:960px;width:96%;height:auto;display:block}
  .line.me {
  background: rgba(122,91,168,0.1);          /* faint phosphor wash */
  border-left: 2px solid var(--phos-dim);
  border-radius: 0;
  padding-left: 8px;
}

/* ===== Shared modal frame system (all ten game/tool modals) ===== */
.term-overlay-backdrop{background:rgba(10,6,18,.9)}
.term-window{background:var(--panel);border:1px solid var(--panel-edge);border-radius:0;box-shadow:0 12px 48px rgba(0,0,0,.55)}
.term-titlebar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.term-titlebar-text{color:var(--phos-bright);font-weight:bold;font-size:13px;letter-spacing:1px;text-shadow:var(--crt-glow)}
/* Pseudo-elements are additive (never conflict with each modal's own
   #XXX-title color rule below), so the ═[ ]═ frame applies here without
   touching cascade order; each #XXX-title rule's color is bumped to
   --phos-bright separately, in place. */
#pxa-title::before,#grf-title::before,#wordle-title::before,#slots-title::before,
#mining-title::before,#bj-title::before,#dots-title::before,#synth-title::before,
#tracker-title::before{content:'\2550[ ';opacity:.6}
#pxa-title::after,#grf-title::after,#wordle-title::after,#slots-title::after,
#mining-title::after,#bj-title::after,#dots-title::after,#synth-title::after,
#tracker-title::after{content:' ]\2550';opacity:.6}
.term-window-controls{display:flex;align-items:center;gap:6px}
.term-btn{appearance:none;border:1px solid var(--panel-edge);background:transparent;color:var(--phos-dim);padding:6px 12px;border-radius:0;cursor:pointer;font:inherit;transition:border-color .12s ease,color .12s ease,box-shadow .12s ease}
.term-btn:hover{border-color:var(--phos);color:var(--phos);box-shadow:var(--glow-phos)}
.term-btn.primary{border-color:var(--venom);color:var(--venom)}
.term-btn.primary:hover{background:rgba(61,219,196,.08)}
.term-window-controls .term-btn{width:24px;height:24px;padding:0;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.term-input,.term-select{background:transparent;color:var(--fg);border:1px solid var(--panel-edge);border-radius:0;padding:6px 10px;font:inherit;outline:none;caret-color:var(--phos)}
.term-input:focus,.term-select:focus{border-color:var(--phos)}
.term-input::placeholder{color:var(--phos-faint)}
/* Each modal's own buttons/inputs are restyled in place below (same
   selectors JS already hooks) rather than overridden here — two rules of
   equal ID/class specificity are resolved by source order, and the
   per-modal rules come later, so a duplicate override here would silently
   lose. */

#pxa-overlay{position:fixed;inset:0;background:rgba(10,6,18,.9);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;box-sizing:border-box}
#pxa-modal{--cell:clamp(22px,3.5vmin,32px);background:var(--panel);border:1px solid var(--panel-edge);border-radius:0;box-shadow:0 12px 48px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:10px;padding:16px;max-height:98vh;overflow:auto;width:fit-content;max-width:98vw}
#pxa-title{color:var(--phos-bright);font-weight:bold;font-size:13px;letter-spacing:1px;text-align:center}
#pxa-grid{display:grid;grid-template-columns:repeat(16,var(--cell));grid-template-rows:repeat(16,var(--cell));border:none;cursor:crosshair;touch-action:none;user-select:none;-webkit-user-select:none}
canvas.pxa-thumb{display:inline-block;vertical-align:middle;image-rendering:pixelated;image-rendering:crisp-edges;flex-shrink:0}
.pxa-cell{width:var(--cell);height:var(--cell);box-sizing:border-box;background:#111;border:1px solid #1e1e1e}
.pxa-cell:hover{outline:1px solid rgba(255,255,255,.25);outline-offset:-1px;z-index:1}
#pxa-palette{display:flex;flex-wrap:wrap;gap:4px}
.pxa-swatch{width:22px;height:22px;border-radius:3px;border:2px solid transparent;cursor:pointer;box-sizing:border-box;flex-shrink:0}
.pxa-swatch.active{border-color:#fff;box-shadow:0 0 0 1px #000}
#pxa-tools{display:flex;gap:6px;align-items:center}
.pxa-tool-btn{appearance:none;border:1px solid var(--panel-edge);background:transparent;color:var(--phos-dim);padding:5px 10px;border-radius:0;cursor:pointer;font:inherit;font-size:12px}
.pxa-tool-btn.active{border-color:var(--venom);color:var(--venom)}
.pxa-tool-btn:hover{border-color:var(--phos);color:var(--phos)}
#pxa-bottom{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#pxa-name{background:transparent;color:var(--fg);border:1px solid var(--panel-edge);border-radius:0;padding:6px 10px;font:inherit;font-size:12px;flex:1;min-width:120px;outline:none;caret-color:var(--phos)}
#pxa-name:focus{border-color:var(--phos)}
#pxa-name::placeholder{color:var(--phos-faint)}
.pxa-action-btn{appearance:none;border:1px solid var(--panel-edge);background:transparent;color:var(--phos-dim);padding:6px 14px;border-radius:0;cursor:pointer;font:inherit;font-size:12px}
.pxa-action-btn.primary{border-color:var(--venom);color:var(--venom)}
.pxa-action-btn:hover{border-color:var(--phos);color:var(--phos)}
.pxa-action-btn.primary:hover{background:rgba(61,219,196,.1)}
#grf-overlay{position:fixed;inset:0;background:rgba(10,6,18,.9);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;box-sizing:border-box}
#grf-modal{background:var(--panel);border:1px solid var(--panel-edge);border-radius:0;box-shadow:0 12px 48px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:10px;padding:16px;max-height:98vh;overflow:auto;width:fit-content;max-width:98vw}
#grf-title{color:var(--phos-bright);font-weight:bold;font-size:13px;letter-spacing:1px;text-align:center}
#grf-grid{display:grid;grid-template-columns:repeat(80,14px);grid-template-rows:repeat(30,14px);border:none;cursor:crosshair;touch-action:none;user-select:none;-webkit-user-select:none}
.grf-cell{width:14px;height:14px;box-sizing:border-box;background:#111;border:1px solid #1e1e1e}
.grf-cell:hover{outline:1px solid rgba(255,255,255,.2);outline-offset:-1px;z-index:1}
#grf-palette{display:flex;flex-wrap:wrap;gap:4px;max-width:1120px}
.grf-swatch{width:22px;height:22px;border-radius:3px;border:2px solid transparent;cursor:pointer;box-sizing:border-box;flex-shrink:0}
.grf-swatch.active{border-color:#fff;box-shadow:0 0 0 1px #000}
#grf-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grf-tool-btn{appearance:none;border:1px solid var(--panel-edge);background:transparent;color:var(--phos-dim);padding:5px 10px;border-radius:0;cursor:pointer;font:inherit;font-size:12px}
.grf-tool-btn.active{border-color:var(--venom);color:var(--venom)}
.grf-tool-btn:hover{border-color:var(--phos);color:var(--phos)}
.grf-action-btn{appearance:none;border:1px solid var(--panel-edge);background:transparent;color:var(--phos-dim);padding:6px 14px;border-radius:0;cursor:pointer;font:inherit;font-size:12px}
.grf-action-btn:hover{border-color:var(--phos);color:var(--phos)}

/* ===== Wordle modal ===== */
#wordle-overlay{position:fixed;inset:0;background:rgba(10,6,18,.9);display:flex;align-items:center;justify-content:center;z-index:1000;padding:12px;box-sizing:border-box}
#wordle-modal{--tile:clamp(40px,11vw,52px);--key:clamp(22px,7vw,30px);background:var(--panel);border:1px solid var(--panel-edge);border-radius:0;box-shadow:0 12px 48px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:10px;padding:16px 14px;max-height:98vh;overflow:auto;width:min(360px,98vw);box-sizing:border-box}
#wordle-title{color:var(--phos-bright);font-weight:bold;font-size:13px;letter-spacing:1px;text-align:center}
#wordle-streak{text-align:center;font-size:11px;color:#888;margin-top:-4px}
#wordle-grid{display:flex;flex-direction:column;gap:5px;align-items:center}
.wl-row{display:flex;gap:5px}
.wl-tile{width:var(--tile);height:var(--tile);border:1px solid #2a2a2a;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,4.5vw,22px);font-weight:bold;text-transform:uppercase;color:var(--fg);box-sizing:border-box;transition:background .15s,border-color .15s}
.wl-tile.correct{background:#2fd44f;border-color:#2fd44f;color:#000}
.wl-tile.present{background:#e3c600;border-color:#e3c600;color:#000}
.wl-tile.absent{background:#1e1e1e;border-color:#1e1e1e;color:#666}
.wl-tile.filled{border-color:#555}
#wordle-msg{text-align:center;font-size:12px;min-height:16px;color:var(--red)}
#wordle-input-row{display:flex;gap:6px}
#wordle-guess-input{background:transparent;color:var(--fg);border:1px solid var(--panel-edge);border-radius:0;padding:8px 10px;font:inherit;font-size:15px;flex:1;outline:none;caret-color:var(--phos);text-transform:uppercase;letter-spacing:4px;min-width:0}
#wordle-guess-input:focus{border-color:var(--phos)}
#wordle-submit-btn{appearance:none;background:rgba(61,219,196,.1);border:1px solid var(--venom);color:var(--venom);border-radius:0;padding:8px 12px;cursor:pointer;font:inherit;font-size:12px;white-space:nowrap}
#wordle-submit-btn:disabled{opacity:.35;cursor:not-allowed}
#wordle-keyboard{display:flex;flex-direction:column;gap:5px;align-items:center}
.wl-kb-row{display:flex;gap:4px;justify-content:center}
.wl-key{appearance:none;background:#1e1e1e;border:1px solid #2a2a2a;color:var(--fg);border-radius:4px;padding:0;cursor:pointer;font:inherit;font-size:clamp(10px,3vw,13px);font-weight:bold;width:var(--key);height:calc(var(--key)*1.35);display:flex;align-items:center;justify-content:center;text-transform:uppercase;flex-shrink:0}
.wl-key.wide{width:calc(var(--key)*1.6);font-size:clamp(9px,2.5vw,11px)}
.wl-key.correct{background:#2fd44f;border-color:#2fd44f;color:#000}
.wl-key.present{background:#e3c600;border-color:#e3c600;color:#000}
.wl-key.absent{background:#111;border-color:#111;color:#444}
#wordle-result{display:none;flex-direction:column;gap:8px;align-items:center;text-align:center}
#wordle-result.show{display:flex}
#wordle-result-msg{font-size:13px;font-weight:bold}
#wordle-chrome{font-size:11px;color:var(--yellow)}
#wordle-share-text{background:#111;border:1px solid #222;border-radius:4px;padding:10px;font-size:13px;white-space:pre;line-height:1.6;cursor:pointer;color:var(--fg);width:100%;box-sizing:border-box;text-align:left;font-family:inherit}
#wordle-share-text:hover{border-color:#333}
.wl-copy-hint{font-size:10px;color:#555}
#wordle-footer{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.wl-footer-btn{appearance:none;border:1px solid var(--panel-edge);background:transparent;color:var(--phos-dim);border-radius:0;padding:6px 14px;cursor:pointer;font:inherit;font-size:12px}
.wl-footer-btn:hover{border-color:var(--phos);color:var(--phos)}
#wordle-stats-panel{display:none;flex-direction:column;gap:6px}
#wordle-stats-panel.show{display:flex}
#wordle-stats-panel h3{margin:0;font-size:12px;color:var(--yellow);font-weight:bold;letter-spacing:.5px}
.wl-stat-row{font-size:12px;color:var(--cyan)}

/* ===== Slots modal ===== */
#slots-overlay{position:fixed;inset:0;background:rgba(10,6,18,.9);display:flex;align-items:center;justify-content:center;z-index:1000;padding:12px;box-sizing:border-box}
#slots-modal{background:var(--panel);border:1px solid var(--panel-edge);border-radius:0;box-shadow:0 12px 48px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:10px;padding:16px 14px;width:min(340px,98vw);box-sizing:border-box}
#slots-title{color:var(--phos-bright);font-weight:bold;font-size:13px;letter-spacing:1px;text-align:center}
#slots-jackpot{text-align:center;font-size:14px;font-weight:bold;color:var(--yellow)}
#slots-balance{text-align:center;font-size:12px;color:#888}
#slots-reels{display:flex;justify-content:center;gap:6px;font-size:36px;line-height:1.2;padding:6px 0}
.sl-reel{width:48px;text-align:center}
#slots-msg{text-align:center;font-size:13px;font-weight:bold;min-height:18px}
#slots-spin-btn{appearance:none;border:1px solid var(--venom);background:rgba(61,219,196,.1);color:var(--venom);font:inherit;font-size:14px;font-weight:bold;padding:10px;border-radius:0;cursor:pointer;width:100%;letter-spacing:.4px}
#slots-spin-btn:hover:not(:disabled){background:rgba(61,219,196,.18)}
#slots-spin-btn:disabled{opacity:.35;cursor:not-allowed}
#slots-history{font-size:11px;color:#555;display:flex;flex-direction:column;gap:3px;min-height:16px}
#slots-close-btn{appearance:none;border:1px solid var(--panel-edge);background:none;color:var(--phos-dim);font:inherit;font-size:12px;padding:7px;border-radius:0;cursor:pointer;width:100%}
#slots-close-btn:hover{border-color:var(--phos);color:var(--phos)}

/* ===== Mining modal ===== */
#mining-overlay{position:fixed;inset:0;background:rgba(10,6,18,.9);display:flex;align-items:center;justify-content:center;z-index:1000;padding:12px;box-sizing:border-box;overflow-y:auto}
#mining-modal{background:var(--panel);border:1px solid var(--panel-edge);border-radius:0;box-shadow:0 12px 48px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:10px;padding:16px 14px;width:min(640px,98vw);max-height:95vh;overflow-y:auto;box-sizing:border-box}
#mining-title{color:var(--phos-bright);font-weight:bold;font-size:13px;letter-spacing:1px;text-align:center}
#mining-status{text-align:center;font-size:12px;color:#888}
#mining-balance{text-align:center;font-size:12px;color:#888}
#mining-grid-wrap{overflow-x:auto}
#mining-grid{display:grid;grid-template-columns:repeat(40,14px);gap:1px;background:#111;border:1px solid #1a1a1a;width:fit-content}
.mn-cell{width:14px;height:14px;background:#1e1e1e;cursor:pointer;box-sizing:border-box}

/* ===== CRT effect layer ===== */
#crt-scanlines,#crt-vignette{position:fixed;inset:0;pointer-events:none;z-index:9999;display:none}
#crt-scanlines{background:repeating-linear-gradient(180deg,rgba(0,0,0,var(--scanline-alpha)) 0px,rgba(0,0,0,var(--scanline-alpha)) 1px,transparent 1px,transparent var(--scanline-period))}
#crt-vignette{background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,var(--vignette-alpha)) 100%)}
body[data-crt="soft"] #crt-scanlines,body[data-crt="soft"] #crt-vignette,
body[data-crt="full"] #crt-scanlines,body[data-crt="full"] #crt-vignette{display:block}
body[data-crt="full"] #crt-scanlines{animation:crtFlicker 5s ease-in-out infinite}
@keyframes crtFlicker{0%,100%{opacity:1}50%{opacity:.97}}

/* Glow on system chrome only — never on .line (perf: thousands of chat
   lines with text-shadow would jank scroll), and never on dim/secondary
   text (dim + glow reads as an illegible smear). --crt-glow* vars cascade
   from body[data-crt] down to modal titles and the menu frame.
   text-shadow is inherited, so .line is force-reset to none first (stops
   inheritance for every regular chat/print line, no matter how many scroll
   by); specific bright-text selectors re-enable it individually — never via
   a blanket ".banner .line"-style descendant selector, which would catch
   the banner's own dim copyright/node lines too.
   --crt-glow-venom-frame is intentionally half strength (frame characters
   should read crisp, not fuzzy) — a derived value, not a change to the
   --glow-alpha/--glow-radius tunables themselves. */
body{--crt-glow:none;--crt-glow-venom:none;--crt-glow-venom-frame:none;--crt-glow-spite:none}
body[data-crt="soft"]{
  --crt-glow:var(--glow-phos);
  --crt-glow-venom:var(--glow-venom);

}
body[data-crt="full"]{

/* The frame's own row divs get a full reset — letter-spacing breaks every
   unbroken run into visibly separated dots, and the body's 1.35 line-height
   inserts a gap between stacked rows that segments the ║ verticals into
   dashes. Both must reset on the row itself, not just the border-char
   spans, so border and content characters advance at the same rate. */
/* Fallback only: a frame row wider than the negotiated column count
   scrolls horizontally instead of wrapping (which would shatter the
   ╔═╗/║ ║ borders). The primary fix is server-side cols-aware layout;
   this is just the safety net for anything still too wide. */
.frame-line{letter-spacing:0;line-height:1;font-variant-ligatures:none;white-space:pre;overflow-x:auto}
.frame-char{color:var(--venom);text-shadow:var(--crt-glow-venom-frame)}

  </div>

<script>
(function(){
  var term  = document.getElementById('terminal');
  var inputBar = document.getElementById('inputbar');
  var form  = document.getElementById('cmdForm');
  var singleInput = document.getElementById('cmdInput');
  var textareaInput = document.getElementById('cmdTextarea');
  var inputToggleBtn = document.getElementById('inputToggle');
  var inputToggleIcon = inputToggleBtn && inputToggleBtn.querySelector('.input-toggle-icon');
  var inputToggleLabel = inputToggleBtn && inputToggleBtn.querySelector('.input-toggle-label');
  var input = singleInput || textareaInput;
  var submitBtn = form ? form.querySelector('button[type="submit"]') : null;
  var promptEl = document.querySelector('.prompt');
  var promptDefault = 'DIS>';
  var promptLabel = promptDefault;
  var inputLimit = null;
  var isExpandedInput = false;
  var pendingPlayWindow = null;
  var pendingAuthToken = null;

  // ===== Status strip =====
  var statusUserEl = document.getElementById('statusUser');
  var statusScreenEl = document.getElementById('statusScreen');
  var statusChromeWrapEl = document.getElementById('statusChromeWrap');
  var statusChromeEl = document.getElementById('statusChrome');
  var statusClockEl = document.getElementById('statusClock');
  var statusUptimeEl = document.getElementById('statusUptime');
  var statusUsername = null;
  var statusScreenLabel = 'MAIN';

  function updateStatusUser(name){
    statusUsername = name;
    if (statusUserEl) statusUserEl.textContent = name || 'guest';
  }

  function updateStatusScreenFromCommand(raw){
    var m = /^\/([a-z][a-z0-9_-]*)/i.exec((raw || '').trim());
    if (!m) return;
    statusScreenLabel = m[1].toUpperCase();
    if (statusScreenEl) statusScreenEl.textContent = statusScreenLabel;
  }

  function updateStatusChrome(amount){
    if (!statusChromeWrapEl || !statusChromeEl) return;
    statusChromeEl.textContent = String(amount);
    statusChromeWrapEl.hidden = false;
  }

  var pageLoadEpochMs = Date.now();
  function formatUptime(ms){
    var totalSec = Math.max(0, Math.floor(ms / 1000));
    var h = Math.floor(totalSec / 3600);
    var m = Math.floor((totalSec % 3600) / 60);
    var s = totalSec % 60;
    function pad(n){ return n < 10 ? '0' + n : String(n); }
    return pad(h) + ':' + pad(m) + ':' + pad(s);
  }
  function tickStatusClock(){
    if (statusClockEl) {
      var d = new Date();
      function pad(n){ return n < 10 ? '0' + n : String(n); }
      statusClockEl.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    }
    if (statusUptimeEl) statusUptimeEl.textContent = formatUptime(Date.now() - pageLoadEpochMs);
  }
  tickStatusClock();
  setInterval(tickStatusClock, 1000);

  // ===== /main flavor line: server prints an empty #main-flavor anchor;
  // client picks one line at random per render. Punky will rewrite this
  // list — structure matters here, copy is placeholder. =====
  var FLAVOR_LINES = [
    'signal integrity 98.2% — the machine persists. /donate keeps it fed',
    'sysop has not slept. this is normal. /donate for coffee',
    'carrier stable. dead air is a lie.',
    'node maintained by one goth and spite. /donate',
    'all timelines converge on /main',
    'the internet died. we kept the good part.'
  ];
  function renderMainFlavor(){
    var anchor = document.getElementById('main-flavor');
    if (!anchor) return;
    var line = FLAVOR_LINES[Math.floor(Math.random() * FLAVOR_LINES.length)];
    var div = document.createElement('div');
    div.className = 'line dim';
    div.textContent = line;
    anchor.innerHTML = '';
    anchor.appendChild(div);
  }

  if (singleInput && textareaInput){
    textareaInput.value = singleInput.value || '';
    if (!textareaInput.placeholder) textareaInput.placeholder = singleInput.placeholder || '';
  }

  if (!textareaInput && inputToggleBtn){
    inputToggleBtn.hidden = true;
  }

  (function fetchStats(){
    fetch('/api/stats')
      .then(function(r){ return r.json(); })
      .then(function(data){
        var el = document.getElementById('dis-stats');
        if (!el) return;
        var members = (data.members || 0).toLocaleString();
        var online  = data.online || 0;
        el.textContent = members + ' members  •  ' + online + ' online now';
      })
      .catch(function(){
        // silently fail — stats are cosmetic
      });
  })();

  // ===== Audio support =====
  var AUDIO_CACHE = new Map();
  var AUDIO_UNLOCKED = false;
  var BEEP_CTX = null;

  function unlockAudioOnce(){
    AUDIO_UNLOCKED = true;
    try { if (!BEEP_CTX) BEEP_CTX = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
  // Unlock on first user interaction (required by autoplay policies)
  window.addEventListener('pointerdown', unlockAudioOnce, { once: true });
  window.addEventListener('keydown', unlockAudioOnce, { once: true });

  function op_audio(src, volume){
    if (!src || !AUDIO_UNLOCKED) return;
    var key = String(src);
    var a = AUDIO_CACHE.get(key);
    if (!a){
      a = new Audio(key);
      a.preload = 'auto';
      AUDIO_CACHE.set(key, a);
    }
    try {
      if (typeof volume === 'number') a.volume = Math.max(0, Math.min(1, volume));
      a.currentTime = 0;
      a.play().catch(function(){ /* ignore: user has not interacted yet */ });
    } catch(e){ /* ignore */ }
  }

  function op_beep(kind){
    if (!AUDIO_UNLOCKED || !BEEP_CTX) return;
    try {
      var o = BEEP_CTX.createOscillator();
      var g = BEEP_CTX.createGain();
      o.connect(g); g.connect(BEEP_CTX.destination);
      o.type = 'triangle';
      // pick a short attention tone; vary by kind if desired
      o.frequency.value = (kind === 'mention') ? 880 : 660;

      var now = BEEP_CTX.currentTime;
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.25, now + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);

      o.start(now);
      o.stop(now + 0.17);
    } catch(e){ /* ignore */ }
  }

  function op_auth(token){
    if (!token) return;
    fetch('/api/auth/complete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ token: token })
    }).then(function(res){
      if (!res.ok) throw new Error('Auth completion failed');
    }).catch(function(err){
      console.error('SSO auth completion failed', err);
    });
  }

  // ===== Synth Engine (pure, stateless voices — no UI coupling) =====
  // A future /tracker feature can call playNote() directly with scheduled timestamps.
  var SYNTH_INIT_PATCH = {
    v: 1, osc1_wave: 'sawtooth', osc1_coarse: 0, osc1_fine: 0, osc1_level: 0.8,
    osc2_wave: 'square', osc2_coarse: 0, osc2_fine: 0, osc2_level: 0.0,
    noise_level: 0.0, filter_type: 'lowpass', filter_cutoff: 0.65, filter_res: 0.15,
    filter_env_amt: 0.0, amp_a: 0.005, amp_d: 0.25, amp_s: 0.6, amp_r: 0.25,
    mod_a: 0.001, mod_d: 0.15, mod_dest: 'off', mod_amt: 0.0,
    lfo_wave: 'triangle', lfo_rate: 0.3, lfo_depth: 0.0, lfo_dest: 'off',
    drive: 0.0, delay_send: 0.0, delay_time: 0.35, delay_fb: 0.35, volume: 0.8
  };

  var synthCtx = null;
  var synthMaster = null, synthDelayNode = null, synthDelayFeedback = null, synthDelayWet = null, synthNoiseBuffer = null;

  function ensureAudioContext(){
    if (!synthCtx){
      synthCtx = new (window.AudioContext || window.webkitAudioContext)();

      synthMaster = synthCtx.createGain();
      synthMaster.gain.value = 1;
      synthMaster.connect(synthCtx.destination);

      // One shared delay line at master level, fed by per-voice send gains.
      synthDelayNode = synthCtx.createDelay(1.0);
      synthDelayNode.delayTime.value = 0.35;
      synthDelayFeedback = synthCtx.createGain();
      synthDelayFeedback.gain.value = 0.35;
      synthDelayWet = synthCtx.createGain();
      synthDelayWet.gain.value = 1;
      synthDelayNode.connect(synthDelayFeedback);
      synthDelayFeedback.connect(synthDelayNode);
      synthDelayNode.connect(synthDelayWet);
      synthDelayWet.connect(synthMaster);

      // One shared 2-second white noise buffer, looped per voice.
      var noiseBuf = synthCtx.createBuffer(1, synthCtx.sampleRate * 2, synthCtx.sampleRate);
      var noiseData = noiseBuf.getChannelData(0);
      for (var ni = 0; ni < noiseData.length; ni++) noiseData[ni] = Math.random() * 2 - 1;
      synthNoiseBuffer = noiseBuf;
    }
    if (synthCtx.state === 'suspended'){ try { synthCtx.resume(); } catch(e){} }
    return synthCtx;
  }

  function synthCutoffHz(v){ return 20 * Math.pow(900, v); }       // 0..1 -> ~20 Hz..18 kHz
  function synthLfoHz(v){ return 0.05 * Math.pow(600, v); }        // 0..1 -> ~0.05..30 Hz
  function synthMidiToFreq(m){ return 440 * Math.pow(2, (m - 69) / 12); }

  function synthDriveCurve(amount){
    var k = amount * 50 + 1;
    var n = 256;
    var curve = new Float32Array(n);
    var norm = Math.tanh(k);
    for (var i = 0; i < n; i++){
      var x = (i / (n - 1)) * 2 - 1;
      curve[i] = Math.tanh(k * x) / norm;
    }
    return curve;
  }

  // Builds a fresh node graph for one note and schedules its envelopes.
  // Returns { stop(atTime) } to trigger release early (e.g. on key-up).
  function playNote(patch, midiNote, when, duration){
    var ctx = ensureAudioContext();
    var t0 = (typeof when === 'number') ? when : ctx.currentTime;
    var dur = (typeof duration === 'number' && duration > 0) ? duration : 0.5;
    var baseFreq = synthMidiToFreq(midiNote);
    var cutoffHz = Math.min(20000, Math.max(20, synthCutoffHz(patch.filter_cutoff)));

    var nodes = [];   // everything, for disconnect() on cleanup
    var sources = []; // AudioScheduledSourceNode-likes, for stop()
    function trackNode(n){ nodes.push(n); return n; }
    function trackSource(n){ nodes.push(n); sources.push(n); return n; }

    var osc1 = trackSource(ctx.createOscillator());
    var osc2 = trackSource(ctx.createOscillator());
    var noiseSrc = trackSource(ctx.createBufferSource());
    noiseSrc.buffer = synthNoiseBuffer; noiseSrc.loop = true;

    osc1.type = patch.osc1_wave; osc2.type = patch.osc2_wave;
    osc1.frequency.value = baseFreq * Math.pow(2, patch.osc1_coarse / 12);
    osc2.frequency.value = baseFreq * Math.pow(2, patch.osc2_coarse / 12);
    osc1.detune.value = patch.osc1_fine;
    osc2.detune.value = patch.osc2_fine;

    var osc1Gain = trackNode(ctx.createGain()); osc1Gain.gain.value = patch.osc1_level;
    var osc2Gain = trackNode(ctx.createGain()); osc2Gain.gain.value = patch.osc2_level;
    var noiseGain = trackNode(ctx.createGain()); noiseGain.gain.value = patch.noise_level;
    osc1.connect(osc1Gain); osc2.connect(osc2Gain); noiseSrc.connect(noiseGain);

    var filter = trackNode(ctx.createBiquadFilter());
    filter.type = patch.filter_type;
    filter.frequency.value = cutoffHz;
    filter.Q.value = 0.5 + patch.filter_res * 19.5; // 0..1 -> Q 0.5..20

    var driveNode = null;
    if (patch.drive > 0){
      driveNode = trackNode(ctx.createWaveShaper());
      driveNode.curve = synthDriveCurve(patch.drive);
      driveNode.oversample = '2x';
      osc1Gain.connect(driveNode); osc2Gain.connect(driveNode); noiseGain.connect(driveNode);
      driveNode.connect(filter);
    } else {
      osc1Gain.connect(filter); osc2Gain.connect(filter); noiseGain.connect(filter);
    }

    var ampGain = trackNode(ctx.createGain());
    ampGain.gain.setValueAtTime(0.0001, t0);
    filter.connect(ampGain);

    var patchVol = trackNode(ctx.createGain());
    patchVol.gain.value = patch.volume;
    ampGain.connect(patchVol);
    patchVol.connect(synthMaster);

    var delaySendGain = trackNode(ctx.createGain());
    delaySendGain.gain.value = patch.delay_send;
    patchVol.connect(delaySendGain);
    delaySendGain.connect(synthDelayNode);
    var cappedFb = Math.min(0.85, Math.max(0, patch.delay_fb));
    synthDelayNode.delayTime.setTargetAtTime(patch.delay_time, t0, 0.01);
    synthDelayFeedback.gain.setTargetAtTime(cappedFb, t0, 0.01);

    // Amp envelope (ADSR). Its shape also drives the filter envelope amount below.
    var ampA = Math.max(0.001, patch.amp_a);
    var ampD = Math.max(0.001, patch.amp_d);
    var ampR = Math.max(0.001, patch.amp_r);
    var sustainGain = patch.amp_s;
    ampGain.gain.linearRampToValueAtTime(1, t0 + ampA);
    ampGain.gain.setTargetAtTime(sustainGain, t0 + ampA, ampD);

    // Filter envelope amount: additive Hz offset on filter.frequency, following the amp envelope's shape.
    var filterEnvDepthGain = null;
    if (patch.filter_env_amt !== 0){
      var envSrc1 = trackSource(ctx.createConstantSource()); envSrc1.offset.value = 1;
      filterEnvDepthGain = trackNode(ctx.createGain());
      var peakOffset = cutoffHz * (Math.pow(2, patch.filter_env_amt * 4) - 1);
      filterEnvDepthGain.gain.setValueAtTime(0, t0);
      filterEnvDepthGain.gain.linearRampToValueAtTime(peakOffset, t0 + ampA);
      filterEnvDepthGain.gain.setTargetAtTime(peakOffset * sustainGain, t0 + ampA, ampD);
      envSrc1.connect(filterEnvDepthGain);
      filterEnvDepthGain.connect(filter.frequency);
      envSrc1.start(t0);
    }

    // Mod envelope: one-shot attack/decay, routed to filter (Hz) or pitch (cents).
    if (patch.mod_dest !== 'off' && patch.mod_amt !== 0){
      var modA = Math.max(0.001, patch.mod_a);
      var modD = Math.max(0.001, patch.mod_d);
      var envSrc2 = trackSource(ctx.createConstantSource()); envSrc2.offset.value = 1;
      var modDepthGain = trackNode(ctx.createGain());
      envSrc2.connect(modDepthGain);
      if (patch.mod_dest === 'filter'){
        var modPeakHz = cutoffHz * (Math.pow(2, patch.mod_amt * 4) - 1);
        modDepthGain.gain.setValueAtTime(0, t0);
        modDepthGain.gain.linearRampToValueAtTime(modPeakHz, t0 + modA);
        modDepthGain.gain.setTargetAtTime(0, t0 + modA, modD);
        modDepthGain.connect(filter.frequency);
      } else if (patch.mod_dest === 'pitch'){
        var modPeakCents = patch.mod_amt * 48 * 100;
        modDepthGain.gain.setValueAtTime(0, t0);
        modDepthGain.gain.linearRampToValueAtTime(modPeakCents, t0 + modA);
        modDepthGain.gain.setTargetAtTime(0, t0 + modA, modD);
        modDepthGain.connect(osc1.detune);
        modDepthGain.connect(osc2.detune);
      }
      envSrc2.start(t0);
    }

    // LFO: one OscillatorNode per voice, routed per lfo_dest.
    if (patch.lfo_dest !== 'off' && patch.lfo_depth > 0){
      var lfo = trackSource(ctx.createOscillator());
      lfo.type = patch.lfo_wave;
      lfo.frequency.value = synthLfoHz(patch.lfo_rate);
      var lfoDepthGain = trackNode(ctx.createGain());
      lfo.connect(lfoDepthGain);
      if (patch.lfo_dest === 'pitch'){
        lfoDepthGain.gain.value = patch.lfo_depth * 100;
        lfoDepthGain.connect(osc1.detune); lfoDepthGain.connect(osc2.detune);
      } else if (patch.lfo_dest === 'filter'){
        lfoDepthGain.gain.value = cutoffHz * patch.lfo_depth * 2;
        lfoDepthGain.connect(filter.frequency);
      } else if (patch.lfo_dest === 'amp'){
        lfoDepthGain.gain.value = patch.lfo_depth * 0.4;
        lfoDepthGain.connect(ampGain.gain);
      }
      lfo.start(t0);
    }

    osc1.start(t0); osc2.start(t0); noiseSrc.start(t0);

    // Default release (if stop() is never called): natural note-off at t0+dur.
    ampGain.gain.setValueAtTime(sustainGain, t0 + dur);
    ampGain.gain.setTargetAtTime(0.0001, t0 + dur, ampR);
    if (filterEnvDepthGain) filterEnvDepthGain.gain.setTargetAtTime(0, t0 + dur, ampR);
    scheduleStop(t0 + dur + ampR * 5 + 0.05);

    function scheduleStop(atTime){
      sources.forEach(function(s){ try { s.stop(atTime); } catch(e){} });
    }

    var cleaned = false;
    osc1.onended = function(){
      if (cleaned) return;
      cleaned = true;
      nodes.forEach(function(n){ try { n.disconnect(); } catch(e){} });
    };

    return {
      stop: function(atTime){
        var st = (typeof atTime === 'number') ? atTime : ctx.currentTime;
        try { ampGain.gain.cancelAndHoldAtTime(st); } catch(e){ try { ampGain.gain.cancelScheduledValues(st); } catch(e2){} }
        ampGain.gain.setTargetAtTime(0.0001, st, ampR);
        if (filterEnvDepthGain){
          try { filterEnvDepthGain.gain.cancelAndHoldAtTime(st); } catch(e){ try { filterEnvDepthGain.gain.cancelScheduledValues(st); } catch(e2){} }
          filterEnvDepthGain.gain.setTargetAtTime(0, st, ampR);
        }
        scheduleStop(st + ampR * 5 + 0.05);
      }
    };
  }

  // ===== Synth Modal UI =====
  var SYNTH_WAVEFORMS_UI = ['sine', 'triangle', 'sawtooth', 'square'];

  function synthFmtSeconds(v){ return v.toFixed(v < 1 ? 3 : 2) + ' s'; }

  var SYNTH_FIELD_CFG = {
    osc1_coarse:    { min:-24, max:24, step:1, big:12, integer:true, fmt:function(v){ return synthFmtSigned(v, ' st'); } },
    osc1_fine:      { min:-100, max:100, step:1, big:10, fmt:function(v){ return synthFmtSigned(Math.round(v), ' ct'); } },

    osc2_coarse:    { min:-24, max:24, step:1, big:12, integer:true, fmt:function(v){ return synthFmtSigned(v, ' st'); } },

    amp_d:          { min:0.001, max:4, step:0.01, big:0.1, fmt:synthFmtSeconds },
    amp_s:          { min:0, max:1, step:0.01, big:0.1, fmt:function(v){ return v.toFixed(2); } },
    amp_r:          { min:0.001, max:8, step:0.02, big:0.2, fmt:synthFmtSeconds },

  function synthClonePatch(p){ var out = {}; for (var k in p) out[k] = p[k]; return out; }

  function synthBarText(frac){
    frac = Math.max(0, Math.min(1, frac));
    var filled = Math.round(frac * SYNTH_BAR_CHARS);
    var s = '[';
    for (var i = 0; i < SYNTH_BAR_CHARS; i++) s += (i < filled) ? '█' : '░';
    return s + ']';
  }

  function synthBuildSection(parent, title){
    var sec = document.createElement('div'); sec.className = 'synth-section';

    sec.appendChild(head);

  function synthBuildSliderRow(container, key, labelText){
    var cfg = SYNTH_FIELD_CFG[key];
    var row = document.createElement('div'); row.className = 'synth-ctrl'; row.tabIndex = 0; row.dataset.key = key;
    var lab = document.createElement('span'); lab.className = 'synth-ctrl-label'; lab.textContent = labelText;
    var bar = document.createElement('span'); bar.className = 'synth-ctrl-bar';
    var val = document.createElement('span'); val.className = 'synth-ctrl-val';
    row.appendChild(lab); row.appendChild(bar); row.appendChild(val);
    container.appendChild(row);

    function render(){
      var v = synthPatch[key];
      var frac = (v - cfg.min) / (cfg.max - cfg.min);
      bar.textContent = synthBarText(frac);
      val.textContent = cfg.fmt(v);
    }
    function setFromFrac(frac){
      frac = Math.max(0, Math.min(1, frac));
      var v = cfg.min + frac * (cfg.max - cfg.min);
      if (cfg.integer) v = Math.round(v);
      synthPatch[key] = v;
      render();
    }
    function nudge(dir, big){
      var step = big ? cfg.big : cfg.step;
      var v = Math.max(cfg.min, Math.min(cfg.max, synthPatch[key] + dir * step));
      if (cfg.integer) v = Math.round(v);
      synthPatch[key] = v;
      render();
    }

    var dragging = false;
    row.addEventListener('pointerdown', function(e){
      dragging = true;
      try { row.setPointerCapture(e.pointerId); } catch(err){}
      var rect = bar.getBoundingClientRect();
      setFromFrac((e.clientX - rect.left) / rect.width);
      ensureAudioContext(); updateSynthPowerStrip();
      e.preventDefault();
    });
    row.addEventListener('pointermove', function(e){
      if (!dragging) return;
      var rect = bar.getBoundingClientRect();
      setFromFrac((e.clientX - rect.left) / rect.width);
    });
    row.addEventListener('pointerup', function(){ dragging = false; });
    row.addEventListener('pointercancel', function(){ dragging = false; });
    row.addEventListener('keydown', function(e){
      if (e.key === 'ArrowRight' || e.key === 'ArrowUp'){ e.preventDefault(); nudge(1, e.shiftKey); }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown'){ e.preventDefault(); nudge(-1, e.shiftKey); }
    });

    synthControls[key] = { render: render };
  }

  function synthBuildEnumRow(container, key, labelText, allowed){
    var row = document.createElement('div'); row.className = 'synth-enum'; row.tabIndex = 0; row.dataset.key = key;
    var lab = document.createElement('span'); lab.className = 'synth-ctrl-label'; lab.textContent = labelText;
    var val = document.createElement('span'); val.className = 'synth-enum-val';
    row.appendChild(lab); row.appendChild(val);
    container.appendChild(row);

    function render(){ val.textContent = String(synthPatch[key]).toUpperCase(); }
    function cycle(){
      var idx = allowed.indexOf(synthPatch[key]);
      synthPatch[key] = allowed[(idx + 1) % allowed.length];
      render();
    }
    row.addEventListener('click', function(){ ensureAudioContext(); updateSynthPowerStrip(); cycle(); });
    row.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); cycle(); }
    });

    synthControls[key] = { render: render };
  }

  function synthApplyPatch(p){
    synthPatch = synthClonePatch(p);
    Object.keys(synthControls).forEach(function(k){ synthControls[k].render(); });
  }

  function synthRandomPatch(){
    function rf(min, max){ return min + Math.random() * (max - min); }
    function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
    var hasMod = Math.random() < 0.5;
    var hasLfo = Math.random() < 0.4;
    return {
      v: 1,
      osc1_wave: pick(SYNTH_WAVEFORMS_UI), osc1_coarse: Math.round(rf(-12, 12)), osc1_fine: Math.round(rf(-15, 15)), osc1_level: rf(0.5, 1),
      osc2_wave: pick(SYNTH_WAVEFORMS_UI), osc2_coarse: Math.round(rf(-12, 12)), osc2_fine: Math.round(rf(-15, 15)),
      osc2_level: Math.random() < 0.5 ? rf(0.2, 0.7) : 0,
      noise_level: Math.random() < 0.3 ? rf(0.1, 0.4) : 0,
      filter_type: pick(SYNTH_FILTER_TYPES_UI), filter_cutoff: rf(0.3, 1), filter_res: rf(0, 0.5), filter_env_amt: rf(-0.6, 0.8),
      amp_a: rf(0.001, 1), amp_d: rf(0.05, 1.2), amp_s: rf(0, 0.9), amp_r: rf(0.05, 1.5), // guardrail: attack <= 1s
      mod_a: rf(0.001, 0.3), mod_d: rf(0.03, 0.6),
      mod_dest: hasMod ? pick(['filter', 'pitch']) : 'off', mod_amt: hasMod ? rf(-1, 1) : 0,
      lfo_wave: pick(SYNTH_WAVEFORMS_UI), lfo_rate: rf(0.1, 0.6),
      lfo_depth: hasLfo ? rf(0.1, 0.6) : 0, lfo_dest: hasLfo ? pick(['pitch', 'filter', 'amp']) : 'off',
      drive: Math.random() < 0.3 ? rf(0.1, 0.5) : 0,
      delay_send: Math.random() < 0.3 ? rf(0.1, 0.4) : 0, delay_time: rf(0.1, 0.6), delay_fb: rf(0, 0.7), // guardrail: delay_fb <= 0.7
      volume: rf(0.55, 0.8), // guardrail: moderate volume
    };
  }

  function synthSetOctave(v){

  function updateSynthPowerStrip(){

  function synthShowMsg(text, cls){

  function synthPianoNoteOn(k){
    var ctx = ensureAudioContext(); updateSynthPowerStrip();
    var midi = (synthOctave + 1) * 12 + SYNTH_KEYMAP[k];
    if (synthActiveVoice) synthActiveVoice.handle.stop(ctx.currentTime);
    var handle = playNote(synthPatch, midi, ctx.currentTime, 60);
    synthActiveVoice = { handle: handle, key: k };
  }

  function synthKeyDown(e){
    if (document.activeElement === synthNameInput) return;
    var k = e.key.toLowerCase();
    if (Object.prototype.hasOwnProperty.call(SYNTH_KEYMAP, k)){
      e.preventDefault();
      if (e.repeat || synthHeldKeys[k]) return;
      synthHeldKeys[k] = true;
      synthPianoNoteOn(k);
    } else if (k === ','){
      e.preventDefault(); synthSetOctave(synthOctave - 1);
    } else if (k === '.'){
      e.preventDefault(); synthSetOctave(synthOctave + 1);
    }
  }
  function synthKeyUp(e){
    var k = e.key.toLowerCase();
    if (Object.prototype.hasOwnProperty.call(SYNTH_KEYMAP, k)){
      delete synthHeldKeys[k];
      if (synthActiveVoice && synthActiveVoice.key === k){
        synthActiveVoice.handle.stop(ensureAudioContext().currentTime);
        synthActiveVoice = null;
      }
    }
  }
  function synthEscHandler(e){ if (e.key === 'Escape') closeSynth(); }

  function synthDoSave(){
    if (!ws || ws.readyState !== WebSocket.OPEN){ synthShowMsg('Not connected. Cannot save.', 'red'); return; }
    var name = synthNameInput.value.trim();
    if (!name){ synthShowMsg('Enter a name before saving.', 'yellow'); return; }
    if (!/^[a-z0-9-]{1,32}$/.test(name)){ synthShowMsg('Name must be lowercase letters, numbers, and hyphens only.', 'yellow'); return; }
    if (synthEditMode || (synthLoadedId && synthOwned && name === synthLoadedName)){
      ws.send(JSON.stringify({ type: 'update_patch', id: synthLoadedId, name: name, patch_data: synthPatch }));
    } else {
      ws.send(JSON.stringify({ type: 'save_patch', name: name, patch_data: synthPatch }));
    }
  }

  var trackerTimerId = null;
  var trackerRafId = null;
  var trackerNextStepIndex = 0;
  var trackerNextStepTime = 0;
  var trackerScheduled = [];
  var trackerCurrentStepDisplayed = -1;
  var trackerRowEls = [];
  var trackerCellEls = [];       // trackerCellEls[row][track] -> DOM element
  var trackerHeadCellEls = [];   // trackerHeadCellEls[track] -> DOM element
  var trackerMsgEl = null;
  var trackerPowerStrip = null;
  var trackerPlayBtn = null;
  var trackerTitleEl = null;
  var trackerNameInput = null;
  var trackerBpmInput = null;
  var trackerGridEl = null;
  var trackerOctLabelEl = null;
  var trackerPatchListCache = [];
  var trackerCursorRow = 0;
  var trackerCursorTrack = 0;
  var trackerOctave = 3;
  var trackerPickerEl = null;
  var trackerPickerListEl = null;
  var trackerPickerFilterInput = null;
  var trackerPickerOpen = false;
  var trackerPickerTargetTrack = -1;

  function trackerNoteLabel(midi){
    var name = TRACKER_NOTE_NAMES[((midi % 12) + 12) % 12];
    var oct = Math.floor(midi / 12) - 1;
    var letter = name.charAt(0);
    var accidental = name.length === 2 ? '#' : '-';
    return letter + accidental + oct;
  }

  function trackerCloneSong(s){ return JSON.parse(JSON.stringify(s)); }

  function trackerBuildEmptySong(){
    var tracks = [];
    for (var i = 0; i < TRACKER_TRACK_COUNT; i++){
      tracks.push({ patch_name: '(init)', patch: synthClonePatch(SYNTH_INIT_PATCH), cells: new Array(TRACKER_STEPS).fill(null) });
    }
    return { v: 1, bpm: 120, steps: TRACKER_STEPS, tracks: tracks };
  }

  function trackerStepDuration(){
    var bpm = (trackerSong && trackerSong.bpm) ? trackerSong.bpm : 120;
    return 60 / bpm / 4;
  }

  function trackerScheduleStep(stepIndex, time){
    var dur = trackerStepDuration();
    trackerSong.tracks.forEach(function(track){
      var cell = track.cells[stepIndex];
      if (cell !== null && cell !== undefined){
        playNote(track.patch, cell, time, dur);
      }
    });
    trackerScheduled.push({ stepIndex: stepIndex, time: time });
    if (trackerScheduled.length > 64) trackerScheduled.splice(0, trackerScheduled.length - 64);
  }

  function trackerSchedulerTick(){
    var ctx = ensureAudioContext();
    while (trackerNextStepTime < ctx.currentTime + TRACKER_SCHEDULE_AHEAD_SEC){
      trackerScheduleStep(trackerNextStepIndex, trackerNextStepTime);
      trackerNextStepTime += trackerStepDuration();
      trackerNextStepIndex = (trackerNextStepIndex + 1) % TRACKER_STEPS;
    }
  }

  function trackerSetPlayheadRow(stepIndex){
    if (trackerCurrentStepDisplayed === stepIndex) return;
    trackerCurrentStepDisplayed = stepIndex;
    trackerRowEls.forEach(function(rowEl, idx){
      if (idx === stepIndex) rowEl.classList.add('playhead'); else rowEl.classList.remove('playhead');
    });
  }

  function trackerPlayheadLoop(){
    if (!trackerPlaying) return;
    if (synthCtx){
      var now = synthCtx.currentTime;
      var current = null;
      for (var i = trackerScheduled.length - 1; i >= 0; i--){
        if (trackerScheduled[i].time <= now){ current = trackerScheduled[i]; break; }
      }
      if (current) trackerSetPlayheadRow(current.stepIndex);
    }
    trackerRafId = requestAnimationFrame(trackerPlayheadLoop);
  }

  function updateTrackerPowerStrip(){
    if (!trackerPowerStrip) return;
    var on = synthCtx && synthCtx.state === 'running';
    trackerPowerStrip.style.display = on ? 'none' : 'block';
  }

  function updateTrackerPlayButton(){
    if (!trackerPlayBtn) return;
    trackerPlayBtn.textContent = trackerPlaying ? '■ STOP' : '▶ PLAY';
  }

  function trackerPlay(){
    if (trackerPlaying) return;
    var ctx = ensureAudioContext(); updateTrackerPowerStrip();
    trackerPlaying = true;
    trackerNextStepIndex = 0;
    trackerNextStepTime = ctx.currentTime + 0.05;
    trackerScheduled = [];
    trackerSchedulerTick();
    trackerTimerId = setInterval(trackerSchedulerTick, TRACKER_LOOKAHEAD_MS);
    trackerRafId = requestAnimationFrame(trackerPlayheadLoop);
    updateTrackerPlayButton();
  }

  function trackerStop(){
    trackerPlaying = false;
    if (trackerTimerId){ clearInterval(trackerTimerId); trackerTimerId = null; }
    if (trackerRafId){ cancelAnimationFrame(trackerRafId); trackerRafId = null; }
    trackerSetPlayheadRow(-1);
    updateTrackerPlayButton();
  }

  function trackerTogglePlay(){ if (trackerPlaying) trackerStop(); else trackerPlay(); }

  function trackerUpdateTrackHeader(trackIndex){
    var el = trackerHeadCellEls[trackIndex];
    if (!el) return;
    var t = trackerSong.tracks[trackIndex];
    el.textContent = 'TRK' + (trackIndex + 1) + ':' + (t.patch_name || '(init)');
  }

  function trackerRenderGrid(container){
    container.textContent = '';
    trackerRowEls = [];
    trackerCellEls = [];
    trackerHeadCellEls = [];

    var head = document.createElement('div'); head.className = 'tracker-headrow';
    var rowNumHead = document.createElement('div'); rowNumHead.className = 'tracker-rownum';
    head.appendChild(rowNumHead);
    trackerSong.tracks.forEach(function(t, ti){
      var h = document.createElement('div'); h.className = 'tracker-trackhead';
      h.textContent = 'TRK' + (ti + 1) + ':' + (t.patch_name || '(init)');
      head.appendChild(h);
      trackerHeadCellEls.push(h);
    });
    container.appendChild(head);

    var patchRow = document.createElement('div'); patchRow.className = 'tracker-headrow';
    var patchRowNum = document.createElement('div'); patchRowNum.className = 'tracker-rownum';
    patchRow.appendChild(patchRowNum);
    for (var pi = 0; pi < TRACKER_TRACK_COUNT; pi++){
      (function(trackIndex){
        var btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'tracker-patch-btn'; btn.textContent = '[PATCH...]';
        btn.addEventListener('click', function(){ trackerOpenPicker(trackIndex); });
        patchRow.appendChild(btn);
      })(pi);
    }
    container.appendChild(patchRow);

    for (var s = 0; s < TRACKER_STEPS; s++){
      var row = document.createElement('div'); row.className = 'tracker-row' + (s % 4 === 0 ? ' beat' : '');
      var rownum = document.createElement('div'); rownum.className = 'tracker-rownum';
      rownum.textContent = String(s).padStart(2, '0');
      row.appendChild(rownum);
      var cellRow = [];
      for (var ti2 = 0; ti2 < TRACKER_TRACK_COUNT; ti2++){
        var cellVal = trackerSong.tracks[ti2].cells[s];
        var cellEl = document.createElement('div'); cellEl.className = 'tracker-cell';
        cellEl.textContent = (cellVal === null || cellVal === undefined) ? '---' : trackerNoteLabel(cellVal);
        (function(rowIdx, trackIdx){
          cellEl.addEventListener('click', function(){ trackerSetCursor(rowIdx, trackIdx); });
        })(s, ti2);
        row.appendChild(cellEl);
        cellRow.push(cellEl);
      }
      container.appendChild(row);
      trackerRowEls.push(row);
      trackerCellEls.push(cellRow);
    }
  }

  function trackerSetCell(row, track, value){
    trackerSong.tracks[track].cells[row] = value;
    var cellEl = trackerCellEls[row] && trackerCellEls[row][track];
    if (cellEl) cellEl.textContent = (value === null || value === undefined) ? '---' : trackerNoteLabel(value);
  }

  function trackerSetCursor(row, track){
    var oldCell = trackerCellEls[trackerCursorRow] && trackerCellEls[trackerCursorRow][trackerCursorTrack];
    if (oldCell) oldCell.classList.remove('cursor');
    trackerCursorRow = Math.max(0, Math.min(TRACKER_STEPS - 1, row));
    trackerCursorTrack = Math.max(0, Math.min(TRACKER_TRACK_COUNT - 1, track));
    var newCell = trackerCellEls[trackerCursorRow] && trackerCellEls[trackerCursorRow][trackerCursorTrack];
    if (newCell){
      newCell.classList.add('cursor');
      if (newCell.scrollIntoView) newCell.scrollIntoView({ block: 'nearest' });
    }
  }

  function trackerMoveCursor(dRow, dTrack){
    trackerSetCursor(trackerCursorRow + dRow, trackerCursorTrack + dTrack);
  }

  function trackerSetOctave(v){
    trackerOctave = Math.max(0, Math.min(7, v));
    if (trackerOctLabelEl) trackerOctLabelEl.textContent = 'OCT: ' + trackerOctave;
  }

  function trackerShowMsg(text, cls){
    if (!trackerMsgEl) return;
    trackerMsgEl.textContent = text;
    trackerMsgEl.className = 'tracker-msg' + (cls ? ' ' + cls : '');
  }

  function trackerAssignPatch(trackIndex, name, patchData){
    trackerSong.tracks[trackIndex].patch_name = name;
    trackerSong.tracks[trackIndex].patch = synthClonePatch(patchData);
    trackerUpdateTrackHeader(trackIndex);
  }

  function trackerOpenPicker(trackIndex){
    trackerPickerTargetTrack = trackIndex;
    trackerPickerOpen = true;
    if (!trackerPickerEl) trackerBuildPickerPanel();
    trackerPickerFilterInput.value = '';
    trackerRenderPickerList('');
    trackerPickerEl.style.display = 'flex';
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'get_patch_list' }));
    setTimeout(function(){ trackerPickerFilterInput.focus(); }, 30);
  }

  function trackerClosePicker(){
    trackerPickerOpen = false;
    if (trackerPickerEl) trackerPickerEl.style.display = 'none';
    if (trackerPickerFilterInput) trackerPickerFilterInput.blur();
  }

  function trackerBuildPickerPanel(){
    trackerPickerEl = document.createElement('div'); trackerPickerEl.id = 'tracker-picker';

    var filterRow = document.createElement('div'); filterRow.id = 'tracker-picker-filter-row';
    trackerPickerFilterInput = document.createElement('input');
    trackerPickerFilterInput.type = 'text'; trackerPickerFilterInput.placeholder = 'filter by name…';
    trackerPickerFilterInput.spellcheck = false; trackerPickerFilterInput.autocomplete = 'off';
    trackerPickerFilterInput.addEventListener('input', function(){ trackerRenderPickerList(trackerPickerFilterInput.value); });
    trackerPickerFilterInput.addEventListener('keydown', function(e){ if (e.key === 'Escape'){ e.stopPropagation(); trackerClosePicker(); } });
    var cancelBtn = document.createElement('button');
    cancelBtn.type = 'button'; cancelBtn.className = 'tracker-action-btn'; cancelBtn.textContent = 'Cancel';
    cancelBtn.addEventListener('click', trackerClosePicker);
    filterRow.appendChild(trackerPickerFilterInput); filterRow.appendChild(cancelBtn);
    trackerPickerEl.appendChild(filterRow);

    trackerPickerListEl = document.createElement('div'); trackerPickerListEl.id = 'tracker-picker-list';
    trackerPickerEl.appendChild(trackerPickerListEl);

    var modal = document.getElementById('tracker-modal');
    if (modal) modal.appendChild(trackerPickerEl);
  }

  function trackerRenderPickerList(filterText){
    trackerPickerListEl.textContent = '';

    var initRow = document.createElement('div'); initRow.className = 'tracker-picker-item';
    initRow.textContent = '(init) — default patch';
    initRow.addEventListener('click', function(){
      trackerAssignPatch(trackerPickerTargetTrack, '(init)', SYNTH_INIT_PATCH);
      trackerClosePicker();
    });
    trackerPickerListEl.appendChild(initRow);

    var q = (filterText || '').toLowerCase();
    trackerPatchListCache
      .filter(function(p){ return !q || p.name.toLowerCase().indexOf(q) !== -1; })
      .forEach(function(p){
        var row = document.createElement('div'); row.className = 'tracker-picker-item';
        row.textContent = p.name + '  —  by ' + p.creator;
        row.addEventListener('click', function(){
          trackerAssignPatch(trackerPickerTargetTrack, p.name, p.patch_data);
          trackerClosePicker();
        });
        trackerPickerListEl.appendChild(row);
      });
  }

  function trackerHandleError(op){
    trackerShowMsg((op && op.message) ? op.message : 'Error.', 'red');
  }
  function trackerHandleSaved(op){
    trackerLoadedId = op.id; trackerLoadedName = op.name; trackerOwned = true; trackerEditMode = true;
    if (trackerNameInput) trackerNameInput.value = op.name;
    if (trackerTitleEl) trackerTitleEl.textContent = 'TRACKER — ' + op.name.toUpperCase();
    trackerShowMsg('Saved as "' + op.name + '".', 'green');
  }
  function trackerHandlePatchList(op){
    trackerPatchListCache = (op && Array.isArray(op.patches)) ? op.patches : [];
    if (trackerPickerOpen) trackerRenderPickerList(trackerPickerFilterInput ? trackerPickerFilterInput.value : '');
  }

  function trackerDoSave(){
    if (!ws || ws.readyState !== WebSocket.OPEN){ trackerShowMsg('Not connected. Cannot save.', 'red'); return; }
    var name = trackerNameInput.value.trim();
    if (!name){ trackerShowMsg('Enter a name before saving.', 'yellow'); return; }
    if (!/^[a-z0-9-]{1,32}$/.test(name)){ trackerShowMsg('Name must be lowercase letters, numbers, and hyphens only.', 'yellow'); return; }
    if (trackerEditMode || (trackerLoadedId && trackerOwned && name === trackerLoadedName)){
      ws.send(JSON.stringify({ type: 'update_song', id: trackerLoadedId, name: name, song_data: trackerSong }));
    } else {
      ws.send(JSON.stringify({ type: 'save_song', name: name, song_data: trackerSong }));
    }
  }

  function trackerDoInit(){
    var nonEmpty = trackerSong.tracks.some(function(t){ return t.cells.some(function(c){ return c !== null; }); });
    if (nonEmpty && !window.confirm('Reset to an empty song? This clears the grid.')) return;
    ensureAudioContext(); updateTrackerPowerStrip();
    trackerSong = trackerBuildEmptySong();
    trackerLoadedId = null; trackerLoadedName = ''; trackerOwned = false; trackerEditMode = false;
    if (trackerNameInput) trackerNameInput.value = '';
    if (trackerTitleEl) trackerTitleEl.textContent = 'TRACKER — UNTITLED';
    if (trackerBpmInput) trackerBpmInput.value = trackerSong.bpm;
    trackerRenderGrid(trackerGridEl);
    trackerSetCursor(0, 0);
    trackerShowMsg('', '');
  }

  function trackerKeyDown(e){
    if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;

    var k = e.key.toLowerCase();

    if (k === ' ' || e.code === 'Space'){ e.preventDefault(); trackerTogglePlay(); return; }

    if (Object.prototype.hasOwnProperty.call(SYNTH_KEYMAP, k)){
      e.preventDefault();
      if (e.repeat) return;
      var midi = Math.max(12, Math.min(107, (trackerOctave + 1) * 12 + SYNTH_KEYMAP[k]));
      trackerSetCell(trackerCursorRow, trackerCursorTrack, midi);
      var ctx = ensureAudioContext(); updateTrackerPowerStrip();
      playNote(trackerSong.tracks[trackerCursorTrack].patch, midi, ctx.currentTime, trackerStepDuration());
      trackerMoveCursor(1, 0);
      return;
    }
    if (k === ','){ e.preventDefault(); trackerSetOctave(trackerOctave - 1); return; }
    if (k === '.'){ e.preventDefault(); trackerSetOctave(trackerOctave + 1); return; }
    if (k === 'delete' || k === 'backspace'){ e.preventDefault(); trackerSetCell(trackerCursorRow, trackerCursorTrack, null); trackerMoveCursor(1, 0); return; }
    if (k === 'arrowup'){ e.preventDefault(); trackerMoveCursor(-1, 0); return; }
    if (k === 'arrowdown'){ e.preventDefault(); trackerMoveCursor(1, 0); return; }
    if (k === 'arrowleft'){ e.preventDefault(); trackerMoveCursor(0, -1); return; }
    if (k === 'arrowright'){ e.preventDefault(); trackerMoveCursor(0, 1); return; }
  }
  function trackerEscHandler(e){
    if (e.key !== 'Escape') return;
    if (trackerPickerOpen){ trackerClosePicker(); return; }
    closeTracker();
  }

  function openTracker(op){
    if (document.getElementById('tracker-overlay')) return;
    op = op || {};
    trackerSong = op.song_data ? trackerCloneSong(op.song_data) : trackerBuildEmptySong();
    trackerLoadedId = (typeof op.id === 'number' && op.id > 0) ? op.id : null;
    trackerLoadedName = op.name || '';
    trackerOwned = !!op.owned;
    trackerEditMode = !!op.editMode;
    trackerCurrentStepDisplayed = -1;
    trackerCursorRow = 0; trackerCursorTrack = 0; trackerOctave = 3;
    trackerPickerOpen = false; trackerPickerTargetTrack = -1; trackerPickerEl = null;

    var overlay = document.createElement('div'); overlay.id = 'tracker-overlay';
    var modal = document.createElement('div'); modal.id = 'tracker-modal';

    var titleBar = document.createElement('div'); titleBar.id = 'tracker-titlebar';
    trackerTitleEl = document.createElement('div'); trackerTitleEl.id = 'tracker-title';
    trackerTitleEl.textContent = 'TRACKER — ' + (trackerLoadedName ? trackerLoadedName.toUpperCase() : 'UNTITLED');
    var closeBtn = document.createElement('button'); closeBtn.type = 'button'; closeBtn.id = 'tracker-close-btn'; closeBtn.textContent = '×';
    closeBtn.addEventListener('click', closeTracker);
    titleBar.appendChild(trackerTitleEl); titleBar.appendChild(closeBtn);
    modal.appendChild(titleBar);

    trackerPowerStrip = document.createElement('div'); trackerPowerStrip.id = 'tracker-power-strip';
    trackerPowerStrip.textContent = 'CLICK TO POWER ON';
    trackerPowerStrip.addEventListener('click', function(){ ensureAudioContext(); updateTrackerPowerStrip(); });
    modal.appendChild(trackerPowerStrip);

    var toolbar = document.createElement('div'); toolbar.id = 'tracker-toolbar';

    var bpmLabel = document.createElement('span'); bpmLabel.className = 'tracker-bpm-label'; bpmLabel.textContent = 'BPM';
    trackerBpmInput = document.createElement('input');
    trackerBpmInput.id = 'tracker-bpm'; trackerBpmInput.type = 'number';
    trackerBpmInput.min = 40; trackerBpmInput.max = 300; trackerBpmInput.value = trackerSong.bpm;
    trackerBpmInput.addEventListener('input', function(){
      var v = parseInt(trackerBpmInput.value, 10);
      if (!isNaN(v)) trackerSong.bpm = Math.max(40, Math.min(300, v));
    });
    trackerBpmInput.addEventListener('blur', function(){ trackerBpmInput.value = trackerSong.bpm; });

    trackerPlayBtn = document.createElement('button');
    trackerPlayBtn.type = 'button'; trackerPlayBtn.className = 'tracker-action-btn primary';
    trackerPlayBtn.addEventListener('click', trackerTogglePlay);

    var initBtn = document.createElement('button');
    initBtn.type = 'button'; initBtn.className = 'tracker-action-btn'; initBtn.textContent = 'INIT';
    initBtn.addEventListener('click', trackerDoInit);

    trackerNameInput = document.createElement('input');
    trackerNameInput.id = 'tracker-name'; trackerNameInput.type = 'text';
    trackerNameInput.placeholder = 'name (a-z, 0-9, hyphens)';
    trackerNameInput.maxLength = 32; trackerNameInput.spellcheck = false; trackerNameInput.autocomplete = 'off';
    trackerNameInput.value = trackerLoadedName;
    trackerNameInput.addEventListener('input', function(){
      trackerNameInput.value = trackerNameInput.value.toLowerCase().replace(/[^a-z0-9-]/g, '');
    });

    var saveBtn = document.createElement('button');
    saveBtn.type = 'button'; saveBtn.className = 'tracker-action-btn primary'; saveBtn.textContent = 'SAVE';
    trackerNameInput.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); saveBtn.click(); } });
    saveBtn.addEventListener('click', trackerDoSave);

    var loadBtn = document.createElement('button');
    loadBtn.type = 'button'; loadBtn.className = 'tracker-action-btn'; loadBtn.textContent = 'LOAD';
    loadBtn.addEventListener('click', function(){
      closeTracker();
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'input', raw: '/songs' }));
    });

    var octWrap = document.createElement('div'); octWrap.id = 'tracker-oct';
    var octMinus = document.createElement('button');
    octMinus.type = 'button'; octMinus.className = 'tracker-oct-btn'; octMinus.textContent = '−';
    trackerOctLabelEl = document.createElement('span'); trackerOctLabelEl.id = 'tracker-oct-label';
    var octPlus = document.createElement('button');
    octPlus.type = 'button'; octPlus.className = 'tracker-oct-btn'; octPlus.textContent = '+';
    octMinus.addEventListener('click', function(){ trackerSetOctave(trackerOctave - 1); });
    octPlus.addEventListener('click', function(){ trackerSetOctave(trackerOctave + 1); });
    octWrap.appendChild(octMinus); octWrap.appendChild(trackerOctLabelEl); octWrap.appendChild(octPlus);

    toolbar.appendChild(bpmLabel); toolbar.appendChild(trackerBpmInput);
    toolbar.appendChild(trackerPlayBtn);
    toolbar.appendChild(initBtn);
    toolbar.appendChild(trackerNameInput); toolbar.appendChild(saveBtn); toolbar.appendChild(loadBtn);
    toolbar.appendChild(octWrap);
    modal.appendChild(toolbar);
    updateTrackerPlayButton();
    trackerSetOctave(trackerOctave);

    trackerMsgEl = document.createElement('div'); trackerMsgEl.id = 'tracker-msg';
    modal.appendChild(trackerMsgEl);

    trackerGridEl = document.createElement('div'); trackerGridEl.id = 'tracker-grid';
    trackerRenderGrid(trackerGridEl);
    modal.appendChild(trackerGridEl);

    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    updateTrackerPowerStrip();
    trackerSetCursor(0, 0);

    document.addEventListener('keydown', trackerKeyDown);
    document.addEventListener('keydown', trackerEscHandler);
  }

  function closeTracker(){
    trackerStop();
    var overlay = document.getElementById('tracker-overlay');
    if (overlay) overlay.remove();
    document.removeEventListener('keydown', trackerKeyDown);
    document.removeEventListener('keydown', trackerEscHandler);
    trackerSong = null; trackerMsgEl = null; trackerPowerStrip = null; trackerPlayBtn = null;
    trackerTitleEl = null; trackerNameInput = null; trackerBpmInput = null; trackerGridEl = null; trackerOctLabelEl = null;
    trackerRowEls = []; trackerCellEls = []; trackerHeadCellEls = [];
    trackerPickerEl = null; trackerPickerListEl = null; trackerPickerFilterInput = null; trackerPickerOpen = false;
    focusInputEnd(input);
  }

  // ===== Autoscroll helpers =====
  function isNearBottom(el, threshold){ threshold = typeof threshold === 'number' ? threshold : 40;
    return (el.scrollHeight - el.scrollTop - el.clientHeight) < threshold; }
  function scrollToBottom(el){ el.scrollTop = el.scrollHeight; }

  // ===== Render ops =====
  function op_clear(){ term.innerHTML = ''; }
  function op_print(text, cls){
    var stick = isNearBottom(term);
    var d = document.createElement('div');
    d.className = 'line' + (cls ? ' ' + cls : '');
    d.textContent = text || '';
    term.appendChild(d);
    if (stick) scrollToBottom(term);
  }
  function op_printHTML(html, cls){
    var stick = isNearBottom(term);
    var d = document.createElement('div');
    d.className = 'line' + (cls ? ' ' + cls : '');
    d.innerHTML = html || '';
    d.querySelectorAll('canvas.pxa-thumb').forEach(function(c){ renderPixelThumb(c); });
    term.appendChild(d);
    if (stick) scrollToBottom(term);
  }

  function renderPixelThumb(canvas){
    var raw = canvas.getAttribute('data-pixels');
    if (!raw) return;
    var data; try { data = JSON.parse(raw); } catch { return; }
    if (!Array.isArray(data) || data.length !== 256) return;
    var ctx = canvas.getContext('2d');
    if (!ctx) return;
    ctx.imageSmoothingEnabled = false;
    ctx.mozImageSmoothingEnabled = false;
    ctx.webkitImageSmoothingEnabled = false;
    ctx.msImageSmoothingEnabled = false;
    canvas.style.imageRendering = 'pixelated';
    canvas.style.background = 'transparent';
    canvas.style.border = 'none';
    canvas.style.outline = 'none';
    var scale = canvas.width / 16;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var i = 0; i < 256; i++){
      var c = data[i];
      if (!c || typeof c !== 'string' || !/^#[0-9a-f]{6}$/i.test(c)) continue;
      var px = i % 16, py = Math.floor(i / 16);
      ctx.fillStyle = c;
      ctx.fillRect(px * scale, py * scale, scale, scale);
    }
  }
  // ◆ (U+25C6) and × (U+00D7) — the spec's primary glyph and its own
  // suggested fallback — are both absent from the Web IBM VGA webfont
  // (verified against the font's cmap). ♦ (U+2666) is the font's actual
  // CP437 diamond glyph (codepoint 0x04) and reads the same as the
  // intended ornament, so it's used here instead of either spec option.
  var RULE_ORNAMENT = '♦';
  function op_hr(){
    var stick = isNearBottom(term);
    var d = document.createElement('div');
    d.className = 'line rule rule-centered';
    var run = '─'.repeat(100);
    var leftSpan = document.createElement('span');
    leftSpan.className = 'rule-run';
    leftSpan.textContent = run;
    var ornamentSpan = document.createElement('span');
    ornamentSpan.className = 'rule-ornament';
    ornamentSpan.textContent = RULE_ORNAMENT;
    var rightSpan = document.createElement('span');
    rightSpan.className = 'rule-run';
    rightSpan.textContent = run;
    d.appendChild(leftSpan);
    d.appendChild(ornamentSpan);
    d.appendChild(rightSpan);
    term.appendChild(d);
    if (stick) scrollToBottom(term);
  }
  function op_hrTitled(title){
    var stick = isNearBottom(term);
    var d = document.createElement('div');
    d.className = 'line rule hr-titled';
    var titleSpan = document.createElement('span');
    titleSpan.className = 'hr-titled-text';
    titleSpan.textContent = String(title || '');
    d.appendChild(document.createTextNode('──[ '));
    d.appendChild(titleSpan);
    d.appendChild(document.createTextNode(' ]' + '─'.repeat(150)));
    term.appendChild(d);
    if (stick) scrollToBottom(term);
  }
  function op_setInput(type, placeholder){
    if (singleInput){
      try { if (type && singleInput.type !== type) singleInput.type = type; } catch(e){}

      t.textContent = (letters[c] || '').toUpperCase();
      t.className = 'wl-tile' + (letters[c] ? ' filled' : '');
    }
  }

  function wlSubmitGuess() {
    if (wlSubmitting || wlGameOver) return;
    var guess = (wlGuessInput ? wlGuessInput.value : '').toLowerCase().replace(/[^a-z]/g, '');
    if (guess.length !== 5) { wordleShowError('Type a 5-letter word first.'); return; }
    wlSubmitting = true;
    wordleShowError('');
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'wordle_guess', guess: guess }));
    } else {
      wordleShowError('Not connected. Try again.'); wlSubmitting = false;
    }
  }

  function wordleHandleGuessResult(op) {
    wlSubmitting = false;
    if (!op.result || !Array.isArray(op.result)) return;
    var ri = (op.guessNum || 1) - 1;
    if (ri < 0 || ri >= 6) return;
    // Color the tiles
    op.result.forEach(function(r, ci) {
      var t = wlTiles[ri] && wlTiles[ri][ci];
      if (!t) return;
      t.textContent = (r.letter || '').toUpperCase();
      t.className = 'wl-tile ' + (r.result || 'absent');
    });
    // Update keyboard
    op.result.forEach(function(r) {
      var l = r.letter;
      var keyEl = wlKeys[l];
      if (!keyEl) return;
      var cur = keyEl.dataset.state || '';
      var next = r.result;
      if (cur === 'correct') return;
      if (next === 'correct' || (next === 'present' && cur !== 'correct')) {
        keyEl.dataset.state = next;
        keyEl.className = 'wl-key ' + next + (keyEl.dataset.wide ? ' wide' : '');
      } else if (!cur) {
        keyEl.dataset.state = 'absent';
        keyEl.className = 'wl-key absent' + (keyEl.dataset.wide ? ' wide' : '');
      }
    });
    wlCurrentRow = op.guessNum;
    if (wlGuessInput) wlGuessInput.value = '';
    wlUpdateCurrentRowPreview('');
    if (op.solved || op.failed) {
      wlGameOver = true;
      wlTerminal = true;
      var closeBtnEl = document.getElementById('wordle-close-btn');
      if (closeBtnEl) closeBtnEl.textContent = 'Done';
      var inputRow = document.getElementById('wordle-input-row');
      if (inputRow) inputRow.style.display = 'none';
      var resultEl = document.getElementById('wordle-result');
      var resultMsg = document.getElementById('wordle-result-msg');
      var shareText = document.getElementById('wordle-share-text');
      var copyHint  = document.querySelector('.wl-copy-hint');
      if (resultEl) resultEl.className = 'show';
      // Update streak display
      var streakEl = document.getElementById('wordle-streak');
      if (streakEl) streakEl.textContent = 'streak: ' + (op.streak || 0) + ' • best: ' + (op.bestStreak || 0);
      if (resultMsg) {
        if (op.solved) {
          resultMsg.textContent = 'Solved in ' + op.guessNum + ' guess' + (op.guessNum !== 1 ? 'es' : '') + '! 💯';
          resultMsg.style.color = 'var(--green)';
        } else {
          resultMsg.textContent = 'The word was ' + (op.dailyWord || '?').toUpperCase() + ' 💀';
          resultMsg.style.color = 'var(--red)';
        }
      }
      var chromeEl = document.getElementById('wordle-chrome');
      if (chromeEl && op.chromeEarned > 0) {
        chromeEl.textContent = 'you earned ' + op.chromeEarned + ' ₢  •  balance: ' + op.newChromeBalance + ' ₢';
      }
      if (shareText && op.emojiGrid) {
        shareText.textContent = op.emojiGrid;
        shareText.addEventListener('click', function() {
          try { navigator.clipboard.writeText(shareText.textContent); if (copyHint) copyHint.textContent = 'copied!'; }
          catch(e) { if (copyHint) copyHint.textContent = 'select and copy manually'; }
        });
      }
    }
  }

  function wordleShowError(msg) {

  function buildWlShareGrid(guesses) {
    return guesses.map(function(g) {

      return result.map(function(r) {
        return r.result === 'correct' ? '🟩' : r.result === 'present' ? '🟨' : '⬛';

  function mnUpdateInventory(inv) {
    var el = document.getElementById('mining-inventory');
    if (!el) return;
    el.innerHTML = '';
    var any = false;
    for (var i = 0; i < MN_RESOURCE_KEYS.length; i++) {
      var k = MN_RESOURCE_KEYS[i];
      var amt = (inv && inv[k]) ? inv[k] : 0;
      if (amt > 0) {

  function hackRenderAttempts() {
    var attemptsEl = document.getElementById('hack-attempts');
    if (!attemptsEl) return;
    var filled = Math.max(0, Math.min(4, hkAttemptsRemaining));
    var bar = '';
    for (var i = 0; i < 4; i++) bar += (i < filled ? '▓' : '░');
    attemptsEl.textContent = 'ATTEMPTS REMAINING: ' + bar;
  }

  function hackRenderNoise() {
    var noiseEl = document.getElementById('hack-noise');
    if (!noiseEl) return;
    noiseEl.innerHTML = '';
    var activeWords = hkWords.filter(function(w) { return hkRemovedWords.indexOf(w) === -1; });

    var matches = [];
    activeWords.forEach(function(w) {
      var idx = hkNoise.indexOf(w);
      if (idx !== -1) matches.push({ start: idx, end: idx + w.length, type: 'word', value: w });
    });
    hkBrackets.forEach(function(tok) {
      var idx = hkNoise.indexOf(tok);
      if (idx !== -1) matches.push({ start: idx, end: idx + tok.length, type: 'bracket', value: tok });
    });
    matches.sort(function(a, b) { return a.start - b.start; });

    var pos = 0;
    matches.forEach(function(m) {
      if (m.start > pos) noiseEl.appendChild(document.createTextNode(hkNoise.slice(pos, m.start)));
      var span = document.createElement('span');
      if (m.type === 'word') {
        var isUsed = hkGuessed.indexOf(m.value) !== -1;
        span.className = 'hack-word' + (isUsed ? ' used' : '');
        span.textContent = m.value;
        if (!isUsed && !hkGameOver) {
          span.addEventListener('click', function() { hackSubmitGuess(m.value); });
        }
      } else {
        var tokUsed = hkUsedBrackets.indexOf(m.value) !== -1;
        span.className = 'hack-bracket' + (tokUsed ? ' used' : '');
        span.textContent = m.value;
        if (!tokUsed && !hkGameOver) {
          span.addEventListener('click', function() { hackSubmitBracket(m.value); });
        }
      }
      noiseEl.appendChild(span);
      pos = m.end;
    });
    if (pos < hkNoise.length) noiseEl.appendChild(document.createTextNode(hkNoise.slice(pos)));
  }

  function hackAppendLog(word, likeness, wordLength) {
    var logEl = document.getElementById('hack-log');

    logEl.appendChild(line);
