<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<title>Dead Internet Society — BBS</title>
<style>
  :root{
    --bg:#000;--fg:#E6E6E6;--red:#FF4545;--green:#2FD44F;--yellow:#E3C600;
    --blue:#3AA0FF;--magenta:#CC66FF;--cyan:#19C3C3;--white:#FFF;
    --accent:var(--cyan);--panel:#050505;--scroll-thumb:#19C3C380;--scroll-track:#0b0b0b;
    --inputbar-h: clamp(44px, 5vh, 72px);
  }
  html,body{height:100%;background:var(--bg);overflow:hidden}
  body{margin:0;color:var(--fg);font:14px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;letter-spacing:.2px}
  .app{height:100vh;display:flex;flex-direction:column;background:var(--bg)}
  @supports (height:100dvh){.app{height:100dvh}}
  #terminal{flex:1 1 auto;padding:12px 14px 18px;box-sizing:border-box;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable both-edges;scrollbar-width:thin;scrollbar-color:var(--scroll-thumb) var(--scroll-track);border-bottom:1px solid #0e0e0e}
  #terminal::-webkit-scrollbar{width:8px}
  #terminal::-webkit-scrollbar-track{background:var(--scroll-track)}
  #terminal::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:8px}
  #terminal::-webkit-scrollbar-thumb:hover{background:#19C3C3B3}
  .line{white-space:pre-wrap;word-wrap:break-word}
  .dim{opacity:.75}
  .red{color:var(--red)} .green{color:var(--green)} .yellow{color:var(--yellow)}
  .blue{color:var(--blue)} .magenta{color:var(--magenta)} .cyan{color:var(--cyan)} .white{color:var(--white)}
  .u{text-decoration:underline}
  img.emoji{display:inline-block;height:1.35em;width:auto;vertical-align:middle;image-rendering:pixelated}
  .rule{height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin:8px 0}
  .banner{background:linear-gradient(180deg,#0a0a0a 0%,#050505 100%);border:1px solid #121212;padding:10px 12px;margin-bottom:10px}
  #inputbar{flex:0 0 var(--inputbar-h);display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);box-sizing:border-box}
  .prompt{color:var(--accent)}
  #cmdForm{display:flex;flex:1 1 auto;gap:8px;min-width:0}
  #cmdInput{flex:1 1 auto;min-width:0;background:#0c0c0c;color:var(--fg);border:1px solid #151515;outline:0;padding:10px 12px;border-radius:6px;caret-color:var(--accent)}
  #cmdInput::placeholder{color:#6a6a6a}
  .btn{appearance:none;border:1px solid #1b1b1b;background:#0d0d0d;color:var(--fg);padding:9px 12px;border-radius:6px;cursor:pointer}
  .btn:hover{border-color:#2a2a2a}
  .svg-splash-wrap{display:flex;justify-content:center;margin:8px 0 12px}
  .svg-splash{max-width:960px;width:96%;height:auto;display:block}
  .line.me {
  background: rgba(25,195,195,0.08);         /* faint cyan wash */
  border-left: 2px solid var(--accent);
  padding-left: 8px;
}
  .door-overlay[hidden]{display:none !important;}
  .door-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.65);z-index:2200;opacity:0;pointer-events:none;transition:opacity .18s ease;}
  .door-overlay.visible{opacity:1;pointer-events:auto;}
  .door-modal{--door-width:760px;--door-height:560px;background:linear-gradient(180deg,#0c0c0c 0%,#050505 100%);border:1px solid #151515;border-radius:14px;box-shadow:0 32px 64px rgba(0,0,0,0.55);width:min(94vw,var(--door-width));max-height:min(92vh,var(--door-height));display:flex;flex-direction:column;overflow:hidden;transform:translateY(12px);transition:transform .22s ease,box-shadow .22s ease;}
  .door-overlay.visible .door-modal{transform:translateY(0);box-shadow:0 38px 72px rgba(0,0,0,0.6);}
  .door-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid #1a1a1a;background:linear-gradient(180deg,#151515 0%,#0d0d0d 100%);}
  .door-title{font-size:16px;font-weight:600;letter-spacing:.6px;color:var(--fg);}
  .door-close{appearance:none;border:1px solid #222;background:#111;color:var(--fg);padding:7px 16px;border-radius:6px;cursor:pointer;font:inherit;letter-spacing:.4px;transition:background .16s ease,border-color .16s ease,transform .16s ease;}
  .door-close:hover{border-color:#2d2d2d;background:#181818;}
  .door-close:active{transform:translateY(1px);}
  .door-body{padding:18px;display:flex;flex-direction:column;gap:14px;background:#080808;flex:1 1 auto;overflow:hidden;}
  .door-mount-wrap{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:14px;background:radial-gradient(circle at 50% 32%,rgba(25,195,195,0.14),rgba(5,5,5,0.92));border:1px solid #141414;border-radius:10px;min-height:240px;box-shadow:inset 0 0 22px rgba(0,0,0,0.45);}
  .door-mount{display:flex;align-items:center;justify-content:center;}
  .door-mount canvas{display:block;max-width:100%;height:auto;image-rendering:pixelated;}
  .door-hint{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#8a8a8a;padding:0 2px;}
  body.door-open .app{filter:blur(0);}
</style>
</head>
<body>
  <div class="app">
    <div id="terminal" aria-live="polite" aria-atomic="false">
      <div class="line dim">connecting…</div>
    </div>
    <div id="inputbar">
      <div class="prompt">DIS&gt;</div>
      <form id="cmdForm" autocomplete="off">
        <input id="cmdInput" type="text" placeholder="Type here…" spellcheck="false" autofocus>
        <button class="btn" type="submit">Enter</button>
      </form>
    </div>
  </div>

  <div id="doorOverlay" class="door-overlay" hidden aria-hidden="true">
    <div id="doorModal" class="door-modal" role="dialog" aria-modal="true" aria-labelledby="doorTitle" aria-describedby="doorHint">
      <div class="door-header">
        <div id="doorTitle" class="door-title">Door</div>
        <button type="button" id="doorClose" class="door-close">Close</button>
      </div>
      <div class="door-body">
        <div id="doorMountWrap" class="door-mount-wrap"></div>
        <div id="doorHint" class="door-hint" hidden></div>
      </div>
    </div>
  </div>

<script src="/doors/doors-runtime.js"></script>
<script>
(function(){
  var term  = document.getElementById('terminal');
  var form  = document.getElementById('cmdForm');
  var input = document.getElementById('cmdInput');
  var promptEl = document.querySelector('.prompt');
  var doorOverlay = document.getElementById('doorOverlay');
  var doorModal = document.getElementById('doorModal');
  var doorMountWrap = document.getElementById('doorMountWrap');
  var doorTitleEl = document.getElementById('doorTitle');
  var doorHintEl = document.getElementById('doorHint');
  var doorCloseBtn = document.getElementById('doorClose');
  var activeDoor = null;

  // ===== Audio support =====
  var AUDIO_CACHE = new Map();
  var AUDIO_UNLOCKED = false;
  var BEEP_CTX = null;

  function unlockAudioOnce(){
    AUDIO_UNLOCKED = true;
    try { if (!BEEP_CTX) BEEP_CTX = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
  // Unlock on first user interaction (required by autoplay policies)
  window.addEventListener('pointerdown', unlockAudioOnce, { once: true });
  window.addEventListener('keydown', unlockAudioOnce, { once: true });

  function op_audio(src, volume){
    if (!src || !AUDIO_UNLOCKED) return;
    var key = String(src);
    var a = AUDIO_CACHE.get(key);
    if (!a){
      a = new Audio(key);
      a.preload = 'auto';
      AUDIO_CACHE.set(key, a);
    }
    try {
      if (typeof volume === 'number') a.volume = Math.max(0, Math.min(1, volume));
      a.currentTime = 0;
      a.play().catch(function(){ /* ignore: user has not interacted yet */ });
    } catch(e){ /* ignore */ }
  }

  function op_beep(kind){
    if (!AUDIO_UNLOCKED || !BEEP_CTX) return;
    try {
      var o = BEEP_CTX.createOscillator();
      var g = BEEP_CTX.createGain();
      o.connect(g); g.connect(BEEP_CTX.destination);
      o.type = 'triangle';
      // pick a short attention tone; vary by kind if desired
      o.frequency.value = (kind === 'mention') ? 880 : 660;

      var now = BEEP_CTX.currentTime;
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.25, now + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);

      o.start(now);
      o.stop(now + 0.17);
    } catch(e){ /* ignore */ }
  }

  // ===== Autoscroll helpers =====
  function isNearBottom(el, threshold){ threshold = typeof threshold === 'number' ? threshold : 40;
    return (el.scrollHeight - el.scrollTop - el.clientHeight) < threshold; }
  function scrollToBottom(el){ el.scrollTop = el.scrollHeight; }

  // ===== Render ops =====
  function op_clear(){ term.innerHTML = ''; }
  function op_print(text, cls){
    var stick = isNearBottom(term);
    var d = document.createElement('div');
    d.className = 'line' + (cls ? ' ' + cls : '');
    d.textContent = text || '';
    term.appendChild(d);
    if (stick) scrollToBottom(term);
  }
  function op_printHTML(html, cls){
    var stick = isNearBottom(term);
    var d = document.createElement('div');
    d.className = 'line' + (cls ? ' ' + cls : '');
    d.innerHTML = html || '';
    term.appendChild(d);
    if (stick) scrollToBottom(term);
  }
  function op_hr(){
    var stick = isNearBottom(term);
    var d = document.createElement('div'); d.className = 'rule';
    term.appendChild(d);
    if (stick) scrollToBottom(term);
  }
  function op_setInput(type, placeholder){
    try { if (type && input.type !== type) input.type = type; } catch(e){}
    if (typeof placeholder !== 'undefined') input.placeholder = placeholder;
  }
  function op_setPrompt(prefix){
    if (!promptEl) return;
    promptEl.textContent = String(prefix || 'DIS>');
  }
  function op_reload(){
    try {
      window.location.reload();
    } catch(e) {
      window.location.href = window.location.href;
    }
  }

  // ===== WebSocket =====
  var proto = (location.protocol === 'https:' ? 'wss:' : 'ws:');
  var ws = null;
  var reconnectAttempts = 0;
  var reconnectTimer = null;
  var hasConnectedOnce = false;
  var reconnectNoticeShown = false;

  function websocketUrl(){
    return proto + '//' + location.host + '/ws';
  }

  function reconnectDelay(attempt){
    var base = 1000;
    var maxDelay = 30000;
    var exp = Math.pow(2, Math.max(0, attempt - 1));
    return Math.min(maxDelay, base * exp);
  }

  function clearReconnectTimer(){
    if (reconnectTimer != null) {
      clearTimeout(reconnectTimer);
      reconnectTimer = null;
    }
  }

  function scheduleReconnect(immediate){
    if (reconnectTimer != null) {
      if (!immediate) return;
      clearReconnectTimer();
    }
    if (hasConnectedOnce && !reconnectNoticeShown) {
      reconnectNoticeShown = true;
      op_print('Connection lost. Attempting to reconnect…', 'yellow');
    }
    reconnectAttempts += 1;
    var delay = immediate ? 0 : reconnectDelay(reconnectAttempts);
    reconnectTimer = setTimeout(function(){
      reconnectTimer = null;
      connectWebSocket();
    }, delay);
  }

  function connectWebSocket(){
    var socket;
    try {
      socket = new WebSocket(websocketUrl());
    } catch (err) {
      console.error('WebSocket creation failed', err);
      ws = null;
      scheduleReconnect();
      return;
    }

    ws = socket;

    socket.addEventListener('open', function(){
      if (socket !== ws) return;
      var wasReconnecting = reconnectAttempts > 0;
      hasConnectedOnce = true;
      reconnectNoticeShown = false;
      reconnectAttempts = 0;
      clearReconnectTimer();
      if (wasReconnecting) op_print('Reconnected to server.', 'green');
      try { socket.send(JSON.stringify({ type: 'init' })); } catch (err) {
        console.error('WebSocket init send failed', err);
      }
    });

    socket.addEventListener('message', function(ev){
      if (socket !== ws) return;
      var msg; try { msg = JSON.parse(ev.data); } catch { return; }
      if (msg.type === 'ops' && Array.isArray(msg.ops)) {
        msg.ops.forEach(function(op){
          if (op.op === 'clear') op_clear();
          else if (op.op === 'print') op_print(op.text, op.cls);
          else if (op.op === 'printHTML') op_printHTML(op.html, op.cls);
          else if (op.op === 'hr') op_hr();
          else if (op.op === 'setInput') op_setInput(op.inputType, op.placeholder);
          else if (op.op === 'setPrompt') op_setPrompt(op.prefix);
          else if (op.op === 'reload') op_reload();
          else if (op.op === 'doorOpen') openDoorOverlay(op);
          else if (op.op === 'doorClose') teardownDoor(op && op.slug);
          else if (op.op === 'doorEvent') dispatchDoorEvent(op);
          else if (op.op === 'audio') op_audio(op.src, op.volume);
          else if (op.op === 'beep') op_beep(op.kind);
        });
      }
    });

    socket.addEventListener('close', function(ev){
      if (socket !== ws) return;
      ws = null;
      teardownDoor();
      if (ev && ev.code === 4001) {
        return;
      }
      scheduleReconnect();
    });

    socket.addEventListener('error', function(err){
      if (socket !== ws) return;
      console.error('WebSocket error', err);
      try { socket.close(); } catch (closeErr) {
        console.error('WebSocket close after error failed', closeErr);
      }
    });
  }

  connectWebSocket();
  window.addEventListener('online', function(){
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      scheduleReconnect(true);
    }
  });

  function doorRuntimeAvailable(){ return !!(window.DDR && typeof window.DDR.openDoor === 'function'); }

  function clampDimension(value, min, max){
    var n = Number(value);
    if (!Number.isFinite(n)) return null;
    return Math.max(min, Math.min(max, Math.round(n)));
  }

  function openDoorOverlay(op){
    if (!op || !doorOverlay || !doorMountWrap) return;
    var slug = String(op.slug || '').trim();
    if (!slug) return;
    var prevFocus = document.activeElement && typeof document.activeElement.focus === 'function'
      ? document.activeElement
      : null;
    activeDoor = { slug: slug, prevFocus: prevFocus };

    var doorWidth = clampDimension(op.width, 240, 1920);
    var doorHeight = clampDimension(op.height, 180, 1080);
    var modalWidth = doorWidth != null ? clampDimension(doorWidth + 120, 360, 1480) : null;
    var modalHeight = doorHeight != null ? clampDimension(doorHeight + 200, 360, 1120) : null;

    if (doorModal) {
      if (modalWidth != null) doorModal.style.setProperty('--door-width', modalWidth + 'px');
      else doorModal.style.removeProperty('--door-width');
      if (modalHeight != null) doorModal.style.setProperty('--door-height', modalHeight + 'px');
      else doorModal.style.removeProperty('--door-height');
    }

    doorMountWrap.innerHTML = '';
    var mount = document.createElement('div');
    mount.className = 'door-mount';
    var mountId = (typeof op.mountId === 'string' && op.mountId.trim()) ? op.mountId.trim() : 'door-modal-mount';
    mount.id = mountId;
    if (doorHeight != null) mount.style.height = doorHeight + 'px';
    doorMountWrap.appendChild(mount);
    activeDoor.mountId = mountId;

    if (doorTitleEl) doorTitleEl.textContent = op.title ? String(op.title) : slug;
    if (doorHintEl) {
      if (op.hint) { doorHintEl.textContent = String(op.hint); doorHintEl.hidden = false; }
      else { doorHintEl.textContent = ''; doorHintEl.hidden = true; }
    }

    if (doorOverlay) {
      doorOverlay.hidden = false;
      doorOverlay.setAttribute('aria-hidden', 'false');
      requestAnimationFrame(function(){ doorOverlay.classList.add('visible'); });
    }
    if (document.body) document.body.classList.add('door-open');
    if (input && typeof input.blur === 'function') input.blur();

    var runtimeOpts = {};
    if (op.doorOpts && typeof op.doorOpts === 'object') {
      for (var key in op.doorOpts) {
        if (Object.prototype.hasOwnProperty.call(op.doorOpts, key)) runtimeOpts[key] = op.doorOpts[key];
      }
    }
    if (doorWidth != null && !Object.prototype.hasOwnProperty.call(runtimeOpts, 'width')) runtimeOpts.width = doorWidth;
    if (doorHeight != null && !Object.prototype.hasOwnProperty.call(runtimeOpts, 'height')) runtimeOpts.height = doorHeight;

    if (doorRuntimeAvailable()) {
      Promise.resolve(window.DDR.openDoor({
        slug: slug,
        mountId: mountId,
        opts: runtimeOpts,
        send: function(payload){ sendDoorEvent(slug, payload); }
      })).catch(function(err){ console.error('Door failed to open', err); });
    } else {
      console.warn('Door runtime not available.');
    }
  }

  function hideDoorOverlay(){
    if (doorOverlay) {
      doorOverlay.classList.remove('visible');
      doorOverlay.setAttribute('aria-hidden', 'true');
      setTimeout(function(){ if (doorOverlay && !doorOverlay.classList.contains('visible')) doorOverlay.hidden = true; }, 190);
    }
  }

  function teardownDoor(slug){
    var id = slug ? String(slug).trim() : (activeDoor && activeDoor.slug);
    if (id && doorRuntimeAvailable()) {
      try { window.DDR.closeDoor(id); } catch(e){ console.error('Door close failed', e); }
    }
    if (doorMountWrap) doorMountWrap.innerHTML = '';
    hideDoorOverlay();
    if (doorModal) {
      doorModal.style.removeProperty('--door-width');
      doorModal.style.removeProperty('--door-height');
    }
    if (doorHintEl) { doorHintEl.textContent = ''; doorHintEl.hidden = true; }
    if (document.body) document.body.classList.remove('door-open');
    var focusTarget = (activeDoor && activeDoor.prevFocus && typeof activeDoor.prevFocus.focus === 'function') ? activeDoor.prevFocus : input;
    activeDoor = null;
    setTimeout(function(){ try { focusTarget && focusTarget.focus(); } catch(e){} }, 0);
  }

  function dispatchDoorEvent(op){
    if (!op || !op.slug || !doorRuntimeAvailable()) return;
    try { window.DDR.dispatchToDoor(op.slug, op.payload); } catch(e){ console.error('Door event dispatch failed', e); }
  }

  function sendDoorEvent(slug, payload){
    if (!slug || !ws || ws.readyState !== WebSocket.OPEN) return;
    var id = String(slug).trim();
    if (!id) return;
    if (activeDoor && activeDoor.slug && activeDoor.slug.toLowerCase() !== id.toLowerCase()) return;
    try { ws.send(JSON.stringify({ type:'doorEvent', slug:id, payload: payload })); } catch(e){ console.error('Door event send failed', e); }
  }

  function requestDoorExit(){
    if (!activeDoor) return;
    sendDoorEvent(activeDoor.slug, { type:'leave', source:'overlay' });
  }

  if (doorCloseBtn) {
    doorCloseBtn.addEventListener('click', function(ev){
      ev.preventDefault();
      requestDoorExit();
    });
  }
  if (doorOverlay) {
    doorOverlay.addEventListener('click', function(ev){
      if (ev.target === doorOverlay) requestDoorExit();
    });
  }

  input.focus();

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var raw = (input.value || '').trim();
    if (!raw) return;
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'input', raw: raw }));
    } else {
      op_print('Still reconnecting. Message not sent.', 'yellow');
    }
    input.value = '';
    input.focus();
  });

  // Click anywhere to refocus input (unless interacting with a control)
  var appEl = document.querySelector('.app');
  function isFocusableTarget(el){
    if (!el) return false;
    if (el === input) return true;
    if (el.closest('form')) return true;
    if (el.closest('button')) return true;
    if (el.closest('a[href]')) return true;
    if (el.isContentEditable) return true;
    return false;
  }
  function clickToFocus(ev){
    if (isFocusableTarget(ev.target)) return;
    var sel = window.getSelection && window.getSelection();
    if (sel && String(sel).length) return;
    setTimeout(function(){ input.focus(); }, 0);
  }
  appEl.addEventListener('click', clickToFocus);

  // ESC quickly refocuses prompt
  document.addEventListener('keydown', function(ev){
    if (ev.key === 'Escape' && !activeDoor) input.focus();
  });
})();
</script>




</body>
</html>
