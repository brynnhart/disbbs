  function hackSubmitGuess(word) {
    if (hkSubmitting || hkGameOver) return;
    if (hkGuessed.indexOf(word) !== -1) return;
    hkSubmitting = true;
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'hack_guess', word: word }));

      hkSubmitting = false;
    }
  }

  function hackSubmitBracket(token) {
    if (hkGameOver) return;
    if (hkUsedBrackets.indexOf(token) !== -1) return;

  function hackHandleState(op) {
    var noiseEl = document.getElementById('hack-noise');
    if (!noiseEl) return;

    if (op.alreadyPlayed) {
      hkGameOver = true;
      var attemptsEl  = document.getElementById('hack-attempts');

      return;
    }

    hkWordLength        = op.wordLength || 5;
    hkNoise             = op.noise || '';
    hkWords             = Array.isArray(op.words) ? op.words.slice() : [];
    hkBrackets          = Array.isArray(op.brackets) ? op.brackets.slice() : [];
    hkGuessed           = Array.isArray(op.guesses) ? op.guesses.map(function(g) { return g.word; }) : [];
    hkUsedBrackets      = Array.isArray(op.usedBrackets) ? op.usedBrackets.slice() : [];
    hkRemovedWords      = op.removedWord ? [op.removedWord] : [];
    hkAttemptsRemaining = op.attemptsRemaining != null ? op.attemptsRemaining : 4;
    hkGameOver          = false;

    hackRenderAttempts();
    hackRenderNoise();

    var logEl2 = document.getElementById('hack-log');

  function dotsAddHitRect(svg, lineIdx, x, y, w, h) {
    var SVGNS = 'http://www.w3.org/2000/svg';
    var rect = document.createElementNS(SVGNS, 'rect');
    rect.setAttribute('x', x);
    rect.setAttribute('y', y);
    rect.setAttribute('width', w);
    rect.setAttribute('height', h);
    rect.setAttribute('fill', 'transparent');
    rect.style.cursor = 'pointer';
    rect.addEventListener('mouseenter', function() { rect.setAttribute('fill', 'rgba(255,255,255,0.18)'); });
    rect.addEventListener('mouseleave', function() { rect.setAttribute('fill', 'transparent'); });
    rect.addEventListener('click', function() {
      if (dotsCanDraw) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'dots_draw', lineIdx: lineIdx }));
        }
      } else {
        dotsFlashTurnMsg();
      }
    });
    svg.appendChild(rect);
  }

  function dotsRenderGrid(svg) {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var SVGNS = 'http://www.w3.org/2000/svg';
    var CELL = DOTS_CELL;

    // Claimed squares (background)
    Object.keys(dotsSquares).forEach(function(key) {
      var parts = key.split(',');
      var r = parseInt(parts[0], 10), c = parseInt(parts[1], 10);
      var claimedBy = dotsSquares[key];
      var color = dotsPlayerColors[claimedBy] || '#888';

      var rect = document.createElementNS(SVGNS, 'rect');
      rect.setAttribute('x', c * CELL + 11);
      rect.setAttribute('y', r * CELL + 11);
      rect.setAttribute('width', CELL - 2);
      rect.setAttribute('height', CELL - 2);
      rect.setAttribute('fill', color);
      rect.setAttribute('fill-opacity', '0.3');
      svg.appendChild(rect);

      var text = document.createElementNS(SVGNS, 'text');
      text.setAttribute('x', c * CELL + 11 + (CELL - 2) / 2);
      text.setAttribute('y', r * CELL + 11 + (CELL - 2) / 2 + 4);
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('font-size', '11');
      text.setAttribute('fill', color);
      text.textContent = (claimedBy || '').slice(0, 2).toUpperCase();
      svg.appendChild(text);
    });

    // Clickable hit areas for undrawn lines
    for (var row = 0; row < DOTS_GRID; row++) {
      for (var col = 0; col < DOTS_COLS; col++) {
        var hidx = dotsHIdx(row, col);
        if (dotsLines[hidx]) continue;
        dotsAddHitRect(svg, hidx, col * CELL + 15, row * CELL + 6, CELL - 10, 8);
      }
    }
    for (var vrow = 0; vrow < DOTS_COLS; vrow++) {
      for (var vcol = 0; vcol < DOTS_GRID; vcol++) {
        var vidx = dotsVIdx(vrow, vcol);
        if (dotsLines[vidx]) continue;
        dotsAddHitRect(svg, vidx, vcol * CELL + 6, vrow * CELL + 15, 8, CELL - 10);
      }
    }

    // Drawn lines
    for (var row2 = 0; row2 < DOTS_GRID; row2++) {
      for (var col2 = 0; col2 < DOTS_COLS; col2++) {
        var hidx2 = dotsHIdx(row2, col2);
        var drawnBy = dotsLines[hidx2];
        if (!drawnBy) continue;
        var line = document.createElementNS(SVGNS, 'line');
        line.setAttribute('x1', col2 * CELL + 10);
        line.setAttribute('y1', row2 * CELL + 10);
        line.setAttribute('x2', (col2 + 1) * CELL + 10);
        line.setAttribute('y2', row2 * CELL + 10);
        line.setAttribute('stroke', dotsPlayerColors[drawnBy] || '#fff');
        line.setAttribute('stroke-width', '3');
        line.setAttribute('stroke-linecap', 'round');
        svg.appendChild(line);
      }
    }
    for (var vrow2 = 0; vrow2 < DOTS_COLS; vrow2++) {
      for (var vcol2 = 0; vcol2 < DOTS_GRID; vcol2++) {
        var vidx2 = dotsVIdx(vrow2, vcol2);
        var drawnBy2 = dotsLines[vidx2];
        if (!drawnBy2) continue;
        var vline = document.createElementNS(SVGNS, 'line');
        vline.setAttribute('x1', vcol2 * CELL + 10);
        vline.setAttribute('y1', vrow2 * CELL + 10);
        vline.setAttribute('x2', vcol2 * CELL + 10);
        vline.setAttribute('y2', (vrow2 + 1) * CELL + 10);
        vline.setAttribute('stroke', dotsPlayerColors[drawnBy2] || '#fff');
        vline.setAttribute('stroke-width', '3');
        vline.setAttribute('stroke-linecap', 'round');
        svg.appendChild(vline);
      }
    }

    // Dots (drawn on top)
    for (var dr = 0; dr < DOTS_GRID; dr++) {
      for (var dc = 0; dc < DOTS_GRID; dc++) {
        var dot = document.createElementNS(SVGNS, 'circle');
        dot.setAttribute('cx', dc * CELL + 10);
        dot.setAttribute('cy', dr * CELL + 10);
        dot.setAttribute('r', DOTS_DOT_R);
        dot.setAttribute('fill', '#aaaaaa');
        svg.appendChild(dot);
      }
    }
  }

  function dotsHandleUpdate(op) {

    dotsLines[op.lineIdx] = op.drawnBy;

      dotsSquares[s.r + ',' + s.c] = s.claimedBy;
    });
    if (op.playerColors && typeof op.playerColors === 'object') {
      for (var u in op.playerColors) { dotsPlayerColors[u] = op.playerColors[u]; }
    }
    dotsScores = Array.isArray(op.scores) ? op.scores.slice() : dotsScores;

    if (op.drawnBy === dotsMyUsername) {
      dotsCanDraw = !!(op.newSquares && op.newSquares.length > 0);
    } else {
      dotsCanDraw = true;
    }

    var svg = document.getElementById('dots-svg');
    if (svg) dotsRenderGrid(svg);
    dotsRenderScores();

    if (op.gameComplete) {
      var turnMsgEl = document.getElementById('dots-turn-msg');
      if (turnMsgEl) { turnMsgEl.textContent = 'board complete! new game starting…'; turnMsgEl.style.color = 'var(--yellow)'; }
    } else {
      dotsUpdateTurnMsg();
    }
  }

  function dotsHandleNewGame(op) {
    var turnMsgEl = document.getElementById('dots-turn-msg');
    if (turnMsgEl) {
      turnMsgEl.textContent = '🟦 ' + op.winner + ' won with ' + op.winnerSquares + ' squares! new game starting…';
      turnMsgEl.style.color = 'var(--yellow)';
    }
    if (dotsNewGameTimer) clearTimeout(dotsNewGameTimer);
    dotsNewGameTimer = setTimeout(function() {
      dotsNewGameTimer = null;
      if (!document.getElementById('dots-overlay')) return;
      dotsGameId        = op.gameId;
      dotsEndsAt         = op.endsAt;
      dotsLines          = Array.isArray(op.lines) ? op.lines.slice() : new Array(DOTS_TOTAL_LINES).fill(null);
      dotsSquares        = (op.squares && typeof op.squares === 'object') ? Object.assign({}, op.squares) : {};
      dotsScores         = Array.isArray(op.scores) ? op.scores.slice() : [];
      dotsPlayerColors   = (op.playerColors && typeof op.playerColors === 'object') ? Object.assign({}, op.playerColors) : {};
      dotsCanDraw        = !!op.canDraw;

      var statusEl = document.getElementById('dots-status');
      if (statusEl) {
        var endsDate = new Date(dotsEndsAt * 1000);
        statusEl.textContent = 'board resets ' + endsDate.toLocaleDateString() + ' or when all lines are drawn';
      }
      var svg = document.getElementById('dots-svg');
      if (svg) dotsRenderGrid(svg);
      dotsRenderScores();
      dotsUpdateTurnMsg();
    }, 3000);
  }

  function closeDots() {
    var overlay = document.getElementById('dots-overlay');
    if (overlay) overlay.remove();
    if (dotsErrorTimer) { clearTimeout(dotsErrorTimer); dotsErrorTimer = null; }
    if (dotsNewGameTimer) { clearTimeout(dotsNewGameTimer); dotsNewGameTimer = null; }
    dotsGameId = null; dotsLines = []; dotsSquares = {}; dotsCanDraw = false;
    dotsPlayerColors = {}; dotsScores = []; dotsEndsAt = 0;
    focusInputEnd(input);
  }

  // ===== Auth overlay logic =====
  (function(){
    var authOverlay = document.getElementById('auth-overlay');
    if (!authOverlay) { connectWebSocket(); return; }

    var loginForm  = document.getElementById('login-form');
    var joinForm   = document.getElementById('join-form');
    var tabLoginBtn = document.getElementById('tab-login');
    var tabJoinBtn  = document.getElementById('tab-join');
    var authErrorEl = document.getElementById('auth-error');
    var forgotLinkEl   = document.getElementById('forgot-link');
    var forgotPanel    = document.getElementById('forgot-panel');
    var forgotInput    = document.getElementById('forgot-input');
    var forgotSubmit   = document.getElementById('forgot-submit');
    var forgotResult   = document.getElementById('forgot-result');

    // ===== Boot sequence =====
    var BOOT_LINES = [
      'DEADNET UNIFIED ACCESS SYSTEM v0.13',
      '(C) 1997-∞ DEAD INTERNET SOCIETY',
      'NODE 01 · 2400 BAUD (EMULATED)',
      'CARRIER DETECTED',
      'HANDSHAKE OK'
    ];
    function runBootSequence() {
      var bootEl = document.getElementById('auth-boot');
      var postBoot = document.getElementById('auth-post-boot');
      if (!bootEl || !postBoot) return;
      var finished = false;
      function finish() {
        if (finished) return;
        finished = true;
        bootEl.hidden = true;
        postBoot.hidden = false;
        document.removeEventListener('keydown', skip);
        document.removeEventListener('click', skip);
        var u = document.getElementById('l-user');
        if (u) u.focus();
      }
      function skip() {
        if (finished) return;
        bootEl.textContent = BOOT_LINES.join('\n');
        finish();
      }
      var reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      if (reduced) { skip(); return; }
      document.addEventListener('keydown', skip);
      document.addEventListener('click', skip);
      var lineIdx = 0, charIdx = 0, currentLineEl = null;
      function typeStep() {
        if (finished) return;
        if (lineIdx >= BOOT_LINES.length) { setTimeout(finish, 300); return; }
        if (!currentLineEl) {
          currentLineEl = document.createElement('div');
          bootEl.appendChild(currentLineEl);
        }
        var line = BOOT_LINES[lineIdx];
        if (charIdx < line.length) {
          currentLineEl.textContent = line.slice(0, charIdx + 1);
          charIdx++;
          setTimeout(typeStep, 9);
        } else {
          lineIdx++; charIdx = 0; currentLineEl = null;
          setTimeout(typeStep, 160);
        }
      }
      typeStep();
    }
    runBootSequence();

    function showAuthError(msg) {
      if (!authErrorEl) return;
      authErrorEl.textContent = msg;
      authErrorEl.hidden = false;
    }
    function clearAuthError() {
      if (!authErrorEl) return;
      authErrorEl.textContent = '';
      authErrorEl.hidden = true;
    }
    function switchTab(tab) {
      clearAuthError();
      var toLogin = tab === 'login';
      if (loginForm)   loginForm.hidden  = !toLogin;
      if (joinForm)    joinForm.hidden   = toLogin;
      if (tabLoginBtn) tabLoginBtn.classList.toggle('active', toLogin);
      if (tabJoinBtn)  tabJoinBtn.classList.toggle('active', !toLogin);
      // collapse forgot panel when switching tabs
      if (forgotPanel) forgotPanel.hidden = true;
      if (forgotResult) forgotResult.hidden = true;
    }
    if (tabLoginBtn) tabLoginBtn.addEventListener('click', function(){ switchTab('login'); });
    if (tabJoinBtn)  tabJoinBtn.addEventListener('click', function(){ switchTab('join'); });

    if (forgotLinkEl) forgotLinkEl.addEventListener('click', function(){
      if (!forgotPanel) return;
      forgotPanel.hidden = !forgotPanel.hidden;
      if (!forgotPanel.hidden && forgotInput) forgotInput.focus();
    });

    if (forgotSubmit) forgotSubmit.addEventListener('click', function(){
      var val = forgotInput ? forgotInput.value.trim() : '';
      if (!val) {
        if (forgotResult) { forgotResult.textContent = 'Please enter your username or email.'; forgotResult.style.color = 'var(--spite)'; forgotResult.hidden = false; }
        return;
      }
      forgotSubmit.disabled = true;
      if (forgotResult) forgotResult.hidden = true;
      fetch('/api/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usernameOrEmail: val })
      })
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (forgotResult) {
          forgotResult.textContent = data.message || data.error || (data.ok ? 'Check your email for a recovery link.' : 'Something went wrong.');
          forgotResult.style.color = data.ok ? 'var(--venom)' : 'var(--spite)';
          forgotResult.hidden = false;
        }
        forgotSubmit.disabled = false;
      })
      .catch(function(){
        if (forgotResult) { forgotResult.textContent = 'Connection error. Try again.'; forgotResult.style.color = 'var(--spite)'; forgotResult.hidden = false; }
        forgotSubmit.disabled = false;
      });
    });

    if (forgotInput) forgotInput.addEventListener('keydown', function(e){
      if (e.key === 'Enter' && forgotSubmit) forgotSubmit.click();
    });

    function dismissOverlay(token) {
      pendingAuthToken = token || null;
      if (authOverlay) authOverlay.remove();
      connectWebSocket();
      setTimeout(function(){
        var ci = document.getElementById('cmdInput');
        if (ci) ci.focus();
      }, 0);
    }

    // After login/register, try to set SSO cookie (graceful no-op if SSO_SECRET not set),
    // then always connect WS with the token as a fallback auth mechanism.
    function completeAuth(token) {
      fetch('/api/auth/complete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ token: token })
      }).catch(function(){}).then(function(){ dismissOverlay(token); });
    }

    function getBrowserFingerprint() {
      return {
        screenResolution: screen.width + 'x' + screen.height,
        timezone: (typeof Intl !== 'undefined' && Intl.DateTimeFormat)
          ? (Intl.DateTimeFormat().resolvedOptions().timeZone || '')
          : '',
        platform: navigator.platform || '',
      };
    }

    if (loginForm) {
      loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        var userEl   = document.getElementById('l-user');
        var passEl   = document.getElementById('l-pass');
        var submitEl = loginForm.querySelector('.auth-submit');
        var username = userEl ? userEl.value.trim() : '';
        var password = passEl ? passEl.value : '';
        if (!username || !password) { showAuthError('Username and password are required.'); return; }
        clearAuthError();
        if (submitEl) submitEl.disabled = true;
        var fp = getBrowserFingerprint();
        fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password, screenResolution: fp.screenResolution, timezone: fp.timezone, platform: fp.platform })
        })
        .then(function(r){ return r.json(); })
        .then(function(data){
          if (!data.ok) { showAuthError(data.error || 'Login failed.'); if (submitEl) submitEl.disabled = false; return; }
          updateStatusUser(username);
          completeAuth(data.token);
        })
        .catch(function(){ showAuthError('Connection error. Please try again.'); if (submitEl) submitEl.disabled = false; });
      });
    }

    if (joinForm) {
      joinForm.addEventListener('submit', function(e) {
        e.preventDefault();
        var userEl   = document.getElementById('j-user');
        var passEl   = document.getElementById('j-pass');
        var emailEl  = document.getElementById('j-email');
        var reasonEl = document.getElementById('j-reason');
        var submitEl = joinForm.querySelector('.auth-submit');
        var username = userEl   ? userEl.value.trim()   : '';
        var password = passEl   ? passEl.value          : '';
        var email    = emailEl  ? emailEl.value.trim()  : '';
        var reason   = reasonEl ? reasonEl.value.trim() : '';
        if (!username || !password) { showAuthError('Username and password are required.'); return; }
        if (password.length < 6)    { showAuthError('Password must be at least 6 characters.'); return; }
        if (!reason)                { showAuthError('Please tell us what brought you to DIS.'); return; }
        clearAuthError();
        if (submitEl) submitEl.disabled = true;
        var fp = getBrowserFingerprint();
        var fpValidCount = [
          fp.screenResolution && /^\d+x\d+$/.test(fp.screenResolution) && fp.screenResolution !== '0x0',
          fp.timezone && fp.timezone.length > 0,
          fp.platform && fp.platform.length > 0,
        ].filter(Boolean).length;
        var incompleteFp = fpValidCount < 2;
        fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password, email: email, signupReason: reason, screenResolution: fp.screenResolution, timezone: fp.timezone, platform: fp.platform, incompleteFp: incompleteFp })
        })
        .then(function(r){ return r.json(); })
        .then(function(data){
          if (!data.ok) { showAuthError(data.error || 'Registration failed.'); if (submitEl) submitEl.disabled = false; return; }
          updateStatusUser(username);
          completeAuth(data.token);
        })
        .catch(function(){ showAuthError('Connection error. Please try again.'); if (submitEl) submitEl.disabled = false; });
      });
    }

    // Show success banner if redirected here after a password reset
    if (location.search.indexOf('reset=success') !== -1) {
      history.replaceState({}, '', '/');
      var banner = document.createElement('div');
      banner.className = 'auth-forgot-msg';
      banner.style.cssText = 'color:var(--venom);margin-bottom:14px;text-align:left;border:1px solid var(--venom-dim);padding:8px 11px;border-radius:0';
      banner.textContent = 'Password updated. Log in with your new password.';
      var authCard = document.getElementById('auth-card');
      var authTabsEl = document.getElementById('auth-tabs');
      if (authCard && authTabsEl) authCard.insertBefore(banner, authTabsEl);
    }

    // If a valid SSO cookie exists (e.g., page refresh while logged in), skip the overlay.
    fetch('/api/me', { credentials: 'include' })
      .then(function(r){ return r.json(); })
      .then(function(data){ if (data && data.user) { updateStatusUser(data.user.username); dismissOverlay(null); } })
      .catch(function(){});
  })();
})();
</script>
