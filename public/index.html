    else if (op.result === 'lose')      { text = 'dealer wins.';          color = 'var(--red)';    }
    else if (op.result === 'tie')       { text = 'dealer wins on tie.';   color = 'var(--red)';    }

    if (resultMsg) { resultMsg.textContent = text; resultMsg.style.color = color; }
    if (payoutEl) {
      payoutEl.textContent = (op.payout > 0 ? 'won ' + fmtCr(op.payout) + ' ₢  •  ' : '') + 'balance: ' + fmtCr(bjBalance) + ' ₢';
    }
  }

  function closeBlackjack() {
    var overlay = document.getElementById('bj-overlay');
    if (overlay) overlay.remove();
    bjBalance = 0;
    focusInputEnd(input);
  }

  // ===== Auth overlay logic =====
  (function(){
    var authOverlay = document.getElementById('auth-overlay');
    if (!authOverlay) { connectWebSocket(); return; }

    var loginForm  = document.getElementById('login-form');
    var joinForm   = document.getElementById('join-form');
    var tabLoginBtn = document.getElementById('tab-login');
    var tabJoinBtn  = document.getElementById('tab-join');
    var authErrorEl = document.getElementById('auth-error');
    var forgotLinkEl   = document.getElementById('forgot-link');
    var forgotPanel    = document.getElementById('forgot-panel');
    var forgotInput    = document.getElementById('forgot-input');
    var forgotSubmit   = document.getElementById('forgot-submit');
    var forgotResult   = document.getElementById('forgot-result');

    function showAuthError(msg) {
      if (!authErrorEl) return;
      authErrorEl.textContent = msg;
      authErrorEl.hidden = false;
    }
    function clearAuthError() {
      if (!authErrorEl) return;
      authErrorEl.textContent = '';
      authErrorEl.hidden = true;
    }
    function switchTab(tab) {
      clearAuthError();
      var toLogin = tab === 'login';
      if (loginForm)   loginForm.hidden  = !toLogin;
      if (joinForm)    joinForm.hidden   = toLogin;
      if (tabLoginBtn) tabLoginBtn.classList.toggle('active', toLogin);
      if (tabJoinBtn)  tabJoinBtn.classList.toggle('active', !toLogin);
      // collapse forgot panel when switching tabs
      if (forgotPanel) forgotPanel.hidden = true;
      if (forgotResult) forgotResult.hidden = true;
    }
    if (tabLoginBtn) tabLoginBtn.addEventListener('click', function(){ switchTab('login'); });
    if (tabJoinBtn)  tabJoinBtn.addEventListener('click', function(){ switchTab('join'); });

    if (forgotLinkEl) forgotLinkEl.addEventListener('click', function(){
      if (!forgotPanel) return;
      forgotPanel.hidden = !forgotPanel.hidden;
      if (!forgotPanel.hidden && forgotInput) forgotInput.focus();
    });

    if (forgotSubmit) forgotSubmit.addEventListener('click', function(){
      var val = forgotInput ? forgotInput.value.trim() : '';
      if (!val) {
        if (forgotResult) { forgotResult.textContent = 'Please enter your username or email.'; forgotResult.style.color = '#ff4545'; forgotResult.hidden = false; }
        return;
      }
      forgotSubmit.disabled = true;
      if (forgotResult) forgotResult.hidden = true;
      fetch('/api/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usernameOrEmail: val })
      })
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (forgotResult) {
          forgotResult.textContent = data.message || data.error || (data.ok ? 'Check your email for a recovery link.' : 'Something went wrong.');
          forgotResult.style.color = data.ok ? '#19c3c3' : '#ff4545';
          forgotResult.hidden = false;
        }
        forgotSubmit.disabled = false;
      })
      .catch(function(){
        if (forgotResult) { forgotResult.textContent = 'Connection error. Try again.'; forgotResult.style.color = '#ff4545'; forgotResult.hidden = false; }
        forgotSubmit.disabled = false;
      });
    });

    if (forgotInput) forgotInput.addEventListener('keydown', function(e){
      if (e.key === 'Enter' && forgotSubmit) forgotSubmit.click();
    });

    function dismissOverlay(token) {
      pendingAuthToken = token || null;
      if (authOverlay) authOverlay.remove();
      connectWebSocket();
      setTimeout(function(){
        var ci = document.getElementById('cmdInput');
        if (ci) ci.focus();
      }, 0);
    }

    // After login/register, try to set SSO cookie (graceful no-op if SSO_SECRET not set),
    // then always connect WS with the token as a fallback auth mechanism.
    function completeAuth(token) {
      fetch('/api/auth/complete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ token: token })
      }).catch(function(){}).then(function(){ dismissOverlay(token); });
    }

    function getBrowserFingerprint() {
      return {
        screenResolution: screen.width + 'x' + screen.height,
        timezone: (typeof Intl !== 'undefined' && Intl.DateTimeFormat)
          ? (Intl.DateTimeFormat().resolvedOptions().timeZone || '')
          : '',
        platform: navigator.platform || '',
      };
    }

    if (loginForm) {
      loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        var userEl   = document.getElementById('l-user');
        var passEl   = document.getElementById('l-pass');
        var submitEl = loginForm.querySelector('.auth-submit');
        var username = userEl ? userEl.value.trim() : '';
        var password = passEl ? passEl.value : '';
        if (!username || !password) { showAuthError('Username and password are required.'); return; }
        clearAuthError();
        if (submitEl) submitEl.disabled = true;
        var fp = getBrowserFingerprint();
        fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password, screenResolution: fp.screenResolution, timezone: fp.timezone, platform: fp.platform })
        })
        .then(function(r){ return r.json(); })
        .then(function(data){
          if (!data.ok) { showAuthError(data.error || 'Login failed.'); if (submitEl) submitEl.disabled = false; return; }
          completeAuth(data.token);
        })
        .catch(function(){ showAuthError('Connection error. Please try again.'); if (submitEl) submitEl.disabled = false; });
      });
    }

    if (joinForm) {
      joinForm.addEventListener('submit', function(e) {
        e.preventDefault();
        var userEl   = document.getElementById('j-user');
        var passEl   = document.getElementById('j-pass');
        var emailEl  = document.getElementById('j-email');
        var reasonEl = document.getElementById('j-reason');
        var submitEl = joinForm.querySelector('.auth-submit');
        var username = userEl   ? userEl.value.trim()   : '';
        var password = passEl   ? passEl.value          : '';
        var email    = emailEl  ? emailEl.value.trim()  : '';
        var reason   = reasonEl ? reasonEl.value.trim() : '';
        if (!username || !password) { showAuthError('Username and password are required.'); return; }
        if (password.length < 6)    { showAuthError('Password must be at least 6 characters.'); return; }
        if (!reason)                { showAuthError('Please tell us what brought you to DIS.'); return; }
        clearAuthError();
        if (submitEl) submitEl.disabled = true;
        var fp = getBrowserFingerprint();
        var fpValidCount = [
          fp.screenResolution && /^\d+x\d+$/.test(fp.screenResolution) && fp.screenResolution !== '0x0',
          fp.timezone && fp.timezone.length > 0,
          fp.platform && fp.platform.length > 0,
        ].filter(Boolean).length;
        var incompleteFp = fpValidCount < 2;
        fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password, email: email, signupReason: reason, screenResolution: fp.screenResolution, timezone: fp.timezone, platform: fp.platform, incompleteFp: incompleteFp })
        })
        .then(function(r){ return r.json(); })
        .then(function(data){
          if (!data.ok) { showAuthError(data.error || 'Registration failed.'); if (submitEl) submitEl.disabled = false; return; }
          completeAuth(data.token);
        })
        .catch(function(){ showAuthError('Connection error. Please try again.'); if (submitEl) submitEl.disabled = false; });
      });
    }

    // Show success banner if redirected here after a password reset
    if (location.search.indexOf('reset=success') !== -1) {
      history.replaceState({}, '', '/');
      var banner = document.createElement('div');
      banner.className = 'auth-forgot-msg';
      banner.style.cssText = 'color:#19c3c3;margin-bottom:14px;text-align:left;border:1px solid rgba(25,195,195,.3);padding:8px 11px;border-radius:4px';
      banner.textContent = 'Password updated. Log in with your new password.';
      var authCard = document.getElementById('auth-card');
      var authTabsEl = document.getElementById('auth-tabs');
      if (authCard && authTabsEl) authCard.insertBefore(banner, authTabsEl);
    }

    // If a valid SSO cookie exists (e.g., page refresh while logged in), skip the overlay.
    fetch('/api/me', { credentials: 'include' })
      .then(function(r){ return r.json(); })
      .then(function(data){ if (data && data.user) dismissOverlay(null); })
      .catch(function(){});
  })();
})();
</script>
