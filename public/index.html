<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<title>Dead Internet Society</title>
<style>
  :root{
    --bg:#000;--fg:#E6E6E6;--red:#FF4545;--green:#2FD44F;--yellow:#E3C600;
    --blue:#3AA0FF;--magenta:#CC66FF;--cyan:#19C3C3;--white:#FFF;
    --accent:var(--cyan);--panel:#050505;--scroll-thumb:#19C3C380;--scroll-track:#0b0b0b;
    --inputbar-h: clamp(44px, 5vh, 72px);
  }
  html,body{height:100%;background:var(--bg);overflow:hidden}
  body{margin:0;color:var(--fg);font:14px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;letter-spacing:.2px}
  .app{height:100vh;display:flex;flex-direction:column;background:var(--bg)}
  @supports (height:100dvh){.app{height:100dvh}}
  #terminal{flex:1 1 auto;padding:12px 14px 18px;box-sizing:border-box;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable both-edges;scrollbar-width:thin;scrollbar-color:var(--scroll-thumb) var(--scroll-track);border-bottom:1px solid #0e0e0e}
  #terminal::-webkit-scrollbar{width:8px}
  #terminal::-webkit-scrollbar-track{background:var(--scroll-track)}
  #terminal::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:8px}
  #terminal::-webkit-scrollbar-thumb:hover{background:#19C3C3B3}
  .line{white-space:pre-wrap;word-wrap:break-word}
  .line a{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-decoration-color:var(--accent);transition:color .12s ease,text-decoration-color .12s ease;cursor:pointer}
  .line a:hover{color:var(--white);text-decoration-color:var(--white)}
  .dim{opacity:.75}
  .red{color:var(--red)} .green{color:var(--green)} .yellow{color:var(--yellow)}
  .blue{color:var(--blue)} .magenta{color:var(--magenta)} .cyan{color:var(--cyan)} .white{color:var(--white)}
  .u{text-decoration:underline}
  img.emoji{display:inline-block;height:1.35em;width:auto;vertical-align:middle;image-rendering:pixelated}
  .rule{height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin:8px 0}
  .banner{background:linear-gradient(180deg,#0a0a0a 0%,#050505 100%);border:1px solid #121212;padding:10px 12px;margin-bottom:10px}
  #inputbar{flex:0 0 var(--inputbar-h);display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);box-sizing:border-box}
  .prompt{color:var(--accent)}
  .prompt.limit{color:var(--accent)}
  .prompt.limit.limit-over{color:var(--red)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  #cmdForm{display:flex;flex:1 1 auto;gap:8px;min-width:0;align-items:center}
  .input-shell{position:relative;flex:1 1 auto;min-width:0}
  .input-shell > *{width:100%;box-sizing:border-box;display:block}
  .input-shell > *[hidden]{display:none !important}
  #cmdInput,#cmdTextarea{background:#0c0c0c;color:var(--fg);border:1px solid #151515;outline:0;padding:10px 12px;border-radius:6px;caret-color:var(--accent);font:inherit}
  #cmdInput{min-height:0}
  #cmdTextarea{min-height:120px;resize:vertical;line-height:1.4;display:block}
  #cmdInput::placeholder,#cmdTextarea::placeholder{color:#6a6a6a}
  .input-toggle{appearance:none;border:1px solid #1b1b1b;background:#0d0d0d;color:var(--fg);padding:8px 10px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;line-height:1}
  .input-toggle:hover{border-color:#2a2a2a}
  .input-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .input-toggle.active{color:var(--accent);border-color:#2a2a2a;background:#111}
  .input-toggle-icon{font-size:16px;line-height:1}
  #inputbar.expanded{align-items:flex-start;flex:0 0 auto;padding:10px 12px 12px}
  #inputbar.expanded .prompt{padding-top:8px}
  #inputbar.expanded #cmdForm{align-items:flex-start}
  #inputbar.expanded #cmdForm .btn{align-self:flex-start;margin-top:2px}
  .btn{appearance:none;border:1px solid #1b1b1b;background:#0d0d0d;color:var(--fg);padding:9px 12px;border-radius:6px;cursor:pointer}
  .btn:hover{border-color:#2a2a2a}
  .btn:disabled{cursor:not-allowed;opacity:.55}
  .svg-splash-wrap{display:flex;justify-content:center;margin:8px 0 12px}
  .svg-splash{max-width:960px;width:96%;height:auto;display:block}
  .line.me {
  background: rgba(25,195,195,0.08);         /* faint cyan wash */
  border-left: 2px solid var(--accent);
  padding-left: 8px;
}
#pxa-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;box-sizing:border-box}
#pxa-modal{--cell:clamp(22px,3.5vmin,32px);background:#0a0a0a;border:1px solid #222;border-radius:6px;display:flex;flex-direction:column;gap:10px;padding:16px;max-height:98vh;overflow:auto;width:fit-content;max-width:98vw}
#pxa-title{color:var(--cyan);font-weight:bold;font-size:13px;letter-spacing:1px;text-align:center}
#pxa-grid{display:grid;grid-template-columns:repeat(16,var(--cell));grid-template-rows:repeat(16,var(--cell));border:1px solid #2a2a2a;cursor:crosshair;touch-action:none;user-select:none;-webkit-user-select:none}
canvas.pxa-thumb{display:inline-block;vertical-align:middle;image-rendering:pixelated;image-rendering:crisp-edges;flex-shrink:0}
.pxa-cell{width:var(--cell);height:var(--cell);box-sizing:border-box;background:#111}
.pxa-cell:hover{outline:1px solid rgba(255,255,255,.25);outline-offset:-1px;z-index:1}
#pxa-palette{display:flex;flex-wrap:wrap;gap:4px}
.pxa-swatch{width:22px;height:22px;border-radius:3px;border:2px solid transparent;cursor:pointer;box-sizing:border-box;flex-shrink:0}
.pxa-swatch.active{border-color:#fff;box-shadow:0 0 0 1px #000}
#pxa-tools{display:flex;gap:6px;align-items:center}
.pxa-tool-btn{appearance:none;border:1px solid #333;background:#111;color:var(--fg);padding:5px 10px;border-radius:4px;cursor:pointer;font:inherit;font-size:12px}
.pxa-tool-btn.active{border-color:var(--cyan);color:var(--cyan)}
.pxa-tool-btn:hover{border-color:#555}
#pxa-bottom{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#pxa-name{background:#0c0c0c;color:var(--fg);border:1px solid #222;border-radius:4px;padding:6px 10px;font:inherit;font-size:12px;flex:1;min-width:120px;outline:none;caret-color:var(--cyan)}
#pxa-name:focus{border-color:#444}
#pxa-name::placeholder{color:#555}
.pxa-action-btn{appearance:none;border:1px solid #333;background:#111;color:var(--fg);padding:6px 14px;border-radius:4px;cursor:pointer;font:inherit;font-size:12px}
.pxa-action-btn.primary{border-color:var(--cyan);color:var(--cyan)}
.pxa-action-btn:hover{border-color:#555}
.pxa-action-btn.primary:hover{background:rgba(25,195,195,.1)}

/* ===== Wordle modal ===== */
#wordle-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:1000;padding:12px;box-sizing:border-box}
#wordle-modal{--tile:clamp(40px,11vw,52px);--key:clamp(22px,7vw,30px);background:#0a0a0a;border:1px solid #222;border-radius:6px;display:flex;flex-direction:column;gap:10px;padding:16px 14px;max-height:98vh;overflow:auto;width:min(360px,98vw);box-sizing:border-box}
#wordle-title{color:var(--cyan);font-weight:bold;font-size:13px;letter-spacing:1px;text-align:center}
#wordle-streak{text-align:center;font-size:11px;color:#888;margin-top:-4px}
#wordle-grid{display:flex;flex-direction:column;gap:5px;align-items:center}
.wl-row{display:flex;gap:5px}
.wl-tile{width:var(--tile);height:var(--tile);border:1px solid #2a2a2a;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,4.5vw,22px);font-weight:bold;text-transform:uppercase;color:var(--fg);box-sizing:border-box;transition:background .15s,border-color .15s}
.wl-tile.correct{background:#2fd44f;border-color:#2fd44f;color:#000}
.wl-tile.present{background:#e3c600;border-color:#e3c600;color:#000}
.wl-tile.absent{background:#1e1e1e;border-color:#1e1e1e;color:#666}
.wl-tile.filled{border-color:#555}
#wordle-msg{text-align:center;font-size:12px;min-height:16px;color:var(--red)}
#wordle-input-row{display:flex;gap:6px}
#wordle-guess-input{background:#0c0c0c;color:var(--fg);border:1px solid #2a2a2a;border-radius:4px;padding:8px 10px;font:inherit;font-size:15px;flex:1;outline:none;caret-color:var(--cyan);text-transform:uppercase;letter-spacing:4px;min-width:0}
#wordle-guess-input:focus{border-color:#444}
#wordle-submit-btn{appearance:none;background:rgba(25,195,195,.1);border:1px solid var(--cyan);color:var(--cyan);border-radius:4px;padding:8px 12px;cursor:pointer;font:inherit;font-size:12px;white-space:nowrap}
#wordle-submit-btn:disabled{opacity:.35;cursor:not-allowed}
#wordle-keyboard{display:flex;flex-direction:column;gap:5px;align-items:center}
.wl-kb-row{display:flex;gap:4px;justify-content:center}
.wl-key{appearance:none;background:#1e1e1e;border:1px solid #2a2a2a;color:var(--fg);border-radius:4px;padding:0;cursor:pointer;font:inherit;font-size:clamp(10px,3vw,13px);font-weight:bold;width:var(--key);height:calc(var(--key)*1.35);display:flex;align-items:center;justify-content:center;text-transform:uppercase;flex-shrink:0}
.wl-key.wide{width:calc(var(--key)*1.6);font-size:clamp(9px,2.5vw,11px)}
.wl-key.correct{background:#2fd44f;border-color:#2fd44f;color:#000}
.wl-key.present{background:#e3c600;border-color:#e3c600;color:#000}
.wl-key.absent{background:#111;border-color:#111;color:#444}
#wordle-result{display:none;flex-direction:column;gap:8px;align-items:center;text-align:center}
#wordle-result.show{display:flex}
#wordle-result-msg{font-size:13px;font-weight:bold}
#wordle-chrome{font-size:11px;color:var(--yellow)}
#wordle-share-text{background:#111;border:1px solid #222;border-radius:4px;padding:10px;font-size:13px;white-space:pre;line-height:1.6;cursor:pointer;color:var(--fg);width:100%;box-sizing:border-box;text-align:left;font-family:inherit}
#wordle-share-text:hover{border-color:#333}
.wl-copy-hint{font-size:10px;color:#555}
#wordle-footer{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.wl-footer-btn{appearance:none;border:1px solid #2a2a2a;background:#111;color:var(--fg);border-radius:4px;padding:6px 14px;cursor:pointer;font:inherit;font-size:12px}
.wl-footer-btn:hover{border-color:#444}
#wordle-stats-panel{display:none;flex-direction:column;gap:6px}
#wordle-stats-panel.show{display:flex}
#wordle-stats-panel h3{margin:0;font-size:12px;color:var(--yellow);font-weight:bold;letter-spacing:.5px}
.wl-stat-row{font-size:12px;color:var(--cyan)}

/* ===== Slots modal ===== */
#slots-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:1000;padding:12px;box-sizing:border-box}
#slots-modal{background:#0a0a0a;border:1px solid #222;border-radius:6px;display:flex;flex-direction:column;gap:10px;padding:16px 14px;width:min(340px,98vw);box-sizing:border-box}
#slots-title{color:var(--cyan);font-weight:bold;font-size:13px;letter-spacing:1px;text-align:center}
#slots-jackpot{text-align:center;font-size:14px;font-weight:bold;color:var(--yellow)}
#slots-balance{text-align:center;font-size:12px;color:#888}
#slots-reels{display:flex;justify-content:center;gap:6px;font-size:36px;line-height:1.2;padding:6px 0}
.sl-reel{width:48px;text-align:center}
#slots-msg{text-align:center;font-size:13px;font-weight:bold;min-height:18px}
#slots-spin-btn{appearance:none;border:1px solid var(--cyan);background:rgba(25,195,195,.1);color:var(--cyan);font:inherit;font-size:14px;font-weight:bold;padding:10px;border-radius:5px;cursor:pointer;width:100%;letter-spacing:.4px}
#slots-spin-btn:hover:not(:disabled){background:rgba(25,195,195,.18)}
#slots-spin-btn:disabled{opacity:.35;cursor:not-allowed}
#slots-history{font-size:11px;color:#555;display:flex;flex-direction:column;gap:3px;min-height:16px}
#slots-close-btn{appearance:none;border:1px solid #333;background:none;color:#888;font:inherit;font-size:12px;padding:7px;border-radius:4px;cursor:pointer;width:100%}
#slots-close-btn:hover{border-color:#555;color:var(--fg)}

/* ===== Blackjack modal ===== */
#bj-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:1000;padding:12px;box-sizing:border-box}
#bj-modal{background:#0a0a0a;border:1px solid #222;border-radius:6px;display:flex;flex-direction:column;gap:10px;padding:16px 14px;width:min(360px,98vw);box-sizing:border-box}
#bj-title{color:var(--cyan);font-weight:bold;font-size:13px;letter-spacing:1px;text-align:center}
#bj-subtitle{text-align:center;font-size:10px;color:#555;margin-top:-4px}
#bj-balance{text-align:center;font-size:12px;color:#888}
#bj-dealer-area,#bj-player-area{background:#111;border:1px solid #1a1a1a;border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.bj-area-label{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:.6px}
.bj-cards{font-size:17px;letter-spacing:1px;color:var(--fg);min-height:1.4em;word-break:break-all}
.bj-val{font-size:11px;color:#888;min-height:1em}
#bj-msg{text-align:center;font-size:12px;font-weight:bold;min-height:16px}
#bj-bet-row{display:flex;gap:6px;align-items:center}
#bj-bet-input{background:#0c0c0c;color:var(--fg);border:1px solid #2a2a2a;border-radius:4px;padding:8px 10px;font:inherit;font-size:13px;flex:1;outline:none;caret-color:var(--cyan);min-width:0}
#bj-bet-input:focus{border-color:#444}
#bj-deal-btn{appearance:none;border:1px solid var(--cyan);background:rgba(25,195,195,.1);color:var(--cyan);font:inherit;font-size:13px;font-weight:bold;padding:8px 14px;border-radius:4px;cursor:pointer;white-space:nowrap}
#bj-deal-btn:hover:not(:disabled){background:rgba(25,195,195,.18)}
#bj-deal-btn:disabled{opacity:.35;cursor:not-allowed}
#bj-action-row{display:flex;gap:8px}
.bj-action-btn{appearance:none;border:1px solid #333;background:#111;color:var(--fg);font:inherit;font-size:13px;font-weight:bold;padding:9px;border-radius:4px;cursor:pointer;flex:1}
.bj-action-btn:hover:not(:disabled){border-color:#555}
.bj-action-btn:disabled{opacity:.35;cursor:not-allowed}
.bj-action-btn.primary{border-color:var(--cyan);color:var(--cyan);background:rgba(25,195,195,.08)}
.bj-action-btn.primary:hover:not(:disabled){background:rgba(25,195,195,.16)}
#bj-result-msg{text-align:center;font-size:14px;font-weight:bold}
#bj-payout{text-align:center;font-size:11px;color:var(--yellow)}
#bj-close-btn{appearance:none;border:1px solid #333;background:none;color:#888;font:inherit;font-size:12px;padding:7px;border-radius:4px;cursor:pointer;width:100%}
#bj-close-btn:hover{border-color:#555;color:var(--fg)}

/* ===== Auth overlay ===== */
#auth-overlay{position:fixed;inset:0;z-index:2000;background:#000;display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:0 0 48px;box-sizing:border-box}
#auth-splash{width:100%;align-self:stretch;flex-shrink:0}
.dis-header{text-align:center;padding:clamp(20px,4.5vh,44px) 24px clamp(16px,3vh,28px);position:relative;border-bottom:1px solid #111}
.dis-header::after{content:'';position:absolute;bottom:-1px;left:8%;right:8%;height:1px;background:linear-gradient(90deg,transparent,#19c3c3 35%,#cc66ff 65%,transparent)}
.dis-title{font-size:clamp(20px,4.5vw,44px);font-weight:700;color:#ff00ff;letter-spacing:.06em;line-height:1.1;margin-bottom:clamp(7px,1.4vh,12px);text-shadow:0 0 8px #ff00ff,0 0 22px #cc66ff,0 0 50px #cc66ff}
.dis-tagline{font-size:clamp(11px,1.3vw,14px);color:#e6e6e6;opacity:.8;letter-spacing:.03em}
#auth-card{width:100%;max-width:390px;border:1px solid #1a1a1a;border-radius:8px;background:#050505;padding:24px 24px 20px;box-sizing:border-box;margin:clamp(16px,3vh,28px) 12px 0}
#auth-tabs{display:flex;gap:0;margin-bottom:20px;border-bottom:1px solid #111}
.auth-tab{appearance:none;background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;color:#555;font:inherit;font-size:13px;letter-spacing:.2px;padding:8px 18px;cursor:pointer;transition:color .1s}
.auth-tab.active{color:var(--cyan);border-bottom-color:var(--cyan)}
.auth-tab:hover:not(.active){color:var(--fg)}
.auth-field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.auth-field label{font-size:10px;color:#777;letter-spacing:.8px;text-transform:uppercase}
.auth-field input{background:#0c0c0c;color:var(--fg);border:1px solid #1a1a1a;outline:0;padding:9px 11px;border-radius:5px;font:inherit;caret-color:var(--cyan)}
.auth-field input:focus{border-color:#2e2e2e}
.auth-optional{font-size:10px;color:#444;text-transform:none;letter-spacing:0;font-weight:400}
.auth-required{color:var(--red)}
.auth-submit{appearance:none;border:1px solid var(--cyan);background:rgba(25,195,195,.07);color:var(--cyan);font:inherit;font-size:13px;padding:10px;border-radius:5px;cursor:pointer;width:100%;margin-top:4px;letter-spacing:.4px;transition:background .12s}
.auth-submit:hover{background:rgba(25,195,195,.14)}
.auth-submit:disabled{opacity:.4;cursor:not-allowed}
#auth-error{background:rgba(255,69,69,.08);border:1px solid rgba(255,69,69,.35);border-radius:4px;color:var(--red);padding:8px 11px;font-size:12px;margin-bottom:13px;line-height:1.45}
.auth-forgot{color:var(--cyan);font-size:12px;cursor:pointer;margin-top:12px;text-align:center;opacity:.65}
.auth-forgot:hover{opacity:1}
.auth-forgot-msg{color:#555;font-size:11px;margin-top:8px;text-align:center;line-height:1.45}
</style>
</head>
<body>
  <div id="auth-overlay">
    <div id="auth-splash">
      <div class="dis-header">
        <div class="dis-title">DEAD INTERNET SOCIETY</div>
        <div class="dis-tagline">a small handmade internet &bull; just people &bull; just weirdos</div>
      </div>
    </div>
    <div id="auth-card">
      <div id="auth-tabs">
        <button type="button" class="auth-tab active" id="tab-login">Log In</button>
        <button type="button" class="auth-tab" id="tab-join">Join</button>
      </div>
      <div id="auth-error" hidden></div>
      <form id="login-form" autocomplete="off" novalidate>
        <div class="auth-field">
          <label for="l-user">Username</label>
          <input id="l-user" type="text" autocomplete="username" spellcheck="false" autofocus>
        </div>
        <div class="auth-field">
          <label for="l-pass">Password</label>
          <input id="l-pass" type="password" autocomplete="current-password">
        </div>
        <button type="submit" class="auth-submit">Log In</button>
        <div class="auth-forgot" id="forgot-link">Forgot password?</div>
        <div id="forgot-panel" hidden>
          <div class="auth-field" style="margin-top:12px">
            <label for="forgot-input">Username or email address</label>
            <input id="forgot-input" type="text" spellcheck="false" autocomplete="username email">
          </div>
          <button type="button" class="auth-submit" id="forgot-submit" style="margin-top:0">Send Recovery Email</button>
          <div id="forgot-result" class="auth-forgot-msg" hidden></div>
        </div>
      </form>
      <form id="join-form" autocomplete="off" novalidate hidden>
        <div class="auth-field">
          <label for="j-user">Username</label>
          <input id="j-user" type="text" autocomplete="username" spellcheck="false">
        </div>
        <div class="auth-field">
          <label for="j-pass">Password <span class="auth-optional">min 6 characters</span></label>
          <input id="j-pass" type="password" autocomplete="new-password">
        </div>
        <div class="auth-field">
          <label for="j-email">Email <span class="auth-optional">optional &mdash; for password recovery</span></label>
          <input id="j-email" type="email" autocomplete="email">
        </div>
        <div class="auth-field">
          <label for="j-reason">What brought you to DIS? <span class="auth-required">*</span></label>
          <input id="j-reason" type="text" spellcheck="false">
        </div>
        <button type="submit" class="auth-submit">Join</button>
      </form>
    </div>
  </div>

  <div class="app">
    <div id="terminal" aria-live="polite" aria-atomic="false">
      <div class="line dim">connecting…</div>
    </div>
    <div id="inputbar">
      <div class="prompt">DIS&gt;</div>
      <button type="button" id="inputToggle" class="input-toggle" aria-pressed="false">
        <span class="input-toggle-icon" aria-hidden="true">⤢</span>
        <span class="input-toggle-label sr-only">Expand input</span>
      </button>
      <form id="cmdForm" autocomplete="off">
        <div class="input-shell">
          <input id="cmdInput" type="text" placeholder="Type here…" spellcheck="false" autofocus>
          <textarea id="cmdTextarea" placeholder="Type here…" spellcheck="false" hidden></textarea>
        </div>
        <button class="btn" type="submit">Enter</button>
      </form>
    </div>
  </div>

<script>
(function(){
  var term  = document.getElementById('terminal');
  var inputBar = document.getElementById('inputbar');
  var form  = document.getElementById('cmdForm');
  var singleInput = document.getElementById('cmdInput');
  var textareaInput = document.getElementById('cmdTextarea');
  var inputToggleBtn = document.getElementById('inputToggle');
  var inputToggleIcon = inputToggleBtn && inputToggleBtn.querySelector('.input-toggle-icon');
  var inputToggleLabel = inputToggleBtn && inputToggleBtn.querySelector('.input-toggle-label');
  var input = singleInput || textareaInput;
  var submitBtn = form ? form.querySelector('button[type="submit"]') : null;
  var promptEl = document.querySelector('.prompt');
  var promptDefault = 'DIS>';
  var promptLabel = promptDefault;
  var inputLimit = null;
  var isExpandedInput = false;
  var pendingPlayWindow = null;
  var pendingAuthToken = null;

  if (singleInput && textareaInput){
    textareaInput.value = singleInput.value || '';
    if (!textareaInput.placeholder) textareaInput.placeholder = singleInput.placeholder || '';
  }

  if (!textareaInput && inputToggleBtn){
    inputToggleBtn.hidden = true;
  }

  // ===== Audio support =====
  var AUDIO_CACHE = new Map();
  var AUDIO_UNLOCKED = false;
  var BEEP_CTX = null;

  function unlockAudioOnce(){
    AUDIO_UNLOCKED = true;
    try { if (!BEEP_CTX) BEEP_CTX = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
  // Unlock on first user interaction (required by autoplay policies)
  window.addEventListener('pointerdown', unlockAudioOnce, { once: true });
  window.addEventListener('keydown', unlockAudioOnce, { once: true });

  function op_audio(src, volume){
    if (!src || !AUDIO_UNLOCKED) return;
    var key = String(src);
    var a = AUDIO_CACHE.get(key);
    if (!a){
      a = new Audio(key);
      a.preload = 'auto';
      AUDIO_CACHE.set(key, a);
    }
    try {
      if (typeof volume === 'number') a.volume = Math.max(0, Math.min(1, volume));
      a.currentTime = 0;
      a.play().catch(function(){ /* ignore: user has not interacted yet */ });
    } catch(e){ /* ignore */ }
  }

  function op_beep(kind){
    if (!AUDIO_UNLOCKED || !BEEP_CTX) return;
    try {
      var o = BEEP_CTX.createOscillator();
      var g = BEEP_CTX.createGain();
      o.connect(g); g.connect(BEEP_CTX.destination);
      o.type = 'triangle';
      // pick a short attention tone; vary by kind if desired
      o.frequency.value = (kind === 'mention') ? 880 : 660;

      var now = BEEP_CTX.currentTime;
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.25, now + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);

      o.start(now);
      o.stop(now + 0.17);
    } catch(e){ /* ignore */ }
  }

  function op_auth(token){
    if (!token) return;
    fetch('/api/auth/complete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ token: token })
    }).then(function(res){
      if (!res.ok) throw new Error('Auth completion failed');
    }).catch(function(err){
      console.error('SSO auth completion failed', err);
    });
  }

  // ===== Autoscroll helpers =====
  function isNearBottom(el, threshold){ threshold = typeof threshold === 'number' ? threshold : 40;
    return (el.scrollHeight - el.scrollTop - el.clientHeight) < threshold; }
  function scrollToBottom(el){ el.scrollTop = el.scrollHeight; }

  // ===== Render ops =====
  function op_clear(){ term.innerHTML = ''; }
  function op_print(text, cls){
    var stick = isNearBottom(term);
    var d = document.createElement('div');
    d.className = 'line' + (cls ? ' ' + cls : '');
    d.textContent = text || '';
    term.appendChild(d);
    if (stick) scrollToBottom(term);
  }
  function op_printHTML(html, cls){
    var stick = isNearBottom(term);
    var d = document.createElement('div');
    d.className = 'line' + (cls ? ' ' + cls : '');
    d.innerHTML = html || '';
    d.querySelectorAll('canvas.pxa-thumb').forEach(function(c){ renderPixelThumb(c); });
    term.appendChild(d);
    if (stick) scrollToBottom(term);
  }

  function renderPixelThumb(canvas){
    var raw = canvas.getAttribute('data-pixels');
    if (!raw) return;
    var data; try { data = JSON.parse(raw); } catch { return; }
    if (!Array.isArray(data) || data.length !== 256) return;
    var ctx = canvas.getContext('2d');
    if (!ctx) return;
    ctx.imageSmoothingEnabled = false;
    ctx.mozImageSmoothingEnabled = false;
    ctx.webkitImageSmoothingEnabled = false;
    ctx.msImageSmoothingEnabled = false;
    canvas.style.imageRendering = 'pixelated';
    canvas.style.background = 'transparent';
    canvas.style.border = 'none';
    canvas.style.outline = 'none';
    var scale = canvas.width / 16;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var i = 0; i < 256; i++){
      var c = data[i];
      if (!c || typeof c !== 'string' || !/^#[0-9a-f]{6}$/i.test(c)) continue;
      var px = i % 16, py = Math.floor(i / 16);
      ctx.fillStyle = c;
      ctx.fillRect(px * scale, py * scale, scale, scale);
    }
  }
  function op_hr(){
    var stick = isNearBottom(term);
    var d = document.createElement('div'); d.className = 'rule';
    term.appendChild(d);
    if (stick) scrollToBottom(term);
  }
  function op_setInput(type, placeholder){
    if (singleInput){
      try { if (type && singleInput.type !== type) singleInput.type = type; } catch(e){}
    }
    if (typeof placeholder !== 'undefined'){
      if (singleInput) singleInput.placeholder = placeholder;
      if (textareaInput) textareaInput.placeholder = placeholder;
    }
    updatePromptDisplay();
  }

  function syncInputMirror(source){
    if (!source || !singleInput || !textareaInput) return;
    var target = source === singleInput ? textareaInput : singleInput;
    if (target && target.value !== source.value) target.value = source.value;
  }

  function focusInputEnd(el){
    if (!el || typeof el.focus !== 'function') return;
    setTimeout(function(){
      try {
        el.focus();
        if (typeof el.setSelectionRange === 'function'){
          var len = el.value != null ? String(el.value).length : 0;
          el.setSelectionRange(len, len);
        }
      } catch(e){}
    }, 0);
  }

  function updateToggleVisual(){
    if (!inputToggleBtn) return;
    var expanded = !!isExpandedInput;
    inputToggleBtn.setAttribute('aria-pressed', expanded ? 'true' : 'false');
    if (inputToggleIcon) inputToggleIcon.textContent = expanded ? '⤡' : '⤢';
    if (inputToggleLabel) inputToggleLabel.textContent = expanded ? 'Collapse input' : 'Expand input';
    inputToggleBtn.classList.toggle('active', expanded);
    inputToggleBtn.title = expanded ? 'Collapse input' : 'Expand input';
  }

  function setInputExpanded(expanded){
    expanded = !!expanded;
    if (!singleInput && !textareaInput){
      isExpandedInput = false;
      input = null;
      updateToggleVisual();
      updatePromptDisplay();
      return;
    }

    if (!textareaInput){
      expanded = false;
    }

    if (singleInput) singleInput.hidden = expanded;
    if (textareaInput) textareaInput.hidden = !expanded;

    if (singleInput && textareaInput){
      var from = expanded ? singleInput : textareaInput;
      var to = expanded ? textareaInput : singleInput;
      if (from && to && to.value !== from.value){
        to.value = from.value;
      }
    }

    isExpandedInput = expanded;
    input = expanded ? (textareaInput || singleInput) : (singleInput || textareaInput);
    if (inputBar) inputBar.classList.toggle('expanded', expanded);
    updateToggleVisual();
    updatePromptDisplay();
    focusInputEnd(input);
  }
  function normalizedLimit(value){
    if (value === null || typeof value === 'undefined') return null;
    if (typeof value === 'number' && Number.isFinite(value)) {
      if (value < 0) return 0;
      return Math.floor(value);
    }
    var parsed = Number(value);
    if (!Number.isFinite(parsed)) return null;
    if (parsed < 0) return 0;
    return Math.floor(parsed);
  }

  function currentInputLength(){
    if (!input) return 0;
    return String(input.value || '').length;
  }

  function isLimitExceeded(){
    return inputLimit != null && currentInputLength() > inputLimit;
  }

  function updateSubmitState(){
    if (!submitBtn) return;
    var over = isLimitExceeded();
    submitBtn.disabled = over;
  }

  function updatePromptDisplay(){
    if (promptEl){
      if (inputLimit != null){
        var remaining = inputLimit - currentInputLength();
        var text = remaining >= 0
          ? (remaining + ' left')
          : (Math.abs(remaining) + ' over');
        promptEl.textContent = text;
        promptEl.classList.add('limit');
        if (remaining < 0) promptEl.classList.add('limit-over');
        else promptEl.classList.remove('limit-over');
      } else {
        promptEl.textContent = promptLabel;
        promptEl.classList.remove('limit');
        promptEl.classList.remove('limit-over');
      }
    }
    updateSubmitState();
  }

  function setInputLimit(limit){
    inputLimit = normalizedLimit(limit);
    updatePromptDisplay();
  }

  function setPromptLabel(prefix){
    promptLabel = String(prefix || promptDefault);
    updatePromptDisplay();
  }

  function op_setPrompt(prefix){
    setPromptLabel(prefix);
  }

  function op_openUrl(url){
    if (!url) return;
    try {
      window.open(String(url), '_blank', 'noopener,noreferrer');
    } catch(e) {
      console.error('Failed to open URL', e);
    }
  }
  function op_reload(){
    try {
      window.location.reload();
    } catch(e) {
      window.location.href = window.location.href;
    }
  }

  // ===== WebSocket =====
  var proto = (location.protocol === 'https:' ? 'wss:' : 'ws:');
  var ws = null;
  var reconnectAttempts = 0;
  var reconnectTimer = null;
  var hasConnectedOnce = false;
  var reconnectNoticeShown = false;

  function websocketUrl(){
    return proto + '//' + location.host + '/ws';
  }

  function reconnectDelay(attempt){
    var base = 1000;
    var maxDelay = 30000;
    var exp = Math.pow(2, Math.max(0, attempt - 1));
    return Math.min(maxDelay, base * exp);
  }

  function clearReconnectTimer(){
    if (reconnectTimer != null) {
      clearTimeout(reconnectTimer);
      reconnectTimer = null;
    }
  }

  function scheduleReconnect(immediate){
    if (reconnectTimer != null) {
      if (!immediate) return;
      clearReconnectTimer();
    }
    if (hasConnectedOnce && !reconnectNoticeShown) {
      reconnectNoticeShown = true;
      op_print('Connection lost. Attempting to reconnect…', 'yellow');
    }
    reconnectAttempts += 1;
    var delay = immediate ? 0 : reconnectDelay(reconnectAttempts);
    reconnectTimer = setTimeout(function(){
      reconnectTimer = null;
      connectWebSocket();
    }, delay);
  }

  function connectWebSocket(){
    var socket;
    try {
      socket = new WebSocket(websocketUrl());
    } catch (err) {
      console.error('WebSocket creation failed', err);
      ws = null;
      scheduleReconnect();
      return;
    }

    ws = socket;

    socket.addEventListener('open', function(){
      if (socket !== ws) return;
      var wasReconnecting = reconnectAttempts > 0;
      hasConnectedOnce = true;
      reconnectNoticeShown = false;
      reconnectAttempts = 0;
      clearReconnectTimer();
      if (wasReconnecting) op_print('Reconnected to server.', 'green');
      try {
        var initPayload = { type: 'init' };
        if (pendingAuthToken) { initPayload.token = pendingAuthToken; pendingAuthToken = null; }
        socket.send(JSON.stringify(initPayload));
      } catch (err) {
        console.error('WebSocket init send failed', err);
      }
    });

    socket.addEventListener('message', function(ev){
      if (socket !== ws) return;
      var msg; try { msg = JSON.parse(ev.data); } catch { return; }
      if (msg.type === 'ops' && Array.isArray(msg.ops)) {
        msg.ops.forEach(function(op){
          if (op.op === 'clear') op_clear();
          else if (op.op === 'print') op_print(op.text, op.cls);
          else if (op.op === 'printHTML') op_printHTML(op.html, op.cls);
          else if (op.op === 'hr') op_hr();
          else if (op.op === 'setInput') op_setInput(op.inputType, op.placeholder);
          else if (op.op === 'setPrompt') op_setPrompt(op.prefix);
          else if (op.op === 'setInputLimit') setInputLimit(op.limit);
          else if (op.op === 'reload') op_reload();
          else if (op.op === 'audio') op_audio(op.src, op.volume);
          else if (op.op === 'beep') op_beep(op.kind);
          else if (op.op === 'auth') op_auth(op.token);
          else if (op.op === 'openUrl') op_openUrl(op.url);
          else if (op.op === 'openPixelEditor') openPixelEditor(op.id || null, op.name || null, op.pixel_data || null);
          else if (op.op === 'openWordle') openWordle(op.state || {});
          else if (op.op === 'wordleGuessResult') wordleHandleGuessResult(op);
          else if (op.op === 'wordleError') wordleShowError(op.message || 'Error.');
          else if (op.op === 'openSlots') openSlots();
          else if (op.op === 'slots_result') slotsHandleResult(op);
          else if (op.op === 'slots_state') slotsHandleState(op);
          else if (op.op === 'openBlackjack') openBlackjack(op);
          else if (op.op === 'blackjack_state') blackjackHandleState(op);
          else if (op.op === 'blackjack_result') blackjackHandleResult(op);
        });
      }
    });

    socket.addEventListener('close', function(ev){
      if (socket !== ws) return;
      ws = null;
      setInputLimit(null);
      if (ev && ev.code === 4001) {
        return;
      }
      scheduleReconnect();
    });

    socket.addEventListener('error', function(err){
      if (socket !== ws) return;
      console.error('WebSocket error', err);
      try { socket.close(); } catch (closeErr) {
        console.error('WebSocket close after error failed', closeErr);
      }
    });
  }

  window.addEventListener('online', function(){
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      scheduleReconnect(true);
    }
  });

  function submitCurrentInput(){
    if (!input) return false;
    if (isLimitExceeded()) return false;
    var raw = (input.value || '').trim();
    if (!raw) return false;
    if (/^\/play\b/i.test(raw)) {
      var playArg = raw.replace(/^\/play\b/i, '').trim();
      if (playArg) {
        try {
          pendingPlayWindow = window.open('about:blank', '_blank', 'noopener,noreferrer');
          if (pendingPlayWindow) {
            pendingPlayWindow.__playTimeoutId = setTimeout(function(){
              if (pendingPlayWindow && !pendingPlayWindow.closed) {
                pendingPlayWindow.close();
              }
              pendingPlayWindow = null;
            }, 3000);
          }
        } catch (e) {
          pendingPlayWindow = null;
        }
      }
    }
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'input', raw: raw }));
    } else {
      op_print('Still reconnecting. Message not sent.', 'yellow');
    }
    input.value = '';
    if (singleInput && singleInput !== input) singleInput.value = '';
    if (textareaInput && textareaInput !== input) textareaInput.value = '';
    updatePromptDisplay();
    focusInputEnd(input);
    return true;
  }

  function handleInputEvent(ev){
    if (ev && ev.target) {
      var target = ev.target;
      if (target && typeof target.value === 'string' && target.value.charAt(0) === ' ') {
        target.value = '/' + target.value.slice(1);
      }
      syncInputMirror(target);
    }
    updatePromptDisplay();
  }

  function handleInputKeydown(ev){
    if (ev.key === ' ' || ev.code === 'Space') {
      var target = ev.target;
      if (target && String(target.value || '').length === 0) {
        ev.preventDefault();
        target.value = '/';
        syncInputMirror(target);
        updatePromptDisplay();
        focusInputEnd(target);
        return;
      }
    }
    if (ev.key === 'Enter'){
      if (isLimitExceeded()){
        ev.preventDefault();
        ev.stopPropagation();
        return;
      }
      var activeTextarea = (input === textareaInput && textareaInput && !textareaInput.hidden);
      if (activeTextarea && !ev.shiftKey && !ev.altKey && !ev.metaKey && !ev.ctrlKey){
        ev.preventDefault();
        submitCurrentInput();
      }
    }
  }

  if (singleInput){
    singleInput.addEventListener('input', handleInputEvent);
    singleInput.addEventListener('keydown', handleInputKeydown);
  }
  if (textareaInput){
    textareaInput.addEventListener('input', handleInputEvent);
    textareaInput.addEventListener('keydown', handleInputKeydown);
  }

  if (inputToggleBtn){
    inputToggleBtn.addEventListener('click', function(ev){
      ev.preventDefault();
      setInputExpanded(!isExpandedInput);
    });
  }

  setInputExpanded(false);

  if (form){
    form.addEventListener('submit', function(e){
      e.preventDefault();
      submitCurrentInput();
    });
  }

  // Click anywhere to refocus input (unless interacting with a control)
  var appEl = document.querySelector('.app');
  function isFocusableTarget(el){
    if (!el) return false;
    if (el === input || el === singleInput || el === textareaInput) return true;
    if (el.closest('form')) return true;
    if (el.closest('button')) return true;
    if (el.closest('a[href]')) return true;
    if (el.isContentEditable) return true;
    return false;
  }
  function clickToFocus(ev){
    if (isFocusableTarget(ev.target)) return;
    var sel = window.getSelection && window.getSelection();
    if (sel && String(sel).length) return;
    focusInputEnd(input);
  }
  if (appEl) appEl.addEventListener('click', clickToFocus);

  // ESC quickly refocuses prompt
  document.addEventListener('keydown', function(ev){
    if (ev.key === 'Escape' && !document.getElementById('pxa-overlay') && !document.getElementById('wordle-overlay') && !document.getElementById('bj-overlay')) focusInputEnd(input);
  });

  // ===== Pixel Art Editor =====
  var PXA_PALETTE = [
    '#000000','#1a1a1a','#555555','#aaaaaa',
    '#ffffff','#ff4545','#ff8c00','#e3c600',
    '#2fd44f','#19c3c3','#3aa0ff','#cc66ff',
    '#ff69b4','#8b4513','#33ff00','#ff6b35'
  ];
  var pxaData = null, pxaEditId = null, pxaColor = PXA_PALETTE[4], pxaEraser = false, pxaPainting = false;
  document.addEventListener('mouseup', function(){ pxaPainting = false; });

  function openPixelEditor(editId, editName, editPixels){
    if (document.getElementById('pxa-overlay')) return;
    if (typeof editPixels === 'string'){ try { editPixels = JSON.parse(editPixels); } catch { editPixels = null; } }
    pxaEditId = (typeof editId === 'number' && editId > 0) ? editId : null;
    pxaData = new Array(256).fill(null);
    if (pxaEditId && Array.isArray(editPixels)){
      for (var pi = 0; pi < editPixels.length && pi < 256; pi++){
        var pv = editPixels[pi];
        if (pv && typeof pv === 'string' && /^#[0-9a-f]{6}$/i.test(pv)) pxaData[pi] = pv;
      }
    }
    pxaColor = PXA_PALETTE[4]; pxaEraser = false; pxaPainting = false;

    var overlay = document.createElement('div'); overlay.id = 'pxa-overlay';
    var modal = document.createElement('div'); modal.id = 'pxa-modal';

    var title = document.createElement('div'); title.id = 'pxa-title';
    title.textContent = 'PIXEL EDITOR — 16\xd716'; modal.appendChild(title);

    var grid = document.createElement('div'); grid.id = 'pxa-grid';
    var cells = new Array(256);
    for (var gi = 0; gi < 256; gi++){
      var cell = document.createElement('div');
      cell.className = 'pxa-cell'; cell.dataset.i = gi;
      cells[gi] = cell; grid.appendChild(cell);
    }
    if (pxaEditId){
      for (var ci = 0; ci < 256; ci++){
        if (pxaData[ci]) cells[ci].style.background = pxaData[ci];
      }
    }
    modal.appendChild(grid);

    var paletteEl = document.createElement('div'); paletteEl.id = 'pxa-palette';
    var swatches = [];
    var pencilBtn, eraserBtn;
    PXA_PALETTE.forEach(function(c){
      var sw = document.createElement('div');
      sw.className = 'pxa-swatch' + (c === pxaColor ? ' active' : '');
      sw.style.background = c; sw.title = c;
      sw.addEventListener('click', function(){
        pxaColor = c; pxaEraser = false;
        swatches.forEach(function(s){ s.classList.remove('active'); });
        sw.classList.add('active');
        if (pencilBtn){ pencilBtn.classList.add('active'); }
        if (eraserBtn){ eraserBtn.classList.remove('active'); }
      });
      swatches.push(sw); paletteEl.appendChild(sw);
    });
    modal.appendChild(paletteEl);

    var toolsEl = document.createElement('div'); toolsEl.id = 'pxa-tools';
    pencilBtn = document.createElement('button');
    pencilBtn.className = 'pxa-tool-btn active'; pencilBtn.type = 'button';
    pencilBtn.textContent = '✏ Pencil';
    eraserBtn = document.createElement('button');
    eraserBtn.className = 'pxa-tool-btn'; eraserBtn.type = 'button';
    eraserBtn.textContent = '□ Eraser';
    var clearBtn = document.createElement('button');
    clearBtn.className = 'pxa-tool-btn'; clearBtn.type = 'button';
    clearBtn.textContent = '× Clear';
    pencilBtn.addEventListener('click', function(){
      pxaEraser = false;
      pencilBtn.classList.add('active'); eraserBtn.classList.remove('active');
    });
    eraserBtn.addEventListener('click', function(){
      pxaEraser = true;
      eraserBtn.classList.add('active'); pencilBtn.classList.remove('active');
    });
    clearBtn.addEventListener('click', function(){
      pxaData = new Array(256).fill(null);
      cells.forEach(function(c){ c.style.background = ''; });
    });
    toolsEl.appendChild(pencilBtn); toolsEl.appendChild(eraserBtn); toolsEl.appendChild(clearBtn);
    modal.appendChild(toolsEl);

    var bottomEl = document.createElement('div'); bottomEl.id = 'pxa-bottom';
    var nameInput = document.createElement('input');
    nameInput.id = 'pxa-name'; nameInput.type = 'text';
    nameInput.placeholder = 'name (a-z, 0-9, hyphens)';
    nameInput.maxLength = 32; nameInput.spellcheck = false; nameInput.autocomplete = 'off';
    nameInput.addEventListener('input', function(){
      nameInput.value = nameInput.value.toLowerCase().replace(/[^a-z0-9-]/g, '');
    });
    if (editName) nameInput.value = editName;
    var saveBtn = document.createElement('button');
    saveBtn.className = 'pxa-action-btn primary'; saveBtn.type = 'button'; saveBtn.textContent = 'Save';
    var cancelBtn = document.createElement('button');
    cancelBtn.className = 'pxa-action-btn'; cancelBtn.type = 'button'; cancelBtn.textContent = 'Cancel';
    nameInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') saveBtn.click(); });
    saveBtn.addEventListener('click', function(){
      var name = nameInput.value.trim();
      if (!name){ op_print('Enter a name before saving.', 'yellow'); return; }
      if (!/^[a-z0-9-]{1,32}$/.test(name)){ op_print('Name must be lowercase letters, numbers, and hyphens only.', 'yellow'); return; }
      if (ws && ws.readyState === WebSocket.OPEN){
        if (pxaEditId){
          ws.send(JSON.stringify({ type: 'update_pixel_art', id: pxaEditId, name: name, pixel_data: pxaData }));
        } else {
          ws.send(JSON.stringify({ type: 'save_pixel_art', name: name, pixel_data: pxaData }));
        }
        closePixelEditor();
        ws.send(JSON.stringify({ type: 'input', raw: '/art' }));
      } else {
        op_print('Not connected. Cannot save.', 'red');
      }
    });
    cancelBtn.addEventListener('click', function(){
      var wasEditing = !!pxaEditId;
      closePixelEditor();
      if (wasEditing && ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'input', raw: '/art' }));
    });
    bottomEl.appendChild(nameInput); bottomEl.appendChild(saveBtn); bottomEl.appendChild(cancelBtn);
    modal.appendChild(bottomEl);
    overlay.appendChild(modal); document.body.appendChild(overlay);

    function paintAt(target){
      if (!target || !target.classList || !target.classList.contains('pxa-cell')) return;
      var idx = parseInt(target.dataset.i, 10);
      if (isNaN(idx) || idx < 0 || idx >= 256) return;
      if (pxaEraser){ pxaData[idx] = null; target.style.background = ''; }
      else { pxaData[idx] = pxaColor; target.style.background = pxaColor; }
    }
    grid.addEventListener('mousedown', function(e){
      if (e.button !== 0) return;
      pxaPainting = true; paintAt(e.target); e.preventDefault();
    });
    grid.addEventListener('mousemove', function(e){
      if (!pxaPainting) return; paintAt(e.target);
    });
    grid.addEventListener('touchstart', function(e){
      pxaPainting = true;
      var t = e.touches[0];
      paintAt(document.elementFromPoint(t.clientX, t.clientY));
      e.preventDefault();
    }, { passive: false });
    grid.addEventListener('touchmove', function(e){
      if (!pxaPainting) return;
      var t = e.touches[0];
      paintAt(document.elementFromPoint(t.clientX, t.clientY));
      e.preventDefault();
    }, { passive: false });
    grid.addEventListener('touchend', function(){ pxaPainting = false; });

    function pxaEscHandler(e){
      if (e.key === 'Escape'){
        var wasEditing = !!pxaEditId;
        closePixelEditor();
        document.removeEventListener('keydown', pxaEscHandler);
        if (wasEditing && ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'input', raw: '/art' }));
      }
    }
    document.addEventListener('keydown', pxaEscHandler);
    setTimeout(function(){ nameInput.focus(); }, 50);
  }

  function closePixelEditor(){
    var overlay = document.getElementById('pxa-overlay');
    if (overlay) overlay.remove();
    pxaData = null; pxaEditId = null; pxaPainting = false;
    focusInputEnd(input);
  }

  // ===== Wordle =====
  var wlTiles = [];      // [row][col] → DOM element
  var wlKeys  = {};      // letter → DOM element
  var wlCurrentRow = 0;
  var wlSubmitting = false;
  var wlGameOver = false;
  var wlTerminal = false;   // true once game reaches solved/failed state (db written)
  var wlFromScreen = null;  // screen the user was on before opening the modal
  var wlGuessInput = null;
  var wlMsgEl = null;

  // ===== Slots =====
  var slSpinning      = false;
  var slAnimating     = false;
  var slPendingResult = null;
  var slHistory       = [];

  // ===== Blackjack =====
  var bjBalance = 0;

  function fmtCr(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  function openWordle(data) {
    if (document.getElementById('wordle-overlay')) return;
    data = data || {};
    var prevGuesses = Array.isArray(data.guesses) ? data.guesses : [];
    wlCurrentRow  = prevGuesses.length;
    wlSubmitting  = false;
    wlGameOver    = !!data.gameOver;
    wlTerminal    = !!data.gameOver;
    wlFromScreen  = data.fromScreen || null;
    wlTiles       = [];
    wlKeys        = {};

    var overlay = document.createElement('div'); overlay.id = 'wordle-overlay';
    var modal   = document.createElement('div'); modal.id   = 'wordle-modal';

    // Title
    var titleEl = document.createElement('div'); titleEl.id = 'wordle-title';
    titleEl.textContent = 'WORDLE'; modal.appendChild(titleEl);

    // Streak
    var streakEl = document.createElement('div'); streakEl.id = 'wordle-streak';
    streakEl.textContent = 'streak: ' + (data.streak || 0) + ' • best: ' + (data.bestStreak || 0);
    modal.appendChild(streakEl);

    // 6×5 grid
    var gridEl = document.createElement('div'); gridEl.id = 'wordle-grid';
    for (var r = 0; r < 6; r++) {
      var row = document.createElement('div'); row.className = 'wl-row';
      wlTiles.push([]);
      for (var c = 0; c < 5; c++) {
        var tile = document.createElement('div'); tile.className = 'wl-tile';
        wlTiles[r].push(tile); row.appendChild(tile);
      }
      gridEl.appendChild(row);
    }
    modal.appendChild(gridEl);

    // Restore previous guesses
    prevGuesses.forEach(function(g, ri) {
      var letters = (g.guess || '').split('');
      var result  = Array.isArray(g.result) ? g.result : [];
      for (var ci = 0; ci < 5; ci++) {
        var t = wlTiles[ri][ci];
        t.textContent = (letters[ci] || '').toUpperCase();
        var res = result[ci] ? result[ci].result : 'absent';
        t.className = 'wl-tile ' + res;
      }
    });

    // Error / message area
    wlMsgEl = document.createElement('div'); wlMsgEl.id = 'wordle-msg';
    modal.appendChild(wlMsgEl);

    // Input row (hidden if game over)
    var inputRow = document.createElement('div'); inputRow.id = 'wordle-input-row';
    wlGuessInput = document.createElement('input');
    wlGuessInput.id = 'wordle-guess-input'; wlGuessInput.type = 'text';
    wlGuessInput.maxLength = 5; wlGuessInput.autocomplete = 'off';
    wlGuessInput.spellcheck = false; wlGuessInput.placeholder = 'guess';
    wlGuessInput.addEventListener('input', function() {
      var v = wlGuessInput.value.toLowerCase().replace(/[^a-z]/g, '').slice(0, 5);
      wlGuessInput.value = v.toUpperCase();
      wlUpdateCurrentRowPreview(v);
    });
    wlGuessInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); wlSubmitGuess(); }
    });
    var submitBtn = document.createElement('button');
    submitBtn.id = 'wordle-submit-btn'; submitBtn.type = 'button'; submitBtn.textContent = 'Enter';
    submitBtn.addEventListener('click', wlSubmitGuess);
    inputRow.appendChild(wlGuessInput); inputRow.appendChild(submitBtn);
    if (wlGameOver) inputRow.style.display = 'none';
    modal.appendChild(inputRow);

    // On-screen keyboard
    var kbEl = document.createElement('div'); kbEl.id = 'wordle-keyboard';
    var rows = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
    rows.forEach(function(rowLetters, ri) {
      var rowEl = document.createElement('div'); rowEl.className = 'wl-kb-row';
      if (ri === 2) {
        var enterKey = document.createElement('button');
        enterKey.type = 'button'; enterKey.className = 'wl-key wide'; enterKey.textContent = 'ENT';
        enterKey.addEventListener('click', wlSubmitGuess); rowEl.appendChild(enterKey);
      }
      rowLetters.split('').forEach(function(letter) {
        var keyEl = document.createElement('button');
        keyEl.type = 'button'; keyEl.className = 'wl-key'; keyEl.textContent = letter.toUpperCase();
        keyEl.dataset.letter = letter;
        keyEl.addEventListener('click', function() {
          if (wlGameOver) return;
          var cur = wlGuessInput.value.toLowerCase().replace(/[^a-z]/g, '');
          if (cur.length < 5) {
            var next = cur + letter;
            wlGuessInput.value = next.toUpperCase();
            wlUpdateCurrentRowPreview(next);
          }
        });
        wlKeys[letter] = keyEl; rowEl.appendChild(keyEl);
      });
      if (ri === 2) {
        var delKey = document.createElement('button');
        delKey.type = 'button'; delKey.className = 'wl-key wide'; delKey.textContent = '⌫';
        delKey.addEventListener('click', function() {
          if (wlGameOver) return;
          var cur = wlGuessInput.value.toLowerCase().replace(/[^a-z]/g, '');
          if (cur.length > 0) {
            var next = cur.slice(0, -1);
            wlGuessInput.value = next.toUpperCase();
            wlUpdateCurrentRowPreview(next);
          }
        });
        rowEl.appendChild(delKey);
      }
      kbEl.appendChild(rowEl);
    });
    modal.appendChild(kbEl);

    // Result panel (initially hidden unless game already over)
    var resultEl  = document.createElement('div'); resultEl.id  = 'wordle-result';
    if (wlGameOver) resultEl.className = 'show';
    var resultMsg = document.createElement('div'); resultMsg.id = 'wordle-result-msg';
    var chromeEl  = document.createElement('div'); chromeEl.id  = 'wordle-chrome';
    var shareText = document.createElement('div'); shareText.id = 'wordle-share-text';
    var copyHint  = document.createElement('div'); copyHint.className = 'wl-copy-hint';
    copyHint.textContent = 'click to copy'; resultEl.appendChild(resultMsg);
    resultEl.appendChild(chromeEl); resultEl.appendChild(shareText); resultEl.appendChild(copyHint);
    modal.appendChild(resultEl);

    if (wlGameOver) {
      if (data.solved) {
        var prevCount = prevGuesses.length;
        resultMsg.textContent = 'Solved in ' + prevCount + ' guess' + (prevCount !== 1 ? 'es' : '') + '! 💯';
        resultMsg.style.color = 'var(--green)';
      } else {
        resultMsg.textContent = 'The word was ' + (data.dailyWord || '?').toUpperCase() + ' 💀';
        resultMsg.style.color = 'var(--red)';
      }
      var grid = buildWlShareGrid(prevGuesses);
      var today = new Date().toISOString().slice(0, 10);
      shareText.textContent = 'DIS Wordle ' + today + '\n' + prevGuesses.length + '/6\n' + grid;
      shareText.addEventListener('click', function() {
        try { navigator.clipboard.writeText(shareText.textContent); copyHint.textContent = 'copied!'; }
        catch(e) { copyHint.textContent = 'select and copy manually'; }
      });
    }

    // Stats + Close buttons
    var footerEl = document.createElement('div'); footerEl.id = 'wordle-footer';
    var statsBtn = document.createElement('button');
    statsBtn.type = 'button'; statsBtn.className = 'wl-footer-btn'; statsBtn.textContent = 'Stats';
    var closeBtn = document.createElement('button');
    closeBtn.id = 'wordle-close-btn';
    closeBtn.type = 'button'; closeBtn.className = 'wl-footer-btn';
    closeBtn.textContent = wlGameOver ? 'Done' : 'Close';
    footerEl.appendChild(statsBtn); footerEl.appendChild(closeBtn);
    modal.appendChild(footerEl);

    // Stats panel
    var statsPanel = document.createElement('div'); statsPanel.id = 'wordle-stats-panel';
    modal.appendChild(statsPanel);
    statsBtn.addEventListener('click', function() {
      if (statsPanel.classList.contains('show')) {
        statsPanel.classList.remove('show'); statsPanel.innerHTML = ''; statsBtn.textContent = 'Stats';
      } else {
        statsBtn.textContent = 'Loading…';
        fetch('/api/wordle/leaderboard').then(function(r){ return r.json(); }).then(function(d){
          statsPanel.innerHTML = '';
          statsBtn.textContent = 'Stats';
          statsPanel.classList.add('show');
          function section(title, rows, key, label) {
            var h = document.createElement('h3'); h.textContent = title; statsPanel.appendChild(h);
            if (!rows.length) { var p = document.createElement('div'); p.textContent = 'No data yet.'; p.className = 'wl-stat-row'; statsPanel.appendChild(p); return; }
            rows.forEach(function(r, i) {
              var el = document.createElement('div'); el.className = 'wl-stat-row';
              el.textContent = (i+1) + '. ' + r.username + ' — ' + r[key] + ' ' + label;
              statsPanel.appendChild(el);
            });
          }
          section('Current streaks', d.currentStreaks || [], 'current_streak', 'days');
          section('Best streaks', d.bestStreaks || [], 'best_streak', 'days');
          var h3 = document.createElement('h3'); h3.textContent = "Today's results (" + (d.date||'') + ')'; statsPanel.appendChild(h3);
          var solvers = d.todaySolvers || [];
          if (!solvers.length) { var p2 = document.createElement('div'); p2.textContent = 'Nobody has solved it yet!'; p2.className = 'wl-stat-row'; statsPanel.appendChild(p2); }
          else { solvers.forEach(function(r, i) { var el = document.createElement('div'); el.className = 'wl-stat-row'; el.textContent = (i+1) + '. ' + r.username + ' in ' + r.guesses + ' guess' + (r.guesses !== 1 ? 'es' : ''); statsPanel.appendChild(el); }); }
        }).catch(function() { statsBtn.textContent = 'Stats'; });
      }
    });
    closeBtn.addEventListener('click', closeWordle);

    // Color in keyboard from previous guesses
    var keyState = {};
    prevGuesses.forEach(function(g) {
      if (!Array.isArray(g.result)) return;
      g.result.forEach(function(r) {
        var l = r.letter;
        var prev = keyState[l];
        if (r.result === 'correct') keyState[l] = 'correct';
        else if (r.result === 'present' && prev !== 'correct') keyState[l] = 'present';
        else if (!prev) keyState[l] = 'absent';
      });
    });
    Object.keys(keyState).forEach(function(l) {
      if (wlKeys[l]) { wlKeys[l].className = 'wl-key ' + (keyState[l] === 'correct' || keyState[l] === 'present' ? keyState[l] : 'absent') + (wlKeys[l].className.includes('wide') ? ' wide' : ''); }
    });

    // Escape to close
    function wlEsc(e) { if (e.key === 'Escape') { closeWordle(); document.removeEventListener('keydown', wlEsc); } }
    document.addEventListener('keydown', wlEsc);

    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    if (!wlGameOver) setTimeout(function() { if (wlGuessInput) wlGuessInput.focus(); }, 50);
  }

  function wlUpdateCurrentRowPreview(letters) {
    if (wlCurrentRow >= 6) return;
    for (var c = 0; c < 5; c++) {
      var t = wlTiles[wlCurrentRow][c];
      t.textContent = (letters[c] || '').toUpperCase();
      t.className = 'wl-tile' + (letters[c] ? ' filled' : '');
    }
  }

  function wlSubmitGuess() {
    if (wlSubmitting || wlGameOver) return;
    var guess = (wlGuessInput ? wlGuessInput.value : '').toLowerCase().replace(/[^a-z]/g, '');
    if (guess.length !== 5) { wordleShowError('Type a 5-letter word first.'); return; }
    wlSubmitting = true;
    wordleShowError('');
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'wordle_guess', guess: guess }));
    } else {
      wordleShowError('Not connected. Try again.'); wlSubmitting = false;
    }
  }

  function wordleHandleGuessResult(op) {
    wlSubmitting = false;
    if (!op.result || !Array.isArray(op.result)) return;
    var ri = (op.guessNum || 1) - 1;
    if (ri < 0 || ri >= 6) return;
    // Color the tiles
    op.result.forEach(function(r, ci) {
      var t = wlTiles[ri] && wlTiles[ri][ci];
      if (!t) return;
      t.textContent = (r.letter || '').toUpperCase();
      t.className = 'wl-tile ' + (r.result || 'absent');
    });
    // Update keyboard
    op.result.forEach(function(r) {
      var l = r.letter;
      var keyEl = wlKeys[l];
      if (!keyEl) return;
      var cur = keyEl.dataset.state || '';
      var next = r.result;
      if (cur === 'correct') return;
      if (next === 'correct' || (next === 'present' && cur !== 'correct')) {
        keyEl.dataset.state = next;
        keyEl.className = 'wl-key ' + next + (keyEl.dataset.wide ? ' wide' : '');
      } else if (!cur) {
        keyEl.dataset.state = 'absent';
        keyEl.className = 'wl-key absent' + (keyEl.dataset.wide ? ' wide' : '');
      }
    });
    wlCurrentRow = op.guessNum;
    if (wlGuessInput) wlGuessInput.value = '';
    wlUpdateCurrentRowPreview('');
    if (op.solved || op.failed) {
      wlGameOver = true;
      wlTerminal = true;
      var closeBtnEl = document.getElementById('wordle-close-btn');
      if (closeBtnEl) closeBtnEl.textContent = 'Done';
      var inputRow = document.getElementById('wordle-input-row');
      if (inputRow) inputRow.style.display = 'none';
      var resultEl = document.getElementById('wordle-result');
      var resultMsg = document.getElementById('wordle-result-msg');
      var shareText = document.getElementById('wordle-share-text');
      var copyHint  = document.querySelector('.wl-copy-hint');
      if (resultEl) resultEl.className = 'show';
      // Update streak display
      var streakEl = document.getElementById('wordle-streak');
      if (streakEl) streakEl.textContent = 'streak: ' + (op.streak || 0) + ' • best: ' + (op.bestStreak || 0);
      if (resultMsg) {
        if (op.solved) {
          resultMsg.textContent = 'Solved in ' + op.guessNum + ' guess' + (op.guessNum !== 1 ? 'es' : '') + '! 💯';
          resultMsg.style.color = 'var(--green)';
        } else {
          resultMsg.textContent = 'The word was ' + (op.dailyWord || '?').toUpperCase() + ' 💀';
          resultMsg.style.color = 'var(--red)';
        }
      }
      var chromeEl = document.getElementById('wordle-chrome');
      if (chromeEl && op.chromeEarned > 0) {
        chromeEl.textContent = 'you earned ' + op.chromeEarned + ' ₢  •  balance: ' + op.newChromeBalance + ' ₢';
      }
      if (shareText && op.emojiGrid) {
        shareText.textContent = op.emojiGrid;
        shareText.addEventListener('click', function() {
          try { navigator.clipboard.writeText(shareText.textContent); if (copyHint) copyHint.textContent = 'copied!'; }
          catch(e) { if (copyHint) copyHint.textContent = 'select and copy manually'; }
        });
      }
    }
  }

  function wordleShowError(msg) {
    if (wlMsgEl) wlMsgEl.textContent = msg || '';
  }

  function buildWlShareGrid(guesses) {
    return guesses.map(function(g) {
      var result = Array.isArray(g.result) ? g.result : [];
      return result.map(function(r) {
        return r.result === 'correct' ? '🟩' : r.result === 'present' ? '🟨' : '⬛';
      }).join('');
    }).join('\n');
  }

  function closeWordle() {
    if (wlTerminal) {
      closeWordleComplete();
    } else {
      closeWordleIncomplete();
    }
  }

  function closeWordleComplete() {
    var overlay = document.getElementById('wordle-overlay');
    if (overlay) overlay.remove();
    wlTiles = []; wlKeys = {}; wlCurrentRow = 0; wlSubmitting = false;
    wlGameOver = false; wlTerminal = false; wlFromScreen = null; wlGuessInput = null; wlMsgEl = null;
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'input', text: '/games' }));
    }
    focusInputEnd(input);
  }

  function closeWordleIncomplete() {
    var overlay = document.getElementById('wordle-overlay');
    if (overlay) overlay.remove();
    wlTiles = []; wlKeys = {}; wlCurrentRow = 0; wlSubmitting = false;
    wlGameOver = false; wlTerminal = false; wlFromScreen = null; wlGuessInput = null; wlMsgEl = null;
    focusInputEnd(input);
  }

  // ===== Slots modal =====
  function slotsApplyResult(op) {
    if (!document.getElementById('slots-overlay')) { slSpinning = false; return; }
    var msgEl   = document.getElementById('slots-msg');
    var spinBtn = document.getElementById('slots-spin-btn');
    var jpEl    = document.getElementById('slots-jackpot');
    var balEl   = document.getElementById('slots-balance');
    var histEl  = document.getElementById('slots-history');

    if (op.error) {
      if (msgEl) { msgEl.textContent = op.error; msgEl.style.color = 'var(--red)'; }
      slSpinning = false;
      if (spinBtn) spinBtn.disabled = false;
      return;
    }

    var reelEls = document.querySelectorAll('.sl-reel');
    if (Array.isArray(op.reels)) {
      op.reels.forEach(function(sym, i) { if (reelEls[i]) reelEls[i].textContent = sym; });
    }
    if (balEl) balEl.textContent = 'balance: ' + fmtCr(op.newBalance) + ' ₢';
    if (jpEl)  jpEl.textContent  = 'jackpot: ' + fmtCr(op.jackpot)   + ' ₢ 💀';
    if (msgEl) {
      msgEl.textContent = op.message || '';
      msgEl.style.color = op.jackpotWon ? 'var(--yellow)' : (op.payout > 0 ? 'var(--green)' : 'var(--red)');
    }
    if (Array.isArray(op.reels)) {
      slHistory.unshift(op.reels.join('') + '  ' + (op.message || ''));
      if (slHistory.length > 5) slHistory.pop();
    }
    if (histEl) {
      histEl.innerHTML = '';
      slHistory.forEach(function(h) {
        var d = document.createElement('div'); d.className = 'sl-history-item'; d.textContent = h;
        histEl.appendChild(d);
      });
    }
    slSpinning = false;
    if (spinBtn) spinBtn.disabled = false;
  }

  function slotsHandleResult(op) {
    if (slAnimating) { slPendingResult = op; return; }
    slotsApplyResult(op);
  }

  function slotsHandleState(op) {
    var jpEl  = document.getElementById('slots-jackpot');
    var balEl = document.getElementById('slots-balance');
    if (jpEl)  jpEl.textContent  = 'jackpot: ' + fmtCr(op.jackpot)  + ' ₢ 💀';
    if (balEl) balEl.textContent = 'balance: ' + fmtCr(op.balance) + ' ₢';
  }

  function closeSlots() {
    var overlay = document.getElementById('slots-overlay');
    if (overlay) overlay.remove();
    slSpinning = false; slAnimating = false; slPendingResult = null;
    focusInputEnd(input);
  }

  function openSlots() {
    if (document.getElementById('slots-overlay')) return;
    slSpinning = false; slAnimating = false; slPendingResult = null; slHistory = [];

    var overlay = document.createElement('div'); overlay.id = 'slots-overlay';
    var modal   = document.createElement('div'); modal.id   = 'slots-modal';

    var titleEl = document.createElement('div'); titleEl.id = 'slots-title';
    titleEl.textContent = 'SLOTS'; modal.appendChild(titleEl);

    var jpEl = document.createElement('div'); jpEl.id = 'slots-jackpot';
    jpEl.textContent = 'jackpot: … ₢ 💀'; modal.appendChild(jpEl);

    var balEl = document.createElement('div'); balEl.id = 'slots-balance';
    balEl.textContent = 'balance: … ₢'; modal.appendChild(balEl);

    var reelsEl = document.createElement('div'); reelsEl.id = 'slots-reels';
    var reelDivs = [];
    for (var ri = 0; ri < 5; ri++) {
      var rd = document.createElement('div'); rd.className = 'sl-reel'; rd.textContent = '🎰';
      reelDivs.push(rd); reelsEl.appendChild(rd);
    }
    modal.appendChild(reelsEl);

    var msgEl = document.createElement('div'); msgEl.id = 'slots-msg';
    modal.appendChild(msgEl);

    var spinBtn = document.createElement('button'); spinBtn.id = 'slots-spin-btn';
    spinBtn.type = 'button'; spinBtn.textContent = 'SPIN  (5 ₢)';
    spinBtn.addEventListener('click', doSpin);
    modal.appendChild(spinBtn);

    var histEl = document.createElement('div'); histEl.id = 'slots-history';
    modal.appendChild(histEl);

    var closeBtn = document.createElement('button'); closeBtn.id = 'slots-close-btn';
    closeBtn.type = 'button'; closeBtn.textContent = 'Close';
    closeBtn.addEventListener('click', closeSlots);
    modal.appendChild(closeBtn);

    function doSpin() {
      if (slSpinning) return;
      slSpinning = true; slAnimating = true; slPendingResult = null;
      spinBtn.disabled = true;
      msgEl.textContent = ''; msgEl.style.color = '';
      var SYMS = ['🍒', '🔔', '⭐', '💎', '💀'];
      var animInterval = setInterval(function() {
        reelDivs.forEach(function(r) { r.textContent = SYMS[Math.floor(Math.random() * SYMS.length)]; });
      }, 80);
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'slots_spin' }));
      }
      setTimeout(function() {
        clearInterval(animInterval);
        slAnimating = false;
        if (slPendingResult) { slotsApplyResult(slPendingResult); slPendingResult = null; }
      }, 600);
    }

    function slEsc(e) {
      if (e.key === 'Escape') { closeSlots(); document.removeEventListener('keydown', slEsc); }
    }
    document.addEventListener('keydown', slEsc);

    overlay.appendChild(modal);
    document.body.appendChild(overlay);

    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'slots_getstate' }));
    }
  }

  // ===== Blackjack modal =====
  function bjCardVal(c) {
    if (!c) return 0;
    if (c.rank === 'A') return 11;
    if (c.rank === 'J' || c.rank === 'Q' || c.rank === 'K') return 10;
    return parseInt(c.rank, 10);
  }

  function openBlackjack(data) {
    if (document.getElementById('bj-overlay')) return;
    data = data || {};
    bjBalance = data.balance != null ? data.balance : 0;

    var overlay = document.createElement('div'); overlay.id = 'bj-overlay';
    var modal = document.createElement('div'); modal.id = 'bj-modal';

    var titleEl = document.createElement('div'); titleEl.id = 'bj-title';
    titleEl.textContent = 'BLACKJACK'; modal.appendChild(titleEl);

    var subtitleEl = document.createElement('div'); subtitleEl.id = 'bj-subtitle';
    subtitleEl.textContent = 'simplified rules — not vegas blackjack'; modal.appendChild(subtitleEl);

    var balanceEl = document.createElement('div'); balanceEl.id = 'bj-balance';
    balanceEl.textContent = 'balance: ' + fmtCr(bjBalance) + ' ₢'; modal.appendChild(balanceEl);

    var dealerArea = document.createElement('div'); dealerArea.id = 'bj-dealer-area';
    var dealerLabel = document.createElement('div'); dealerLabel.className = 'bj-area-label'; dealerLabel.textContent = 'dealer';
    var dealerCards = document.createElement('div'); dealerCards.id = 'bj-dealer-cards'; dealerCards.className = 'bj-cards'; dealerCards.textContent = '—';
    var dealerValEl = document.createElement('div'); dealerValEl.id = 'bj-dealer-val'; dealerValEl.className = 'bj-val';
    dealerArea.appendChild(dealerLabel); dealerArea.appendChild(dealerCards); dealerArea.appendChild(dealerValEl);
    modal.appendChild(dealerArea);

    var playerArea = document.createElement('div'); playerArea.id = 'bj-player-area';
    var playerLabel = document.createElement('div'); playerLabel.className = 'bj-area-label'; playerLabel.textContent = 'you';
    var playerCards = document.createElement('div'); playerCards.id = 'bj-player-cards'; playerCards.className = 'bj-cards'; playerCards.textContent = '—';
    var playerValEl = document.createElement('div'); playerValEl.id = 'bj-player-val'; playerValEl.className = 'bj-val';
    playerArea.appendChild(playerLabel); playerArea.appendChild(playerCards); playerArea.appendChild(playerValEl);
    modal.appendChild(playerArea);

    var msgEl = document.createElement('div'); msgEl.id = 'bj-msg'; modal.appendChild(msgEl);

    var betRow = document.createElement('div'); betRow.id = 'bj-bet-row';
    var betInput = document.createElement('input'); betInput.id = 'bj-bet-input'; betInput.type = 'number';
    betInput.min = 1; betInput.max = bjBalance; betInput.placeholder = 'bet amount (₢)';
    var dealBtn = document.createElement('button'); dealBtn.id = 'bj-deal-btn'; dealBtn.type = 'button'; dealBtn.textContent = 'DEAL';
    dealBtn.addEventListener('click', bjDeal);
    betInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); bjDeal(); } });
    betRow.appendChild(betInput); betRow.appendChild(dealBtn);
    modal.appendChild(betRow);

    var actionRow = document.createElement('div'); actionRow.id = 'bj-action-row'; actionRow.style.display = 'none';
    var hitBtn = document.createElement('button'); hitBtn.id = 'bj-hit-btn'; hitBtn.type = 'button'; hitBtn.className = 'bj-action-btn'; hitBtn.textContent = 'HIT';
    hitBtn.addEventListener('click', function() { bjAction('hit'); });
    var standBtn = document.createElement('button'); standBtn.id = 'bj-stand-btn'; standBtn.type = 'button'; standBtn.className = 'bj-action-btn primary'; standBtn.textContent = 'STAND';
    standBtn.addEventListener('click', function() { bjAction('stand'); });
    actionRow.appendChild(hitBtn); actionRow.appendChild(standBtn);
    modal.appendChild(actionRow);

    var resultArea = document.createElement('div'); resultArea.id = 'bj-result-area'; resultArea.style.display = 'none';
    var resultMsg = document.createElement('div'); resultMsg.id = 'bj-result-msg';
    var payoutEl = document.createElement('div'); payoutEl.id = 'bj-payout';
    var againBtn = document.createElement('button'); againBtn.id = 'bj-again-btn'; againBtn.type = 'button'; againBtn.className = 'bj-action-btn primary'; againBtn.textContent = 'PLAY AGAIN';
    againBtn.addEventListener('click', bjPlayAgain);
    resultArea.appendChild(resultMsg); resultArea.appendChild(payoutEl); resultArea.appendChild(againBtn);
    modal.appendChild(resultArea);

    var closeBtn = document.createElement('button'); closeBtn.id = 'bj-close-btn'; closeBtn.type = 'button'; closeBtn.textContent = 'Close';
    closeBtn.addEventListener('click', closeBlackjack);
    modal.appendChild(closeBtn);

    function bjShowMsg(msg, color) {
      var el = document.getElementById('bj-msg');
      if (!el) return;
      el.textContent = msg || '';
      el.style.color = color || '';
    }

    function bjDeal() {
      var bi = document.getElementById('bj-bet-input');
      if (!bi) return;
      var bet = parseInt(bi.value, 10);
      if (!bet || bet < 1) { bjShowMsg('enter a bet amount.', 'var(--red)'); return; }
      if (bet > bjBalance) { bjShowMsg('bet exceeds your balance.', 'var(--red)'); return; }
      var db2 = document.getElementById('bj-deal-btn'); if (db2) db2.disabled = true;
      bi.disabled = true;
      bjShowMsg('');
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'blackjack_deal', bet: bet }));
      }
    }

    function bjAction(action) {
      var h = document.getElementById('bj-hit-btn'); if (h) h.disabled = true;
      var s = document.getElementById('bj-stand-btn'); if (s) s.disabled = true;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'blackjack_' + action }));
      }
    }

    function bjPlayAgain() {
      var ra = document.getElementById('bj-result-area'); if (ra) ra.style.display = 'none';
      var ar = document.getElementById('bj-action-row'); if (ar) ar.style.display = 'none';
      var dc = document.getElementById('bj-dealer-cards'); if (dc) dc.textContent = '—';
      var dv = document.getElementById('bj-dealer-val'); if (dv) dv.textContent = '';
      var pc = document.getElementById('bj-player-cards'); if (pc) pc.textContent = '—';
      var pv = document.getElementById('bj-player-val'); if (pv) pv.textContent = '';
      var br = document.getElementById('bj-bet-row');
      if (br) {
        br.style.display = 'flex';
        var bi2 = document.getElementById('bj-bet-input'); if (bi2) { bi2.disabled = false; bi2.value = ''; bi2.max = bjBalance; }
        var db3 = document.getElementById('bj-deal-btn'); if (db3) db3.disabled = bjBalance <= 0;
      }
      if (bjBalance <= 0) {
        bjShowMsg('not enough chrome to play. come back tomorrow for your daily stipend.', 'var(--red)');
      } else {
        bjShowMsg('');
        var bi3 = document.getElementById('bj-bet-input'); if (bi3) setTimeout(function() { bi3.focus(); }, 50);
      }
    }

    function bjEsc(e) {
      if (e.key === 'Escape') { closeBlackjack(); document.removeEventListener('keydown', bjEsc); }
    }
    document.addEventListener('keydown', bjEsc);

    overlay.appendChild(modal);
    document.body.appendChild(overlay);

    if (bjBalance <= 0) {
      msgEl.textContent = 'not enough chrome to play. come back tomorrow for your daily stipend.';
      msgEl.style.color = 'var(--red)';
      dealBtn.disabled = true;
      betInput.disabled = true;
    }

    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'blackjack_getstate' }));
    }

    if (bjBalance > 0) setTimeout(function() { betInput.focus(); }, 50);
  }

  function blackjackHandleState(op) {
    if (!document.getElementById('bj-overlay')) return;
    var betRow    = document.getElementById('bj-bet-row');
    var actionRow = document.getElementById('bj-action-row');
    var resultArea = document.getElementById('bj-result-area');
    var balanceEl = document.getElementById('bj-balance');
    var msgEl     = document.getElementById('bj-msg');

    if (op.balance != null) {
      bjBalance = op.balance;
      if (balanceEl) balanceEl.textContent = 'balance: ' + fmtCr(bjBalance) + ' ₢';
    }

    if (op.error) {
      if (msgEl) { msgEl.textContent = op.error; msgEl.style.color = 'var(--red)'; }
      var db4 = document.getElementById('bj-deal-btn'); if (db4) db4.disabled = bjBalance <= 0;
      var bi4 = document.getElementById('bj-bet-input'); if (bi4) bi4.disabled = false;
      return;
    }

    if (op.status === 'betting') {
      if (betRow) betRow.style.display = 'flex';
      if (actionRow) actionRow.style.display = 'none';
      if (resultArea) resultArea.style.display = 'none';
      return;
    }

    if (op.status === 'playing') {
      if (betRow) betRow.style.display = 'none';
      if (resultArea) resultArea.style.display = 'none';
      if (actionRow) actionRow.style.display = 'flex';
      var h2 = document.getElementById('bj-hit-btn'); if (h2) h2.disabled = false;
      var s2 = document.getElementById('bj-stand-btn'); if (s2) s2.disabled = false;

      var dc2 = document.getElementById('bj-dealer-cards');
      var dv2 = document.getElementById('bj-dealer-val');
      var pc2 = document.getElementById('bj-player-cards');
      var pv2 = document.getElementById('bj-player-val');

      if (dc2 && Array.isArray(op.dealerVisible)) {
        dc2.textContent = op.dealerVisible.map(function(c) { return c.rank + c.suit; }).join(' ') + ' ??';
      }
      if (dv2 && op.dealerVisible && op.dealerVisible[0]) {
        dv2.textContent = 'showing: ' + bjCardVal(op.dealerVisible[0]);
      }
      if (pc2 && Array.isArray(op.playerHand)) {
        pc2.textContent = op.playerHand.map(function(c) { return c.rank + c.suit; }).join(' ');
      }
      if (pv2 && op.playerValue != null) {
        pv2.textContent = 'value: ' + op.playerValue;
      }
    }
  }

  function blackjackHandleResult(op) {
    if (!document.getElementById('bj-overlay')) return;
    var betRow    = document.getElementById('bj-bet-row');
    var actionRow = document.getElementById('bj-action-row');
    var resultArea = document.getElementById('bj-result-area');
    var resultMsg = document.getElementById('bj-result-msg');
    var payoutEl  = document.getElementById('bj-payout');
    var balanceEl = document.getElementById('bj-balance');
    var dc3 = document.getElementById('bj-dealer-cards');
    var dv3 = document.getElementById('bj-dealer-val');
    var pc3 = document.getElementById('bj-player-cards');
    var pv3 = document.getElementById('bj-player-val');

    if (betRow) betRow.style.display = 'none';
    if (actionRow) actionRow.style.display = 'none';
    if (resultArea) { resultArea.style.display = 'flex'; resultArea.style.flexDirection = 'column'; resultArea.style.gap = '6px'; }

    if (op.newBalance != null) {
      bjBalance = op.newBalance;
      if (balanceEl) balanceEl.textContent = 'balance: ' + fmtCr(bjBalance) + ' ₢';
    }
    if (dc3 && Array.isArray(op.dealerHand)) {
      dc3.textContent = op.dealerHand.map(function(c) { return c.rank + c.suit; }).join(' ');
    }
    if (dv3 && op.dealerValue != null) { dv3.textContent = 'value: ' + op.dealerValue; }
    if (pc3 && Array.isArray(op.playerHand)) {
      pc3.textContent = op.playerHand.map(function(c) { return c.rank + c.suit; }).join(' ');
    }
    if (pv3 && op.playerValue != null) { pv3.textContent = 'value: ' + op.playerValue; }

    var text = '', color = '';
    if      (op.result === 'blackjack') { text = 'BLACKJACK! 🃏'; color = 'var(--yellow)'; }
    else if (op.result === 'win')       { text = 'you win!';              color = 'var(--green)';  }
    else if (op.result === 'bust')      { text = 'bust! 💀';    color = 'var(--red)';    }
